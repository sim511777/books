<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow11" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <rect x="100" y="15" width="500" height="55" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="38" text-anchor="middle" font-family="monospace" font-size="14" fill="black">AnimationController(vsync: this, duration: ...)</text>
  <text x="350" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="black">0.0 부터 1.0까지 시간에 따라 값 생성</text>

  <line x1="350" y1="70" x2="350" y2="93" stroke="black" stroke-width="2" marker-end="url(#arrow11)"/>

  <rect x="100" y="93" width="500" height="55" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="116" text-anchor="middle" font-family="monospace" font-size="14" fill="black">Tween&lt;double&gt;(begin: ..., end: ...).animate(controller)</text>
  <text x="350" y="136" text-anchor="middle" font-family="monospace" font-size="12" fill="black">컨트롤러 값을 원하는 범위의 값으로 변환</text>

  <line x1="350" y1="148" x2="350" y2="171" stroke="black" stroke-width="2" marker-end="url(#arrow11)"/>

  <rect x="100" y="171" width="500" height="55" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="black">Animation&lt;double&gt; (매 프레임 .value 갱신)</text>
  <text x="350" y="214" text-anchor="middle" font-family="monospace" font-size="12" fill="black">리스너들에게 값이 바뀌었다고 알림</text>

  <line x1="350" y1="226" x2="350" y2="249" stroke="black" stroke-width="2" marker-end="url(#arrow11)"/>

  <rect x="100" y="249" width="500" height="55" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="272" text-anchor="middle" font-family="monospace" font-size="14" fill="black">AnimatedBuilder(animation: ..., builder: (context, child) {...})</text>
  <text x="350" y="292" text-anchor="middle" font-family="monospace" font-size="12" fill="black">builder 콜백만 다시 실행</text>

  <line x1="350" y1="304" x2="350" y2="327" stroke="black" stroke-width="2" marker-end="url(#arrow11)"/>

  <rect x="150" y="327" width="400" height="55" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="black">화면의 해당 부분만 다시 그려짐 (전체 setState 아님)</text>
</svg>

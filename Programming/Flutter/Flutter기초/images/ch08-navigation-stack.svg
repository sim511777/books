<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="25" font-size="14" fill="#000000" font-weight="bold">push: 화면이 스택 위에 쌓인다</text>

  <!-- Left group: push sequence -->
  <!-- Screen 1 (bottom) -->
  <rect x="40" y="290" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="130" y="325" text-anchor="middle" font-size="14" fill="#000000">FirstPage</text>

  <!-- Screen 2 (middle) -->
  <rect x="55" y="230" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="145" y="265" text-anchor="middle" font-size="14" fill="#000000">SecondPage</text>

  <!-- Screen 3 (top) -->
  <rect x="70" y="170" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="160" y="205" text-anchor="middle" font-size="14" fill="#000000">ThirdPage</text>

  <!-- push arrows -->
  <line x1="270" y1="320" x2="270" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="295" font-size="11" fill="#555555">push(Second)</text>

  <line x1="290" y1="255" x2="290" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="230" font-size="11" fill="#555555">push(Third)</text>

  <text x="40" y="140" font-size="12" fill="#555555">화면이 위로 쌓일수록 나중에 push된 화면</text>
  <text x="40" y="158" font-size="12" fill="#555555">(맨 위 = 현재 사용자에게 보이는 화면)</text>

  <!-- divider -->
  <line x1="0" y1="200" x2="0" y2="200" stroke="none"/>

  <!-- Right group: pop sequence -->
  <text x="430" y="25" font-size="14" fill="#000000" font-weight="bold">pop: 스택 맨 위부터 제거된다</text>

  <!-- Stack state 1: three screens -->
  <rect x="400" y="60" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-size="10" fill="#000000">First</text>
  <rect x="410" y="35" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="55" text-anchor="middle" font-size="10" fill="#000000">Second</text>
  <rect x="420" y="10" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="30" text-anchor="middle" font-size="10" fill="#000000">Third</text>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="#555555">현재: Third 표시 중</text>

  <line x1="510" y1="55" x2="560" y2="55" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="45" text-anchor="middle" font-size="10" fill="#555555">pop()</text>

  <!-- Stack state 2: two screens -->
  <rect x="580" y="60" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="80" text-anchor="middle" font-size="10" fill="#000000">First</text>
  <rect x="590" y="35" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="630" y="55" text-anchor="middle" font-size="10" fill="#000000">Second</text>
  <text x="630" y="105" text-anchor="middle" font-size="10" fill="#555555">현재: Second 표시 중</text>

  <line x1="600" y1="120" x2="600" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="140" text-anchor="middle" font-size="10" fill="#555555">pop()</text>

  <!-- Stack state 3: one screen -->
  <rect x="560" y="160" width="80" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-size="10" fill="#000000">First</text>
  <text x="600" y="205" text-anchor="middle" font-size="10" fill="#555555">현재: First 표시 중</text>

  <text x="400" y="240" font-size="12" fill="#555555">pop을 호출할 때마다 맨 위 화면이 사라지고</text>
  <text x="400" y="258" font-size="12" fill="#555555">바로 아래 있던 화면이 다시 보입니다.</text>

  <!-- bottom explanatory box -->
  <rect x="40" y="360" width="620" height="30" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#000000">Navigator는 화면들을 스택(stack) 구조로 관리합니다: push = 쌓기, pop = 꺼내기</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

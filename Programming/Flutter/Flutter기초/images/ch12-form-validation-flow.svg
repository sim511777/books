  <line x1="350" y1="225" x2="350" y2="253" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>

  <rect x="130" y="253" width="440" height="50" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="283" text-anchor="middle" font-family="monospace" font-size="14" fill="black">_formKey.currentState!.validate()</text>

  <line x1="270" y1="303" x2="170" y2="335" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>
  <line x1="430" y1="303" x2="530" y2="335" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>

  <text x="220" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">false</text>
  <text x="480" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">true</text>

  <rect x="20" y="337" width="300" height="50" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="170" y="367" text-anchor="middle" font-family="sans-serif" font-size="13" fill="black">각 필드 아래 에러 메시지 표시</text>

  <rect x="380" y="337" width="300" height="50" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="530" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="black">.save() → onSaved 실행</text>
  <text x="530" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">→ 가입 처리</text>

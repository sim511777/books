<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow12" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <rect x="40" y="10" width="620" height="45" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="350" y="38" text-anchor="middle" font-family="monospace" font-size="15" fill="black">Form(key: _formKey, child: Column(...))</text>

  <line x1="190" y1="55" x2="190" y2="83" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>
  <line x1="510" y1="55" x2="510" y2="83" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>

  <rect x="40" y="83" width="300" height="65" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="190" y="108" text-anchor="middle" font-family="monospace" font-size="13" fill="black">TextFormField (이름)</text>
  <text x="190" y="128" text-anchor="middle" font-family="monospace" font-size="12" fill="black">validator: 비어 있으면 에러 문자열</text>

  <rect x="360" y="83" width="300" height="65" fill="white" stroke="black" stroke-width="2" rx="8"/>
  <text x="510" y="108" text-anchor="middle" font-family="monospace" font-size="13" fill="black">TextFormField (이메일)</text>
  <text x="510" y="128" text-anchor="middle" font-family="monospace" font-size="12" fill="black">validator: 형식 검사, 통과 시 null</text>

  <line x1="190" y1="148" x2="330" y2="176" stroke="black" stroke-width="2"/>
  <line x1="510" y1="148" x2="370" y2="176" stroke="black" stroke-width="2"/>
  <line x1="350" y1="176" x2="350" y2="180" stroke="black" stroke-width="2" marker-end="url(#arrow12)"/>


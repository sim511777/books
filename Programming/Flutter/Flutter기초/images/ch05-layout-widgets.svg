<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Row, Column, Stack 레이아웃 비교</text>

  <!-- Row 영역 -->
  <g>
    <rect x="30" y="60" width="190" height="300" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="125" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Row</text>
    <text x="125" y="102" text-anchor="middle" font-size="11" fill="#000000">가로 방향 배치</text>

    <rect x="45" y="180" width="40" height="40" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="95" y="180" width="40" height="40" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="145" y="180" width="40" height="40" fill="none" stroke="#000000" stroke-width="1.5"/>

    <line x1="45" y1="240" x2="185" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="256" text-anchor="middle" font-size="10" fill="#000000">주축(main axis)</text>
  </g>

  <!-- Column 영역 -->
  <g>
    <rect x="255" y="60" width="190" height="300" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="350" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Column</text>
    <text x="350" y="102" text-anchor="middle" font-size="11" fill="#000000">세로 방향 배치</text>

    <rect x="330" y="130" width="40" height="35" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="330" y="175" width="40" height="35" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="330" y="220" width="40" height="35" fill="none" stroke="#000000" stroke-width="1.5"/>

    <line x1="390" y1="130" x2="390" y2="255" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="280" text-anchor="middle" font-size="10" fill="#000000">주축(main axis)</text>
  </g>

  <!-- Stack 영역 -->
  <g>
    <rect x="480" y="60" width="190" height="300" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="575" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Stack</text>
    <text x="575" y="102" text-anchor="middle" font-size="11" fill="#000000">겹쳐서 배치</text>

    <rect x="525" y="150" width="90" height="90" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="550" y="175" width="70" height="70" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="565" y="195" width="55" height="45" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="592" y="221" text-anchor="middle" font-size="9" fill="#000000">Positioned</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

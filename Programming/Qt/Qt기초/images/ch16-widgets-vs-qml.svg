<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">QWidgets vs QML/Qt Quick: Two Ways to Build the Same UI</text>

  <!-- Column headers -->
  <rect x="30" y="56" width="400" height="34" rx="6" fill="#cfe8ff" stroke="#3f7fbf" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#123a5c">QWidgets: Imperative C++</text>

  <rect x="470" y="56" width="400" height="34" rx="6" fill="#d9f2d9" stroke="#4a9c4a" stroke-width="1.5"/>
  <text x="670" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5c1f">QML/Qt Quick: Declarative</text>

  <!-- LEFT: code steps -->
  <rect x="30" y="104" width="400" height="150" rx="6" fill="#f7f9fc" stroke="#8fb8dd" stroke-width="1.2"/>
  <text x="46" y="124" font-size="11" fill="#123a5c" font-weight="bold">main.cpp (procedure, step by step)</text>
  <text x="46" y="146" font-size="11" font-family="Consolas, monospace" fill="#333333">auto *label = new QLabel("Count: 0");</text>
  <text x="46" y="166" font-size="11" font-family="Consolas, monospace" fill="#333333">auto *button = new QPushButton("+1");</text>
  <text x="46" y="186" font-size="11" font-family="Consolas, monospace" fill="#333333">auto *layout = new QVBoxLayout(this);</text>
  <text x="46" y="206" font-size="11" font-family="Consolas, monospace" fill="#333333">layout-&gt;addWidget(label);</text>
  <text x="46" y="226" font-size="11" font-family="Consolas, monospace" fill="#333333">connect(button, &amp;QPushButton::clicked,</text>
  <text x="46" y="242" font-size="11" font-family="Consolas, monospace" fill="#333333">        this, &amp;Widget::onPlusClicked);</text>

  <!-- RIGHT: qml code -->
  <rect x="470" y="104" width="400" height="150" rx="6" fill="#f6fbf6" stroke="#8fcf8f" stroke-width="1.2"/>
  <text x="486" y="124" font-size="11" fill="#1f5c1f" font-weight="bold">Counter.qml (structure + bindings)</text>
  <text x="486" y="146" font-size="11" font-family="Consolas, monospace" fill="#333333">Column {</text>
  <text x="486" y="164" font-size="11" font-family="Consolas, monospace" fill="#333333">  Text { text: "Count: " + count }</text>
  <text x="486" y="182" font-size="11" font-family="Consolas, monospace" fill="#333333">  Button {</text>
  <text x="486" y="200" font-size="11" font-family="Consolas, monospace" fill="#333333">    text: "+1"</text>
  <text x="486" y="218" font-size="11" font-family="Consolas, monospace" fill="#333333">    onClicked: count++</text>
  <text x="486" y="236" font-size="11" font-family="Consolas, monospace" fill="#333333">  }</text>

  <!-- Arrows down to trees -->
  <line x1="230" y1="254" x2="230" y2="284" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="254" x2="670" y2="284" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LEFT tree: widget object tree built at runtime -->
  <rect x="30" y="290" width="400" height="180" rx="6" fill="#ffffff" stroke="#8fb8dd" stroke-width="1.2"/>
  <text x="46" y="310" font-size="11" font-weight="bold" fill="#123a5c">Result: a QWidget object tree (parent/child)</text>

  <rect x="150" y="322" width="160" height="34" rx="5" fill="#cfe8ff" stroke="#3f7fbf"/>
  <text x="230" y="343" text-anchor="middle" font-size="12" fill="#123a5c">Widget (QWidget)</text>

  <line x1="230" y1="356" x2="230" y2="374" stroke="#7fa8cf" stroke-width="1.3"/>
  <rect x="150" y="374" width="160" height="30" rx="5" fill="#e8f2fc" stroke="#7fa8cf"/>
  <text x="230" y="393" text-anchor="middle" font-size="11" fill="#123a5c">QVBoxLayout</text>

  <line x1="200" y1="404" x2="130" y2="424" stroke="#7fa8cf" stroke-width="1.3"/>
  <line x1="260" y1="404" x2="330" y2="424" stroke="#7fa8cf" stroke-width="1.3"/>

  <rect x="60" y="424" width="140" height="30" rx="5" fill="#e8f2fc" stroke="#7fa8cf"/>
  <text x="130" y="443" text-anchor="middle" font-size="11" fill="#123a5c">QLabel</text>

  <rect x="260" y="424" width="140" height="30" rx="5" fill="#e8f2fc" stroke="#7fa8cf"/>
  <text x="330" y="443" text-anchor="middle" font-size="11" fill="#123a5c">QPushButton</text>

  <text x="230" y="462" text-anchor="middle" font-size="10" fill="#555555">Layout added and callback connected by hand, one line at a time</text>

  <!-- RIGHT tree: QML element tree with bindings -->
  <rect x="470" y="290" width="400" height="180" rx="6" fill="#ffffff" stroke="#8fcf8f" stroke-width="1.2"/>
  <text x="486" y="310" font-size="11" font-weight="bold" fill="#1f5c1f">Result: a declarative QML item tree</text>

  <rect x="590" y="322" width="160" height="34" rx="5" fill="#d9f2d9" stroke="#4a9c4a"/>
  <text x="670" y="343" text-anchor="middle" font-size="12" fill="#1f5c1f">Column (Item)</text>

  <line x1="640" y1="356" x2="580" y2="374" stroke="#7fbf7f" stroke-width="1.3"/>
  <line x1="700" y1="356" x2="760" y2="374" stroke="#7fbf7f" stroke-width="1.3"/>

  <rect x="500" y="374" width="160" height="30" rx="5" fill="#eafaea" stroke="#7fbf7f"/>
  <text x="580" y="393" text-anchor="middle" font-size="11" fill="#1f5c1f">Text (bound)</text>

  <rect x="680" y="374" width="160" height="30" rx="5" fill="#eafaea" stroke="#7fbf7f"/>
  <text x="760" y="393" text-anchor="middle" font-size="11" fill="#1f5c1f">Button</text>

  <line x1="760" y1="404" x2="760" y2="424" stroke="#7fbf7f" stroke-width="1.3" stroke-dasharray="3,2"/>
  <path d="M 760 424 L 660 424 L 660 393" fill="none" stroke="#c9982f" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrowgold)"/>
  <text x="670" y="440" text-anchor="middle" font-size="10" fill="#7a5b12">onClicked updates "count";</text>
  <text x="670" y="453" text-anchor="middle" font-size="10" fill="#7a5b12">Text re-evaluates its binding automatically</text>

  <!-- Bottom shared foundation -->
  <rect x="150" y="500" width="600" height="46" rx="6" fill="#e3d9f5" stroke="#7a5cbf" stroke-width="1.3"/>
  <text x="450" y="528" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d2a5c">Shared foundation: QtGui (painting, fonts, events, window system)</text>

  <line x1="230" y1="470" x2="230" y2="500" stroke="#999999" stroke-width="1.3"/>
  <line x1="670" y1="470" x2="670" y2="500" stroke="#999999" stroke-width="1.3"/>

  <text x="450" y="576" text-anchor="middle" font-size="12" fill="#555555">QWidgets: you write the steps that build and wire the UI.</text>
  <text x="450" y="594" text-anchor="middle" font-size="12" fill="#555555">QML: you describe the UI structure and let property bindings keep it in sync.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#999999"/>
    </marker>
    <marker id="arrowgold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#c9982f"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Game world (large) -->
  <rect x="30" y="40" width="480" height="300" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="270" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">게임 월드 (화면보다 훨씬 크다)</text>

  <!-- Some world objects -->
  <rect x="60" y="70" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="80" y="95" text-anchor="middle" font-size="10" fill="#000000">나무</text>

  <rect x="330" y="90" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="350" y="115" text-anchor="middle" font-size="10" fill="#000000">적</text>

  <rect x="440" y="270" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="460" y="295" text-anchor="middle" font-size="10" fill="#000000">상자</text>

  <rect x="70" y="270" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="90" y="295" text-anchor="middle" font-size="10" fill="#000000">함정</text>

  <!-- Camera viewport rectangle inside the world -->
  <rect x="180" y="140" width="220" height="130" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="290" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">카메라(뷰포트)</text>

  <!-- Player marker inside camera view -->
  <circle cx="290" cy="205" r="10" fill="#000000" />
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#000000">플레이어</text>

  <!-- Arrow indicating camera can move -->
  <defs>
    <marker id="arrow12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
  <line x1="180" y1="205" x2="115" y2="205" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow12)" />
  <line x1="400" y1="205" x2="465" y2="205" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow12)" />
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#000000">카메라는 플레이어를 따라 월드 안을 이동한다</text>

  <!-- Arrow from camera viewport to screen -->
  <line x1="410" y1="205" x2="560" y2="205" stroke="#000000" stroke-width="2" marker-end="url(#arrow12)" />
  <text x="485" y="195" text-anchor="middle" font-size="11" fill="#000000">변환 행렬</text>

  <!-- Screen (small, fixed) -->
  <rect x="560" y="130" width="110" height="150" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="615" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">화면</text>

  <circle cx="615" cy="205" r="8" fill="#000000" />
  <rect x="580" y="150" width="26" height="26" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="593" y="168" text-anchor="middle" font-size="8" fill="#000000">적</text>
  <rect x="590" y="230" width="26" height="26" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="603" y="248" text-anchor="middle" font-size="8" fill="#000000">상자</text>

  <text x="615" y="300" text-anchor="middle" font-size="10" fill="#000000">뷰포트 안의 내용만</text>
  <text x="615" y="313" text-anchor="middle" font-size="10" fill="#000000">화면에 그려진다</text>
</svg>

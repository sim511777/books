<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">BasicEffect의 World / View / Projection 파이프라인</text>

  <!-- Vertex data -->
  <rect x="20" y="70" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="90" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">정점 데이터</text>
  <text x="90" y="115" text-anchor="middle" font-size="10" fill="#000000">VertexPositionColor[]</text>
  <text x="90" y="128" text-anchor="middle" font-size="10" fill="#000000">모델(로컬) 공간</text>

  <line x1="160" y1="105" x2="215" y2="105" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- World -->
  <rect x="220" y="70" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="290" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">World 행렬</text>
  <text x="290" y="115" text-anchor="middle" font-size="10" fill="#000000">회전·이동·크기</text>
  <text x="290" y="128" text-anchor="middle" font-size="10" fill="#000000">→ 월드 공간</text>

  <line x1="360" y1="105" x2="415" y2="105" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- View -->
  <rect x="420" y="70" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="490" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">View 행렬</text>
  <text x="490" y="115" text-anchor="middle" font-size="10" fill="#000000">CreateLookAt</text>
  <text x="490" y="128" text-anchor="middle" font-size="10" fill="#000000">→ 카메라 공간</text>

  <line x1="490" y1="140" x2="490" y2="195" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Projection -->
  <rect x="420" y="200" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="490" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Projection 행렬</text>
  <text x="490" y="245" text-anchor="middle" font-size="10" fill="#000000">CreatePerspectiveFieldOfView</text>
  <text x="490" y="258" text-anchor="middle" font-size="10" fill="#000000">→ 화면 투영</text>

  <line x1="420" y1="235" x2="270" y2="235" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Screen -->
  <rect x="90" y="200" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="180" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">화면에 렌더링</text>
  <text x="180" y="245" text-anchor="middle" font-size="10" fill="#000000">DrawUserPrimitives</text>
  <text x="180" y="258" text-anchor="middle" font-size="10" fill="#000000">GraphicsDevice가 픽셀로 변환</text>

  <!-- Effect box surrounding -->
  <rect x="200" y="330" width="320" height="55" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />
  <text x="360" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">effect.World / effect.View / effect.Projection</text>
  <text x="360" y="370" text-anchor="middle" font-size="10" fill="#000000">세 값 모두 BasicEffect 인스턴스에 설정한다</text>

  <line x1="360" y1="328" x2="360" y2="141" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" />
</svg>

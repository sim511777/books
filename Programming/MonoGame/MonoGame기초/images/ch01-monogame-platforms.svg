<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Center: MonoGame Core -->
  <rect x="270" y="170" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="350" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">MonoGame</text>
  <text x="350" y="215" text-anchor="middle" font-size="13" fill="#000000">Core (C# / .NET)</text>

  <!-- Windows / macOS / Linux (DesktopGL) -->
  <rect x="40" y="30" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="130" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Windows / macOS</text>
  <text x="130" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Linux</text>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#000000">(DesktopGL 템플릿)</text>

  <!-- Android -->
  <rect x="40" y="170" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="120" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Android</text>

  <!-- iOS -->
  <rect x="40" y="310" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="120" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">iOS</text>

  <!-- Consoles -->
  <rect x="480" y="30" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="570" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">콘솔</text>
  <text x="570" y="72" text-anchor="middle" font-size="11" fill="#000000">(Xbox / PlayStation /</text>
  <text x="570" y="86" text-anchor="middle" font-size="11" fill="#000000">Nintendo Switch 등)</text>

  <!-- Other platforms -->
  <rect x="480" y="310" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="570" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">기타 플랫폼</text>
  <text x="570" y="352" text-anchor="middle" font-size="11" fill="#000000">(개발자 프로그램 참여 시)</text>

  <!-- Arrows from core to each platform -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <line x1="270" y1="185" x2="222" y2="90" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="270" y1="195" x2="202" y2="197" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="270" y1="210" x2="222" y2="325" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="185" x2="478" y2="90" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="210" x2="478" y2="325" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="350" y="255" text-anchor="middle" font-size="12" fill="#000000">하나의 C# 코드베이스가 여러 플랫폼으로 빌드된다</text>
</svg>

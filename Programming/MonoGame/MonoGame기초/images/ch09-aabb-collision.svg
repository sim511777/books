<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Left panel: overlapping -->
  <text x="175" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">겹치는 경우 (충돌)</text>

  <rect x="200" y="150" width="0" height="0" fill="none" />
  <!-- Rectangle A -->
  <rect x="60" y="80" width="140" height="110" fill="none" stroke="#000000" stroke-width="2" />
  <text x="80" y="100" font-size="12" fill="#000000">A</text>
  <!-- Rectangle B, overlapping A -->
  <rect x="160" y="150" width="140" height="110" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,3" />
  <text x="280" y="240" font-size="12" fill="#000000">B</text>

  <!-- overlap region highlight -->
  <rect x="160" y="150" width="40" height="40" fill="#000000" fill-opacity="0.15" stroke="none" />

  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#000000">A.Right &gt; B.Left  그리고</text>
  <text x="175" y="316" text-anchor="middle" font-size="11" fill="#000000">A.Bottom &gt; B.Top  →  Intersects() == true</text>

  <!-- divider -->
  <line x1="350" y1="20" x2="350" y2="360" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Right panel: non-overlapping -->
  <text x="525" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">겹치지 않는 경우 (비충돌)</text>

  <!-- Rectangle C -->
  <rect x="410" y="80" width="120" height="100" fill="none" stroke="#000000" stroke-width="2" />
  <text x="430" y="100" font-size="12" fill="#000000">A</text>

  <!-- Rectangle D, separated -->
  <rect x="560" y="220" width="120" height="100" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,3" />
  <text x="580" y="240" font-size="12" fill="#000000">B</text>

  <!-- gap indicator -->
  <line x1="530" y1="180" x2="560" y2="220" stroke="#000000" stroke-width="1" marker-end="url(#gaparrow)" />

  <defs>
    <marker id="gaparrow" markerWidth="8" markerHeight="8" refX="6" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L6,2 z" fill="#000000" />
    </marker>
  </defs>

  <text x="545" y="200" text-anchor="middle" font-size="10" fill="#000000">간격</text>

  <text x="525" y="300" text-anchor="middle" font-size="11" fill="#000000">A.Bottom &lt; B.Top이므로</text>
  <text x="525" y="316" text-anchor="middle" font-size="11" fill="#000000">Intersects() == false</text>
</svg>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <!-- Left panel: overlapping case -->
  <text x="175" y="40" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">겹치는 경우 (충돌)</text>

  <!-- rec1 -->
  <rect x="60" y="90" width="140" height="110" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="80" font-family="sans-serif" font-size="12" text-anchor="middle">rec1</text>

  <!-- rec2 overlapping -->
  <rect x="150" y="150" width="140" height="110" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="220" y="278" font-family="sans-serif" font-size="12" text-anchor="middle">rec2</text>

  <!-- overlap region shaded -->
  <rect x="150" y="150" width="50" height="50" fill="black" fill-opacity="0.15" stroke="none"/>

  <text x="175" y="330" font-family="sans-serif" font-size="13" text-anchor="middle">CheckCollisionRecs(rec1, rec2)</text>
  <text x="175" y="350" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">== true</text>

  <!-- divider -->
  <line x1="350" y1="30" x2="350" y2="370" stroke="black" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right panel: non-overlapping case -->
  <text x="525" y="40" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">겹치지 않는 경우 (비충돌)</text>

  <!-- rec1 -->
  <rect x="410" y="90" width="120" height="100" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="470" y="80" font-family="sans-serif" font-size="12" text-anchor="middle">rec1</text>

  <!-- rec2 separated -->
  <rect x="560" y="220" width="120" height="100" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="620" y="338" font-family="sans-serif" font-size="12" text-anchor="middle">rec2</text>

  <!-- gap arrow -->
  <line x1="530" y1="200" x2="560" y2="220" stroke="black" stroke-width="1" marker-end="url(#arrow2)"/>
  <text x="558" y="200" font-family="sans-serif" font-size="11">간격</text>

  <text x="525" y="360" font-family="sans-serif" font-size="13" text-anchor="middle">CheckCollisionRecs(rec1, rec2)</text>
  <text x="525" y="378" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">== false</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>
</svg>

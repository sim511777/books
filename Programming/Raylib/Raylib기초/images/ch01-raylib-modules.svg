<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <!-- center core -->
  <rect x="275" y="165" width="150" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="350" y="195" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">raylib</text>
  <text x="350" y="216" font-family="sans-serif" font-size="13" text-anchor="middle">core</text>

  <!-- module boxes -->
  <!-- top left: shapes -->
  <rect x="60" y="40" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="65" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">shapes</text>
  <text x="130" y="83" font-family="sans-serif" font-size="11" text-anchor="middle">2D 도형 그리기</text>

  <!-- top right: textures -->
  <rect x="500" y="40" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="65" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">textures</text>
  <text x="570" y="83" font-family="sans-serif" font-size="11" text-anchor="middle">이미지/텍스처</text>

  <!-- left: text -->
  <rect x="20" y="200" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="90" y="225" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">text</text>
  <text x="90" y="243" font-family="sans-serif" font-size="11" text-anchor="middle">폰트/텍스트</text>

  <!-- right: audio -->
  <rect x="540" y="200" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="610" y="225" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">audio</text>
  <text x="610" y="243" font-family="sans-serif" font-size="11" text-anchor="middle">사운드/음악</text>

  <!-- bottom left: models -->
  <rect x="60" y="300" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="325" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">models</text>
  <text x="130" y="343" font-family="sans-serif" font-size="11" text-anchor="middle">3D 모델/메시</text>

  <!-- bottom right: raymath -->
  <rect x="500" y="300" width="140" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="325" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">raymath</text>
  <text x="570" y="343" font-family="sans-serif" font-size="11" text-anchor="middle">벡터/행렬 수학</text>

  <!-- connecting lines from center to each module -->
  <line x1="300" y1="180" x2="160" y2="90" stroke="black" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="540" y2="90" stroke="black" stroke-width="1.5"/>
  <line x1="280" y1="210" x2="160" y2="228" stroke="black" stroke-width="1.5"/>
  <line x1="420" y1="210" x2="540" y2="228" stroke="black" stroke-width="1.5"/>
  <line x1="300" y1="230" x2="160" y2="305" stroke="black" stroke-width="1.5"/>
  <line x1="400" y1="230" x2="540" y2="305" stroke="black" stroke-width="1.5"/>
</svg>

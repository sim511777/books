<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- floor grid on the XZ plane, drawn as a parallelogram to suggest depth -->
  <g stroke="lightgray" stroke-width="1">
    <line x1="120" y1="330" x2="440" y2="330"/>
    <line x1="140" y1="310" x2="460" y2="310"/>
    <line x1="160" y1="290" x2="480" y2="290"/>
    <line x1="80" y1="350" x2="400" y2="350"/>

    <line x1="120" y1="330" x2="80" y2="350"/>
    <line x1="200" y1="330" x2="170" y2="350"/>
    <line x1="280" y1="330" x2="260" y2="350"/>
    <line x1="360" y1="330" x2="350" y2="350"/>
    <line x1="440" y1="330" x2="400" y2="350"/>
  </g>

  <!-- origin -->
  <circle cx="280" cy="330" r="3.5" fill="black"/>
  <text x="288" y="348" font-family="sans-serif" font-size="12" text-anchor="start">O (0, 0, 0)</text>

  <!-- Y axis: up -->
  <line x1="280" y1="330" x2="280" y2="70" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="55" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Y</text>
  <text x="296" y="90" font-family="sans-serif" font-size="11" text-anchor="start">위 (up)</text>

  <!-- X axis: right -->
  <line x1="280" y1="330" x2="560" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="335" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">X</text>

  <!-- Z axis: toward viewer, diagonal down-left -->
  <line x1="280" y1="330" x2="100" y2="390" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="398" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Z</text>

  <!-- target point (at the origin area, on the floor) -->
  <circle cx="280" cy="330" r="5" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- camera position -->
  <circle cx="540" cy="130" r="5" fill="black"/>
  <text x="552" y="120" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold">camera.position</text>

  <!-- line of sight from camera to target, dashed -->
  <line x1="537" y1="134" x2="286" y2="327" stroke="black" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="420" y="205" font-family="sans-serif" font-size="11" text-anchor="middle">camera.target 방향으로 바라봄</text>

  <!-- small box object near origin representing DrawCube -->
  <g stroke="black" stroke-width="1.5" fill="white">
    <rect x="255" y="290" width="50" height="40"/>
    <polygon points="255,290 270,275 320,275 305,290" fill="white"/>
    <polygon points="305,290 320,275 320,315 305,330" fill="white"/>
  </g>

  <!-- up vector arrow near camera, short -->
  <line x1="540" y1="130" x2="540" y2="95" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="83" font-family="sans-serif" font-size="11" text-anchor="middle">up</text>

  <!-- caption box -->
  <rect x="20" y="20" width="230" height="40" fill="white" stroke="black" stroke-width="1"/>
  <text x="135" y="36" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">raylib의 3D 좌표계</text>
  <text x="135" y="52" font-family="sans-serif" font-size="10" text-anchor="middle">Y축이 "위"를 나타내는 오른손 좌표계</text>
</svg>

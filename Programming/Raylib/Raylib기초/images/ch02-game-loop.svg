<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- InitWindow -->
  <rect x="270" y="20" width="160" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="350" y="50" font-family="sans-serif" font-size="14" text-anchor="middle">InitWindow()</text>

  <!-- SetTargetFPS -->
  <rect x="270" y="90" width="160" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="350" y="120" font-family="sans-serif" font-size="14" text-anchor="middle">SetTargetFPS(60)</text>

  <!-- while loop diamond -->
  <polygon points="350,160 460,205 350,250 240,205" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="350" y="200" font-family="sans-serif" font-size="12" text-anchor="middle">WindowShouldClose()</text>
  <text x="350" y="216" font-family="sans-serif" font-size="12" text-anchor="middle">== false ?</text>

  <!-- loop body box -->
  <rect x="490" y="165" width="170" height="80" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="575" y="185" font-family="sans-serif" font-size="12" text-anchor="middle">BeginDrawing()</text>
  <text x="575" y="203" font-family="sans-serif" font-size="12" text-anchor="middle">ClearBackground()</text>
  <text x="575" y="221" font-family="sans-serif" font-size="12" text-anchor="middle">Draw...()</text>
  <text x="575" y="239" font-family="sans-serif" font-size="12" text-anchor="middle">EndDrawing()</text>

  <!-- CloseWindow -->
  <rect x="270" y="320" width="160" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="350" y="350" font-family="sans-serif" font-size="14" text-anchor="middle">CloseWindow()</text>

  <!-- arrows -->
  <line x1="350" y1="70" x2="350" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="140" x2="350" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- diamond -> loop body (true) -->
  <line x1="460" y1="205" x2="490" y2="205" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="197" font-family="sans-serif" font-size="11">참</text>

  <!-- loop body -> back to diamond (top curve) -->
  <path d="M 575 165 L 575 130 L 350 130 L 350 160" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- diamond -> CloseWindow (false) -->
  <line x1="350" y1="250" x2="350" y2="320" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="285" font-family="sans-serif" font-size="11">거짓</text>

</svg>

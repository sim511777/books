<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">동시성(Concurrency) vs 병렬성(Parallelism)</text>

  <!-- Left panel: Concurrency (single core, interleaved) -->
  <text x="175" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">동시성 - 코어 1개, 작업 번갈아 실행</text>

  <rect x="30" y="70" width="290" height="40" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="40" y="94" font-size="12" fill="#000000">코어 1</text>

  <!-- Timeline blocks interleaved A B A B on core 1 -->
  <rect x="95" y="75" width="40" height="30" fill="#cfe8ff" stroke="#000000" />
  <text x="115" y="94" text-anchor="middle" font-size="11" fill="#000000">A</text>

  <rect x="135" y="75" width="40" height="30" fill="#ffe0b3" stroke="#000000" />
  <text x="155" y="94" text-anchor="middle" font-size="11" fill="#000000">B</text>

  <rect x="175" y="75" width="40" height="30" fill="#cfe8ff" stroke="#000000" />
  <text x="195" y="94" text-anchor="middle" font-size="11" fill="#000000">A</text>

  <rect x="215" y="75" width="40" height="30" fill="#ffe0b3" stroke="#000000" />
  <text x="235" y="94" text-anchor="middle" font-size="11" fill="#000000">B</text>

  <rect x="255" y="75" width="40" height="30" fill="#cfe8ff" stroke="#000000" />
  <text x="275" y="94" text-anchor="middle" font-size="11" fill="#000000">A</text>

  <!-- time arrow -->
  <line x1="30" y1="130" x2="320" y2="130" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="175" y="148" text-anchor="middle" font-size="12" fill="#000000">시간</text>

  <text x="175" y="175" text-anchor="middle" font-size="12" fill="#333333">작업 A, B가 짧게 끊어서</text>
  <text x="175" y="192" text-anchor="middle" font-size="12" fill="#333333">번갈아 진행됨 (구조적 특성)</text>

  <!-- legend -->
  <rect x="60" y="215" width="18" height="14" fill="#cfe8ff" stroke="#000000" />
  <text x="84" y="226" font-size="11" fill="#000000">작업 A</text>
  <rect x="150" y="215" width="18" height="14" fill="#ffe0b3" stroke="#000000" />
  <text x="174" y="226" font-size="11" fill="#000000">작업 B</text>

  <!-- Divider -->
  <line x1="350" y1="45" x2="350" y2="370" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Right panel: Parallelism (multi core, simultaneous) -->
  <text x="525" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">병렬성 - 코어 2개 이상, 동시 실행</text>

  <rect x="380" y="70" width="290" height="40" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="390" y="94" font-size="12" fill="#000000">코어 1</text>
  <rect x="440" y="75" width="200" height="30" fill="#cfe8ff" stroke="#000000" />
  <text x="540" y="94" text-anchor="middle" font-size="11" fill="#000000">작업 A 실행 중</text>

  <rect x="380" y="120" width="290" height="40" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="390" y="144" font-size="12" fill="#000000">코어 2</text>
  <rect x="440" y="125" width="200" height="30" fill="#ffe0b3" stroke="#000000" />
  <text x="540" y="144" text-anchor="middle" font-size="11" fill="#000000">작업 B 실행 중</text>

  <!-- time arrow -->
  <line x1="380" y1="180" x2="670" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="525" y="198" text-anchor="middle" font-size="12" fill="#000000">시간</text>

  <text x="525" y="225" text-anchor="middle" font-size="12" fill="#333333">작업 A, B가 서로 다른 코어에서</text>
  <text x="525" y="242" text-anchor="middle" font-size="12" fill="#333333">같은 시점에 실제로 동시에 실행됨</text>

  <!-- Bottom note -->
  <rect x="30" y="290" width="640" height="90" fill="#f7f7f7" stroke="#000000" stroke-width="1" />
  <text x="350" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">핵심 차이</text>
  <text x="50" y="338" font-size="12" fill="#000000">· 동시성은 "여러 작업을 다루는 방식(구조)"이며, 싱글 코어에서도 문맥 전환만으로 구현할 수 있습니다.</text>
  <text x="50" y="358" font-size="12" fill="#000000">· 병렬성은 "여러 작업을 실제로 같은 순간에 실행하는 것"이며, 물리적으로 2개 이상의 코어가 필요합니다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>

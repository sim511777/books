<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Channel을 이용한 생산자-소비자 패턴</text>

  <!-- Producers -->
  <text x="90" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">생산자(Producer)</text>

  <rect x="30" y="65" width="120" height="34" fill="#cfe8ff" stroke="#000000" />
  <text x="90" y="86" text-anchor="middle" font-size="11" fill="#000000">Producer 1</text>

  <rect x="30" y="110" width="120" height="34" fill="#cfe8ff" stroke="#000000" />
  <text x="90" y="131" text-anchor="middle" font-size="11" fill="#000000">Producer 2</text>

  <rect x="30" y="155" width="120" height="34" fill="#cfe8ff" stroke="#000000" />
  <text x="90" y="176" text-anchor="middle" font-size="11" fill="#000000">Producer 3</text>

  <text x="90" y="205" text-anchor="middle" font-size="10" fill="#333333">writer.WriteAsync(item)</text>

  <!-- Arrows producers -> channel -->
  <line x1="150" y1="82" x2="255" y2="150" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />
  <line x1="150" y1="127" x2="255" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />
  <line x1="150" y1="172" x2="255" y2="170" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />

  <!-- Channel box -->
  <text x="350" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Channel&lt;T&gt;</text>
  <rect x="260" y="130" width="180" height="110" fill="#eeeeee" stroke="#000000" stroke-width="1.5" />

  <text x="350" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">내부 대기열</text>

  <rect x="278" y="162" width="34" height="26" fill="#ffe0b3" stroke="#000000" />
  <rect x="316" y="162" width="34" height="26" fill="#ffe0b3" stroke="#000000" />
  <rect x="354" y="162" width="34" height="26" fill="#ffe0b3" stroke="#000000" />
  <rect x="392" y="162" width="34" height="26" fill="#f0f0f0" stroke="#000000" stroke-dasharray="2,2" />

  <text x="350" y="205" text-anchor="middle" font-size="10" fill="#333333">ChannelWriter&lt;T&gt; / ChannelReader&lt;T&gt;</text>
  <text x="350" y="222" text-anchor="middle" font-size="10" fill="#333333">Unbounded(무제한) 또는</text>
  <text x="350" y="235" text-anchor="middle" font-size="10" fill="#333333">Bounded(용량 제한)</text>

  <!-- Arrows channel -> consumers -->
  <line x1="445" y1="150" x2="550" y2="82" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />
  <line x1="445" y1="160" x2="550" y2="127" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />
  <line x1="445" y1="170" x2="550" y2="172" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow16)" />

  <text x="610" y="205" text-anchor="middle" font-size="10" fill="#333333">await foreach(reader.ReadAllAsync())</text>

  <!-- Consumers -->
  <text x="610" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">소비자(Consumer)</text>

  <rect x="550" y="65" width="120" height="34" fill="#d9f2d9" stroke="#000000" />
  <text x="610" y="86" text-anchor="middle" font-size="11" fill="#000000">Consumer 1</text>

  <rect x="550" y="110" width="120" height="34" fill="#d9f2d9" stroke="#000000" />
  <text x="610" y="131" text-anchor="middle" font-size="11" fill="#000000">Consumer 2</text>

  <rect x="550" y="155" width="120" height="34" fill="#d9f2d9" stroke="#000000" />
  <text x="610" y="176" text-anchor="middle" font-size="11" fill="#000000">Consumer 3</text>

  <!-- Bottom note -->
  <rect x="30" y="270" width="640" height="110" fill="#f7f7f7" stroke="#000000" stroke-width="1" />
  <text x="350" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">핵심 동작</text>
  <text x="50" y="316" font-size="12" fill="#000000">· 여러 생산자가 동시에 writer.WriteAsync()를 호출해 채널에 항목을 넣을 수 있습니다.</text>
  <text x="50" y="336" font-size="12" fill="#000000">· 여러 소비자가 동시에 reader.ReadAllAsync()로 순회하며 항목을 하나씩 안전하게 나눠 가져갑니다.</text>
  <text x="50" y="356" font-size="12" fill="#000000">· 채널이 비었거나 가득 찼을 때도 스레드를 블로킹하지 않고 await 지점에서 제어권을 반납합니다.</text>
  <text x="50" y="374" font-size="12" fill="#000000">· 모든 생산자가 writer.Complete()를 호출하면 소비자 쪽 순회가 자연스럽게 종료됩니다.</text>

  <defs>
    <marker id="arrow16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>

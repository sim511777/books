<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Task.Run()과 스레드 풀의 관계</text>

  <!-- Step 1: Calling code -->
  <rect x="30" y="55" width="150" height="55" fill="#cfe8ff" stroke="#000000" stroke-width="1.5" />
  <text x="105" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">호출 스레드</text>
  <text x="105" y="96" text-anchor="middle" font-size="11" fill="#000000">Task.Run(() =&gt; ...)</text>

  <line x1="180" y1="82" x2="225" y2="82" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="202" y="72" text-anchor="middle" font-size="10" fill="#333333">작업 등록</text>

  <!-- Step 2: Global queue -->
  <rect x="230" y="55" width="150" height="55" fill="#ffe0b3" stroke="#000000" stroke-width="1.5" />
  <text x="305" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">스레드 풀</text>
  <text x="305" y="92" text-anchor="middle" font-size="11" fill="#000000">전역 작업 큐</text>

  <line x1="305" y1="110" x2="305" y2="145" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="345" y="132" text-anchor="middle" font-size="10" fill="#333333">큐잉된 Task</text>

  <!-- Task object floats -->
  <rect x="255" y="150" width="100" height="30" fill="#ffffff" stroke="#000000" stroke-dasharray="3,2" />
  <text x="305" y="169" text-anchor="middle" font-size="11" fill="#000000">Task (Created)</text>

  <!-- Worker threads box -->
  <rect x="450" y="55" width="220" height="180" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="560" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">워커 스레드들</text>

  <rect x="465" y="90" width="90" height="35" fill="#cfe8ff" stroke="#000000" />
  <text x="510" y="112" text-anchor="middle" font-size="11" fill="#000000">워커 스레드 1</text>

  <rect x="565" y="90" width="90" height="35" fill="#f0f0f0" stroke="#000000" />
  <text x="610" y="112" text-anchor="middle" font-size="11" fill="#000000">유휴</text>

  <rect x="465" y="135" width="90" height="35" fill="#f0f0f0" stroke="#000000" />
  <text x="510" y="157" text-anchor="middle" font-size="11" fill="#000000">유휴</text>

  <rect x="565" y="135" width="90" height="35" fill="#f0f0f0" stroke="#000000" />
  <text x="610" y="157" text-anchor="middle" font-size="11" fill="#000000">유휴</text>

  <text x="560" y="200" text-anchor="middle" font-size="10" fill="#333333">워커 스레드 1이 큐에서</text>
  <text x="560" y="215" text-anchor="middle" font-size="10" fill="#333333">Task를 꺼내 대리자를 실행</text>

  <!-- Arrow from queue to worker -->
  <line x1="360" y1="165" x2="460" y2="107" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="415" y="130" text-anchor="middle" font-size="10" fill="#333333">작업 꺼내기</text>

  <!-- Bottom: state transition -->
  <rect x="30" y="260" width="640" height="60" fill="#f7f7f7" stroke="#000000" stroke-width="1" />
  <text x="50" y="282" font-size="12" font-weight="bold" fill="#000000">Task 상태 전이</text>
  <text x="50" y="302" font-size="12" fill="#000000">Created → WaitingToRun → Running → RanToCompletion (또는 Faulted / Canceled)</text>

  <!-- Result flow -->
  <line x1="560" y1="235" x2="560" y2="255" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="230" y1="290" x2="560" y2="290" stroke="#000000" stroke-width="0" />

  <rect x="30" y="335" width="640" height="50" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="350" y="365" text-anchor="middle" font-size="12" fill="#000000">실행이 끝나면 Task 객체에 결과(또는 예외)가 저장되고, 호출 스레드는 이를 나중에 꺼내볼 수 있습니다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>

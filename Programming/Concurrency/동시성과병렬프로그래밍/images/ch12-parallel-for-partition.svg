<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff" />

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Parallel.For의 작업 분할과 병렬 실행</text>

  <!-- Original range box -->
  <rect x="60" y="45" width="580" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
  <text x="350" y="70" text-anchor="middle" font-size="13" fill="#000000">Parallel.For(0, 1000, body) — 전체 반복 범위 0 .. 999</text>

  <!-- Arrow down to partitioner -->
  <line x1="350" y1="85" x2="350" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="430" y="102" text-anchor="middle" font-size="10" fill="#333333">파티셔너가 범위를 분할</text>

  <!-- Partitioner box -->
  <rect x="230" y="112" width="240" height="34" fill="#ffe0b3" stroke="#000000" stroke-width="1.5" />
  <text x="350" y="134" text-anchor="middle" font-size="12" fill="#000000">내부 Partitioner</text>

  <!-- Lines from partitioner to 4 partitions -->
  <line x1="290" y1="146" x2="115" y2="185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="320" y1="146" x2="280" y2="185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="380" y1="146" x2="420" y2="185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="410" y1="146" x2="585" y2="185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4 partition boxes -->
  <rect x="30" y="190" width="170" height="40" fill="#cfe8ff" stroke="#000000" stroke-width="1.5" />
  <text x="115" y="214" text-anchor="middle" font-size="11" fill="#000000">파티션 1: 0 .. 249</text>

  <rect x="215" y="190" width="170" height="40" fill="#cfe8ff" stroke="#000000" stroke-width="1.5" />
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#000000">파티션 2: 250 .. 499</text>

  <rect x="400" y="190" width="170" height="40" fill="#cfe8ff" stroke="#000000" stroke-width="1.5" />
  <text x="485" y="214" text-anchor="middle" font-size="11" fill="#000000">파티션 3: 500 .. 749</text>

  <!-- Arrows down to worker threads -->
  <line x1="115" y1="230" x2="115" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="300" y1="230" x2="300" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="485" y1="230" x2="485" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Worker thread boxes -->
  <rect x="30" y="262" width="170" height="45" fill="#d9f0d9" stroke="#000000" stroke-width="1.5" />
  <text x="115" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">워커 스레드 A</text>
  <text x="115" y="298" text-anchor="middle" font-size="10" fill="#000000">코어 1에서 실행</text>

  <rect x="215" y="262" width="170" height="45" fill="#d9f0d9" stroke="#000000" stroke-width="1.5" />
  <text x="300" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">워커 스레드 B</text>
  <text x="300" y="298" text-anchor="middle" font-size="10" fill="#000000">코어 2에서 실행</text>

  <rect x="400" y="262" width="170" height="45" fill="#d9f0d9" stroke="#000000" stroke-width="1.5" />
  <text x="485" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">워커 스레드 C</text>
  <text x="485" y="298" text-anchor="middle" font-size="10" fill="#000000">코어 3에서 실행</text>

  <!-- 4th partition + worker on the right, drawn last to sit above stray rects -->
  <rect x="585" y="190" width="85" height="40" fill="#cfe8ff" stroke="#000000" stroke-width="1.5" />
  <text x="627" y="208" text-anchor="middle" font-size="9" fill="#000000">파티션 4:</text>
  <text x="627" y="222" text-anchor="middle" font-size="9" fill="#000000">750..999</text>

  <line x1="627" y1="230" x2="627" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="585" y="262" width="85" height="45" fill="#d9f0d9" stroke="#000000" stroke-width="1.5" />
  <text x="627" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">워커 D</text>
  <text x="627" y="296" text-anchor="middle" font-size="9" fill="#000000">코어 4</text>

  <!-- Note box -->
  <rect x="30" y="330" width="640" height="70" fill="#f7f7f7" stroke="#000000" stroke-width="1" />
  <text x="50" y="352" font-size="12" font-weight="bold" fill="#000000">핵심 포인트</text>
  <text x="50" y="372" font-size="11" fill="#000000">각 파티션은 별도의 워커 스레드에서 동시에 처리되며, 파티션 내부의 반복은 해당 스레드에서 순차 실행됩니다.</text>
  <text x="50" y="390" font-size="11" fill="#000000">파티션 개수와 경계는 코어 수, 작업 부하에 따라 런타임이 자동으로 결정하며 개발자가 직접 나눌 필요가 없습니다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>

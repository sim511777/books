<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <text x="350" y="28" font-size="14" font-weight="bold" text-anchor="middle">StyledProperty 값 결정 우선순위</text>

  <!-- Priority boxes, top = highest priority -->
  <g stroke="black" fill="white" stroke-width="1.5">
    <rect x="220" y="50" width="260" height="46"/>
    <rect x="220" y="116" width="260" height="46"/>
    <rect x="220" y="182" width="260" height="46"/>
    <rect x="220" y="248" width="260" height="46"/>
  </g>

  <g font-size="12" fill="black" text-anchor="middle">
    <text x="350" y="70" font-weight="bold">① 애니메이션 값</text>
    <text x="350" y="86">Animation / Transition</text>

    <text x="350" y="136" font-weight="bold">② 로컬 값</text>
    <text x="350" y="152">SetValue(...) / XAML 속성</text>

    <text x="350" y="202" font-weight="bold">③ 스타일 세터 값</text>
    <text x="350" y="218">Style Selector의 Setter</text>

    <text x="350" y="268" font-weight="bold">④ 상속된 값 / 기본값</text>
    <text x="350" y="284">Inherited 또는 defaultValue</text>
  </g>

  <!-- Downward arrows between boxes -->
  <line x1="350" y1="96" x2="350" y2="114" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="162" x2="350" y2="180" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="228" x2="350" y2="246" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- side labels -->
  <text x="60" y="60" font-size="11">높은 우선순위</text>
  <line x1="60" y1="70" x2="60" y2="280" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="60" y="300" font-size="11">낮은 우선순위</text>

  <text x="350" y="330" font-size="11" text-anchor="middle">값이 지정되어 있는 가장 우선순위 높은 단계의 값이 최종 값이 됩니다.</text>
  <text x="350" y="348" font-size="11" text-anchor="middle">DirectProperty는 이 우선순위 체계 없이 필드에 저장된 값을 그대로 돌려줍니다.</text>
</svg>

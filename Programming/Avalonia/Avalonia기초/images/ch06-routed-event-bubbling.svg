<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Window -->
  <rect x="40" y="30" width="480" height="360" fill="none" stroke="black" stroke-width="2" />
  <text x="56" y="54" font-size="14" fill="black">Window</text>

  <!-- Grid -->
  <rect x="80" y="80" width="400" height="280" fill="none" stroke="black" stroke-width="2" />
  <text x="96" y="104" font-size="14" fill="black">Grid</text>

  <!-- StackPanel -->
  <rect x="120" y="130" width="320" height="200" fill="none" stroke="black" stroke-width="2" />
  <text x="136" y="154" font-size="14" fill="black">StackPanel</text>

  <!-- Button -->
  <rect x="200" y="220" width="160" height="60" fill="none" stroke="black" stroke-width="2" />
  <text x="250" y="255" font-size="14" fill="black">Button</text>

  <!-- Bubble arrow path -->
  <path d="M 210 220 C 150 190, 120 150, 90 90 C 80 70, 70 55, 60 40"
        fill="none" stroke="black" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="black" />
    </marker>
  </defs>

  <text x="380" y="380" font-size="14" fill="black" text-anchor="end">
    이벤트 버블링(Bubble): Button → StackPanel → Grid → Window
  </text>
  <text x="380" y="400" font-size="12" fill="black" text-anchor="end">
    (e.Handled = true 로 설정하면 전파가 그 지점에서 멈춘다)
  </text>
</svg>

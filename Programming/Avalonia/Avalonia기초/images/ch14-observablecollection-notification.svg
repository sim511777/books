<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="340" fill="white"/>

  <!-- Row 1: ObservableCollection -->
  <text x="20" y="30" font-size="13" font-weight="bold">ObservableCollection&lt;T&gt;</text>

  <g stroke="black" fill="white" stroke-width="1.5">
    <rect x="20" y="45" width="150" height="46"/>
    <rect x="270" y="45" width="180" height="46"/>
    <rect x="540" y="45" width="140" height="46"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="95" y="72">Add(item) 호출</text>
    <text x="360" y="66">CollectionChanged</text>
    <text x="360" y="82">이벤트 발생</text>
    <text x="610" y="66">ListBox가</text>
    <text x="610" y="82">항목만 갱신</text>
  </g>
  <line x1="170" y1="68" x2="268" y2="68" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="68" x2="538" y2="68" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="115" font-size="12" text-anchor="middle" font-weight="bold">화면이 자동으로 최신 상태를 반영합니다</text>

  <!-- divider -->
  <line x1="20" y1="150" x2="680" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Row 2: List<T> -->
  <text x="20" y="180" font-size="13" font-weight="bold">List&lt;T&gt;</text>

  <g stroke="black" fill="white" stroke-width="1.5">
    <rect x="20" y="195" width="150" height="46"/>
    <rect x="270" y="195" width="180" height="46"/>
    <rect x="540" y="195" width="140" height="46"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="95" y="222">Add(item) 호출</text>
    <text x="360" y="216">알림 이벤트</text>
    <text x="360" y="232">없음</text>
    <text x="610" y="216">ListBox는</text>
    <text x="610" y="232">변경을 모름</text>
  </g>
  <line x1="170" y1="218" x2="268" y2="218" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="218" x2="538" y2="218" stroke="black" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="350" y="265" font-size="12" text-anchor="middle" font-weight="bold">화면은 이전 항목 개수로 남아 있습니다</text>
  <text x="350" y="290" font-size="11" text-anchor="middle">(참조 자체를 다시 대입하기 전까지는 갱신되지 않습니다)</text>
</svg>

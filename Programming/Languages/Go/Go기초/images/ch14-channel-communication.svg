<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="380" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">채널을 통한 고루틴 간 통신</text>

  <!-- 고루틴 1 (송신) 박스 -->
  <rect x="40" y="120" width="160" height="100" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="120" y="160" font-size="14" text-anchor="middle" fill="#000000">고루틴 1</text>
  <text x="120" y="180" font-size="12" text-anchor="middle" fill="#555555">(송신하는 쪽)</text>
  <text x="120" y="200" font-size="12" text-anchor="middle" fill="#000000">ch &lt;- 42</text>

  <!-- 채널 박스 -->
  <rect x="300" y="110" width="160" height="120" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="380" y="100" font-size="14" text-anchor="middle" fill="#000000">채널 ch (chan int)</text>
  <!-- 채널 내부 슬롯 표현 -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <rect x="315" y="150" width="35" height="35"/>
    <rect x="362" y="150" width="35" height="35"/>
    <rect x="410" y="150" width="35" height="35"/>
  </g>
  <text x="380" y="200" font-size="11" text-anchor="middle" fill="#555555">먼저 들어온 값이 먼저 나간다 (FIFO)</text>

  <!-- 고루틴 2 (수신) 박스 -->
  <rect x="560" y="120" width="160" height="100" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="640" y="160" font-size="14" text-anchor="middle" fill="#000000">고루틴 2</text>
  <text x="640" y="180" font-size="12" text-anchor="middle" fill="#555555">(수신하는 쪽)</text>
  <text x="640" y="200" font-size="12" text-anchor="middle" fill="#000000">v := &lt;-ch</text>

  <!-- 화살표: 고루틴1 -> 채널 -->
  <line x1="200" y1="170" x2="298" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="249" y="155" font-size="12" text-anchor="middle" fill="#000000">송신</text>

  <!-- 화살표: 채널 -> 고루틴2 -->
  <line x1="462" y1="170" x2="558" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="155" font-size="12" text-anchor="middle" fill="#000000">수신</text>

  <!-- 설명 박스 -->
  <rect x="40" y="260" width="680" height="80" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="60" y="285" font-size="13" font-weight="bold" fill="#000000">핵심 요약</text>
  <text x="60" y="310" font-size="12" fill="#000000">버퍼 없는 채널에서는 송신자와 수신자가 동시에 준비되어야 값이 전달됩니다(랑데부).</text>
  <text x="60" y="330" font-size="12" fill="#000000">버퍼 있는 채널에서는 버퍼에 빈 슬롯이 있는 한, 수신자가 없어도 송신이 먼저 끝날 수 있습니다.</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

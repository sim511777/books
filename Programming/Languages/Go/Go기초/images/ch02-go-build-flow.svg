<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">Go 소스 코드의 빌드와 실행 흐름</text>

  <!-- 1. 소스 파일 -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="30" y="80" width="140" height="70"/>
  </g>
  <text x="100" y="110" font-size="14" text-anchor="middle" fill="#000000">main.go</text>
  <text x="100" y="130" font-size="12" text-anchor="middle" fill="#555555">(소스 코드)</text>

  <!-- 화살표 1 -->
  <line x1="170" y1="115" x2="235" y2="115" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="100" font-size="11" text-anchor="middle" fill="#555555">go build</text>

  <!-- 2. 컴파일러 -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="235" y="70" width="150" height="90"/>
  </g>
  <text x="310" y="105" font-size="14" text-anchor="middle" fill="#000000">Go 컴파일러</text>
  <text x="310" y="125" font-size="12" text-anchor="middle" fill="#555555">어휘/구문 분석</text>
  <text x="310" y="142" font-size="12" text-anchor="middle" fill="#555555">타입 검사, 코드 생성</text>

  <!-- 화살표 2 -->
  <line x1="385" y1="115" x2="450" y2="115" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. 실행 파일 -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="450" y="80" width="150" height="70"/>
  </g>
  <text x="525" y="110" font-size="14" text-anchor="middle" fill="#000000">main(.exe)</text>
  <text x="525" y="130" font-size="12" text-anchor="middle" fill="#555555">(독립 실행 바이너리)</text>

  <!-- 화살표 3 -->
  <line x1="600" y1="115" x2="665" y2="115" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="100" font-size="11" text-anchor="middle" fill="#555555">./main 실행</text>

  <!-- 4. 실행 결과 -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="665" y="80" width="105" height="70"/>
  </g>
  <text x="717" y="110" font-size="13" text-anchor="middle" fill="#000000">프로그램</text>
  <text x="717" y="128" font-size="13" text-anchor="middle" fill="#000000">실행 결과</text>

  <!-- go run 경로 (아래쪽, 점선) -->
  <line x1="100" y1="150" x2="100" y2="230" stroke="#000000" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="100" y1="230" x2="700" y2="230" stroke="#000000" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="330" y="205" width="150" height="30" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="405" y="225" font-size="13" text-anchor="middle" fill="#000000">go run main.go</text>
  <text x="405" y="255" font-size="12" text-anchor="middle" fill="#555555">임시 바이너리를 만들어 즉시 실행하고 곧바로 삭제한다</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 설명 박스 -->
  <rect x="30" y="300" width="740" height="100" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="50" y="330" font-size="14" font-weight="bold" fill="#000000">핵심 요약</text>
  <text x="50" y="355" font-size="13" fill="#000000">1. go build는 소스를 컴파일해 실행 파일을 만들어 디스크에 남기고, 실행은 별도로 해야 한다.</text>
  <text x="50" y="378" font-size="13" fill="#000000">2. go run은 컴파일과 실행을 한 번에 처리하되, 결과 실행 파일을 남기지 않아 빠른 테스트에 적합하다.</text>
</svg>

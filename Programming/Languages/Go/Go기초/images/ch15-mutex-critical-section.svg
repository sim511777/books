<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="380" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">뮤텍스가 임계 구역을 보호하는 모습</text>

  <!-- 고루틴 박스: G1 (Lock 보유) -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="40" y="150" width="150" height="60"/>
  </g>
  <text x="115" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">G1</text>
  <text x="115" y="196" font-size="12" text-anchor="middle" fill="#000000">Lock() 성공, 실행 중</text>

  <!-- 고루틴 박스: G2 (대기) -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="40" y="250" width="150" height="60"/>
  </g>
  <text x="115" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#555555">G2</text>
  <text x="115" y="296" font-size="12" text-anchor="middle" fill="#555555">Lock() 대기 중</text>

  <!-- 고루틴 박스: G3 (대기) -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="40" y="350" width="150" height="60"/>
  </g>
  <text x="115" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#555555">G3</text>
  <text x="115" y="396" font-size="12" text-anchor="middle" fill="#555555">Lock() 대기 중</text>

  <!-- 뮤텍스 게이트 -->
  <text x="385" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">sync.Mutex</text>
  <g stroke="#000000" stroke-width="2" fill="#f2f2f2">
    <rect x="320" y="150" width="130" height="260"/>
  </g>
  <text x="385" y="185" font-size="12" text-anchor="middle" fill="#000000">현재 잠금 보유:</text>
  <text x="385" y="203" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">G1</text>

  <!-- 자물쇠 아이콘 (열림, G1 통과 지점) -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="368" y="230" width="34" height="26"/>
    <path d="M374,230 v-14 a11,11 0 0 1 22,0" />
  </g>
  <text x="385" y="278" font-size="11" text-anchor="middle" fill="#000000">(Lock 상태)</text>

  <!-- 임계 구역 -->
  <text x="605" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">임계 구역 (critical section)</text>
  <g stroke="#000000" stroke-width="2" fill="none">
    <rect x="490" y="150" width="230" height="110"/>
  </g>
  <text x="605" y="195" font-size="13" text-anchor="middle" fill="#000000">공유 변수</text>
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <rect x="545" y="210" width="120" height="34"/>
  </g>
  <text x="605" y="232" font-size="13" text-anchor="middle" fill="#000000">counter = 42</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777777"/>
    </marker>
  </defs>

  <!-- G1 -> 게이트 -> 임계 구역 : Lock 통과 (실선) -->
  <line x1="190" y1="172" x2="480" y2="185" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowBlack)"/>
  <text x="330" y="160" font-size="12" text-anchor="middle" fill="#000000">Lock() 획득</text>

  <!-- 임계 구역 -> 게이트 : Unlock (실선, 반대 방향) -->
  <line x1="480" y1="235" x2="200" y2="222" stroke="#000000" stroke-width="2" stroke-dasharray="1,0" marker-end="url(#arrowBlack)"/>
  <text x="330" y="250" font-size="12" text-anchor="middle" fill="#000000">작업 완료 후 Unlock()</text>

  <!-- G2 -> 게이트 앞에서 대기 (점선, 막힘) -->
  <line x1="190" y1="280" x2="312" y2="280" stroke="#777777" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
  <line x1="316" y1="262" x2="316" y2="298" stroke="#777777" stroke-width="3"/>
  <text x="255" y="300" font-size="11" text-anchor="middle" fill="#777777">대기</text>

  <!-- G3 -> 게이트 앞에서 대기 (점선, 막힘) -->
  <line x1="190" y1="378" x2="312" y2="378" stroke="#777777" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
  <line x1="316" y1="360" x2="316" y2="396" stroke="#777777" stroke-width="3"/>
  <text x="255" y="398" font-size="11" text-anchor="middle" fill="#777777">대기</text>

  <!-- 설명 박스 -->
  <rect x="40" y="440" width="680" height="110" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="60" y="465" font-size="14" font-weight="bold" fill="#000000">핵심 요약</text>
  <text x="60" y="490" font-size="13" fill="#000000">1. 뮤텍스는 임계 구역 앞에 놓인 하나의 문과 같아서, 한 번에 한 고루틴(G1)만 통과시킨다.</text>
  <text x="60" y="512" font-size="13" fill="#000000">2. Lock()을 이미 호출한 고루틴이 있으면, 나머지 고루틴(G2, G3)은 Unlock() 될 때까지 대기한다.</text>
  <text x="60" y="534" font-size="13" fill="#000000">3. G1이 Unlock()을 호출하면 대기 중이던 고루틴 중 하나가 다음으로 Lock()을 획득해 진입한다.</text>
</svg>

<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">여러 구조체의 암묵적 인터페이스 구현</text>

  <!-- Shape 인터페이스 박스 (상단 중앙) -->
  <rect x="330" y="60" width="240" height="90" fill="#f2f2f2" stroke="#000000" stroke-width="2.5"/>
  <text x="450" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Shape 인터페이스</text>
  <text x="450" y="110" text-anchor="middle" font-size="13" fill="#000000">Area() float64</text>
  <text x="450" y="130" text-anchor="middle" font-size="13" fill="#000000">Perimeter() float64</text>

  <!-- 세 구조체 박스: Circle, Rectangle, Triangle -->
  <!-- Circle -->
  <rect x="60" y="260" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="170" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Circle</text>
  <line x1="80" y1="296" x2="260" y2="296" stroke="#000000" stroke-width="1"/>
  <text x="170" y="316" text-anchor="middle" font-size="13" fill="#000000">Radius float64</text>
  <text x="170" y="342" text-anchor="middle" font-size="13" fill="#000000">func (c Circle) Area()</text>
  <text x="170" y="362" text-anchor="middle" font-size="13" fill="#000000">func (c Circle) Perimeter()</text>
  <text x="170" y="392" text-anchor="middle" font-size="12" fill="#555555">(implements 선언 없음)</text>

  <!-- Rectangle -->
  <rect x="340" y="260" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Rectangle</text>
  <line x1="360" y1="296" x2="540" y2="296" stroke="#000000" stroke-width="1"/>
  <text x="450" y="316" text-anchor="middle" font-size="13" fill="#000000">Width, Height float64</text>
  <text x="450" y="342" text-anchor="middle" font-size="13" fill="#000000">func (r Rectangle) Area()</text>
  <text x="450" y="362" text-anchor="middle" font-size="13" fill="#000000">func (r Rectangle) Perimeter()</text>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#555555">(implements 선언 없음)</text>

  <!-- Triangle -->
  <rect x="620" y="260" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="730" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Triangle</text>
  <line x1="640" y1="296" x2="820" y2="296" stroke="#000000" stroke-width="1"/>
  <text x="730" y="316" text-anchor="middle" font-size="13" fill="#000000">Base, Height, A, B, C float64</text>
  <text x="730" y="342" text-anchor="middle" font-size="13" fill="#000000">func (t Triangle) Area()</text>
  <text x="730" y="362" text-anchor="middle" font-size="13" fill="#000000">func (t Triangle) Perimeter()</text>
  <text x="730" y="392" text-anchor="middle" font-size="12" fill="#555555">(implements 선언 없음)</text>

  <!-- 점선 화살표: 각 구조체 -> Shape 인터페이스 -->
  <line x1="170" y1="260" x2="400" y2="152" stroke="#000000" stroke-width="1.75" stroke-dasharray="7,5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="260" x2="450" y2="152" stroke="#000000" stroke-width="1.75" stroke-dasharray="7,5" marker-end="url(#arrow2)"/>
  <line x1="730" y1="260" x2="500" y2="152" stroke="#000000" stroke-width="1.75" stroke-dasharray="7,5" marker-end="url(#arrow2)"/>

  <text x="230" y="205" text-anchor="middle" font-size="12" fill="#000000">메서드 집합이 일치</text>
  <text x="450" y="205" text-anchor="middle" font-size="12" fill="#000000">메서드 집합이 일치</text>
  <text x="655" y="205" text-anchor="middle" font-size="12" fill="#000000">메서드 집합이 일치</text>

  <!-- 하단 사용 예시 -->
  <rect x="130" y="450" width="640" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">var shapes []Shape = []Shape{Circle{...}, Rectangle{...}, Triangle{...}}</text>
  <text x="450" y="502" text-anchor="middle" font-size="13" fill="#000000">세 구조체 모두 Area()와 Perimeter()를 가지고 있으므로,</text>
  <text x="450" y="524" text-anchor="middle" font-size="13" fill="#000000">"implements Shape" 같은 선언 없이도 Shape 타입 변수에 그대로 담을 수 있다</text>
  <text x="450" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">→ 이것이 구조적 타이핑(structural typing)이다</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

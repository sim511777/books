<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Box 1: Source code -->
  <rect x="30" y="150" width="130" height="90" fill="none" stroke="#000000" stroke-width="2" />
  <text x="95" y="185" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">main.zig</text>
  <text x="95" y="208" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">(소스 코드)</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="195" x2="230" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="195" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">zig run /</text>
  <text x="195" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000"></text>

  <!-- Box 2: Zig compiler -->
  <rect x="230" y="150" width="140" height="90" fill="none" stroke="#000000" stroke-width="2" />
  <text x="300" y="185" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">zig 컴파일러</text>
  <text x="300" y="208" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">(파싱 · 타입 검사 ·</text>
  <text x="300" y="224" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">comptime 평가 · 코드 생성)</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="195" x2="440" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 3: Executable -->
  <rect x="440" y="150" width="130" height="90" fill="none" stroke="#000000" stroke-width="2" />
  <text x="505" y="185" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">실행 파일</text>
  <text x="505" y="208" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">(예: main.exe)</text>

  <!-- Arrow 3 -->
  <line x1="505" y1="240" x2="505" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="275" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">실행</text>

  <!-- Box 4: Execution result -->
  <rect x="410" y="300" width="190" height="70" fill="none" stroke="#000000" stroke-width="2" />
  <text x="505" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">실행 결과</text>
  <text x="505" y="352" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">Hello, World!</text>

  <!-- Labels for two entry points at top -->
  <text x="195" y="120" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">zig run main.zig</text>
  <text x="195" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">또는 zig build</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>
</svg>

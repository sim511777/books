<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Title labels -->
  <text x="20" y="30" font-size="15" font-weight="bold" fill="black">배열 [5]i32 (크기가 타입에 포함됨, 고정 5칸)</text>

  <!-- Array boxes -->
  <g stroke="black" fill="none" stroke-width="1.5">
    <rect x="20" y="45" width="60" height="45" />
    <rect x="80" y="45" width="60" height="45" />
    <rect x="140" y="45" width="60" height="45" />
    <rect x="200" y="45" width="60" height="45" />
    <rect x="260" y="45" width="60" height="45" />
  </g>
  <g font-size="14" fill="black" text-anchor="middle">
    <text x="50" y="72">10</text>
    <text x="110" y="72">20</text>
    <text x="170" y="72">30</text>
    <text x="230" y="72">40</text>
    <text x="290" y="72">50</text>
  </g>
  <g font-size="11" fill="black" text-anchor="middle">
    <text x="50" y="105">[0]</text>
    <text x="110" y="105">[1]</text>
    <text x="170" y="105">[2]</text>
    <text x="230" y="105">[3]</text>
    <text x="290" y="105">[4]</text>
  </g>

  <!-- Single-item pointer to whole array -->
  <rect x="40" y="150" width="220" height="55" stroke="black" fill="none" stroke-width="1.5" />
  <text x="150" y="172" font-size="13" text-anchor="middle" fill="black">포인터 *[5]i32</text>
  <text x="150" y="190" font-size="11" text-anchor="middle" fill="black">배열 전체를 가리키는 단일 항목 포인터</text>
  <line x1="150" y1="150" x2="150" y2="92" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Slice box -->
  <rect x="380" y="150" width="260" height="70" stroke="black" fill="none" stroke-width="1.5" />
  <text x="510" y="173" font-size="13" text-anchor="middle" fill="black">슬라이스 []i32</text>
  <g font-size="11" fill="black">
    <rect x="395" y="182" width="115" height="26" stroke="black" fill="none" />
    <text x="452" y="200" text-anchor="middle">ptr: [*]i32</text>
    <rect x="515" y="182" width="110" height="26" stroke="black" fill="none" />
    <text x="570" y="200" text-anchor="middle">len: usize = 3</text>
  </g>

  <!-- Slice ptr points into array element 1 -->
  <line x1="452" y1="182" x2="115" y2="92" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="330" y="130" font-size="11" fill="black" text-anchor="middle">슬라이스는 배열의 일부 구간을</text>
  <text x="330" y="145" font-size="11" fill="black" text-anchor="middle">가리키는 포인터+길이 쌍</text>

  <!-- Bracket showing slice covers elements 1..4 (len 3) -->
  <path d="M 80 118 L 80 125 L 260 125 L 260 118" stroke="black" fill="none" stroke-width="1.5" />
  <text x="170" y="138" font-size="10" fill="black" text-anchor="middle">arr[1..4] 구간 (len = 3)</text>

  <!-- Many-item pointer note -->
  <rect x="380" y="255" width="260" height="70" stroke="black" fill="none" stroke-width="1.5" />
  <text x="510" y="278" font-size="13" text-anchor="middle" fill="black">다중 항목 포인터 [*]i32</text>
  <text x="510" y="296" font-size="11" text-anchor="middle" fill="black">길이 정보 없이 시작 주소만 가짐</text>
  <text x="510" y="312" font-size="11" text-anchor="middle" fill="black">(슬라이스의 ptr 필드가 바로 이 타입)</text>

  <line x1="510" y1="255" x2="510" y2="220" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />

  <!-- Bottom note -->
  <text x="20" y="365" font-size="11" fill="black">*[5]i32 : 배열 전체를 가리키는 단일 항목 포인터, 역참조하면 [5]i32 값 전체</text>
  <text x="20" y="382" font-size="11" fill="black">[]i32 (= { ptr: [*]i32, len: usize }) : 길이가 함께 다니는 배열 구간에 대한 안전한 참조 (13장에서 자세히)</text>
</svg>

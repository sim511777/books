<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" />

  <!-- Column titles -->
  <text x="175" y="35" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#000000">다른 언어 (예: C++/Java/Python)</text>
  <text x="525" y="35" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#000000">Zig</text>

  <!-- Divider -->
  <line x1="350" y1="55" x2="350" y2="385" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Left column -->
  <rect x="45" y="70" width="260" height="60" fill="none" stroke="#000000" stroke-width="2" />
  <text x="175" y="95" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">list.push_back(item)</text>
  <text x="175" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">호출하는 코드</text>

  <line x1="175" y1="130" x2="175" y2="175" stroke="#000000" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="235" y="158" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">암묵적으로</text>

  <rect x="45" y="175" width="260" height="65" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />
  <text x="175" y="200" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">GC / 런타임이 알아서 처리</text>
  <text x="175" y="220" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">(코드에는 보이지 않음)</text>

  <line x1="175" y1="240" x2="175" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="45" y="285" width="260" height="60" fill="none" stroke="#000000" stroke-width="2" />
  <text x="175" y="310" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">힙 메모리</text>
  <text x="175" y="330" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">언제·얼마나 할당되는지 불명확</text>

  <!-- Right column -->
  <rect x="395" y="70" width="260" height="60" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="92" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">list.append(item)</text>
  <text x="525" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">list = ArrayList(...).init(allocator)</text>

  <line x1="525" y1="130" x2="525" y2="175" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="620" y="158" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">allocator 인자로 전달</text>

  <rect x="395" y="175" width="260" height="65" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="200" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">Allocator</text>
  <text x="525" y="220" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">(ptr + vtable: alloc / free)</text>

  <line x1="525" y1="240" x2="525" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="395" y="285" width="260" height="60" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="310" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">힙 메모리</text>
  <text x="525" y="330" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">호출 코드만 봐도 명확</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="300" fill="white"/>

  <!-- 제목 -->
  <text x="380" y="26" font-size="16" text-anchor="middle" fill="black" font-weight="bold">const numbers = [_]i32{10,20,30,40,50}; slice = numbers[1..4];</text>

  <!-- 인덱스 라벨 -->
  <text x="90"  y="62" font-size="13" text-anchor="middle" fill="black">numbers[0]</text>
  <text x="200" y="62" font-size="13" text-anchor="middle" fill="black">numbers[1]</text>
  <text x="310" y="62" font-size="13" text-anchor="middle" fill="black">numbers[2]</text>
  <text x="420" y="62" font-size="13" text-anchor="middle" fill="black">numbers[3]</text>
  <text x="530" y="62" font-size="13" text-anchor="middle" fill="black">numbers[4]</text>

  <!-- 배열 박스 -->
  <g stroke="black" stroke-width="2" fill="none">
    <rect x="40"  y="72" width="100" height="56"/>
    <rect x="150" y="72" width="100" height="56"/>
    <rect x="260" y="72" width="100" height="56"/>
    <rect x="370" y="72" width="100" height="56"/>
    <rect x="480" y="72" width="100" height="56"/>
  </g>

  <!-- 값 텍스트 -->
  <text x="90"  y="107" font-size="17" text-anchor="middle" fill="black">10</text>
  <text x="200" y="107" font-size="17" text-anchor="middle" fill="black">20</text>
  <text x="310" y="107" font-size="17" text-anchor="middle" fill="black">30</text>
  <text x="420" y="107" font-size="17" text-anchor="middle" fill="black">40</text>
  <text x="530" y="107" font-size="17" text-anchor="middle" fill="black">50</text>

  <!-- 주소 텍스트 -->
  <text x="90"  y="146" font-size="12" text-anchor="middle" fill="black">0x1000</text>
  <text x="200" y="146" font-size="12" text-anchor="middle" fill="black">0x1004</text>
  <text x="310" y="146" font-size="12" text-anchor="middle" fill="black">0x1008</text>
  <text x="420" y="146" font-size="12" text-anchor="middle" fill="black">0x100C</text>
  <text x="530" y="146" font-size="12" text-anchor="middle" fill="black">0x1010</text>

  <!-- 슬라이스가 덮는 구간 표시 -->
  <g stroke="black" stroke-width="1.5">
    <line x1="150" y1="160" x2="480" y2="160"/>
    <line x1="150" y1="155" x2="150" y2="165"/>
    <line x1="480" y1="155" x2="480" y2="165"/>
  </g>
  <text x="315" y="180" font-size="13" text-anchor="middle" fill="black">slice가 가리키는 구간 (len = 3)</text>

  <!-- 슬라이스 값 박스 -->
  <rect x="230" y="205" width="170" height="66" stroke="black" stroke-width="2" fill="none"/>
  <text x="315" y="228" font-size="13" text-anchor="middle" fill="black" font-weight="bold">slice: []const i32</text>
  <text x="315" y="248" font-size="12" text-anchor="middle" fill="black">ptr = &amp;numbers[1] (0x1004)</text>
  <text x="315" y="264" font-size="12" text-anchor="middle" fill="black">len = 3</text>

  <!-- ptr에서 numbers[1]로 향하는 화살표 -->
  <path d="M 260 205 L 200 128" stroke="black" stroke-width="1.5" fill="none" marker-end="url(#arrow13)"/>
  <defs>
    <marker id="arrow13" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="black"/>
    </marker>
  </defs>

  <!-- 하단 설명 -->
  <text x="380" y="292" font-size="12" text-anchor="middle" fill="black">slice는 numbers의 데이터를 복사하지 않고, 주소(ptr)와 개수(len)만으로 그중 일부를 가리킵니다.</text>
</svg>

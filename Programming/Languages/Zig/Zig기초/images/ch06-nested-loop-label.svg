<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff" />

  <!-- Outer loop box -->
  <rect x="60" y="30" width="560" height="260" fill="none" stroke="#000000" stroke-width="2" />
  <text x="80" y="55" font-family="sans-serif" font-size="14" fill="#000000">outer: while (i &lt; 5) : (i += 1) {</text>
  <text x="80" y="278" font-family="sans-serif" font-size="14" fill="#000000">}</text>

  <!-- Inner loop box -->
  <rect x="110" y="90" width="460" height="160" fill="none" stroke="#000000" stroke-width="2" />
  <text x="130" y="115" font-family="sans-serif" font-size="14" fill="#000000">while (j &lt; 5) : (j += 1) {</text>
  <text x="130" y="235" font-family="sans-serif" font-size="14" fill="#000000">}</text>

  <!-- Break condition box -->
  <rect x="160" y="150" width="360" height="60" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="173" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">if (i == 2 and j == 2)</text>
  <text x="340" y="196" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">break :outer;</text>

  <!-- Escaping arrow crossing both boundaries -->
  <line x1="340" y1="210" x2="340" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrow6)" />

  <!-- Exit box -->
  <rect x="140" y="330" width="420" height="80" fill="none" stroke="#000000" stroke-width="2" />
  <text x="350" y="357" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">break :outer 실행</text>
  <text x="350" y="379" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">→ outer 루프를 즉시 종료 (inner while도 함께 종료)</text>

  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>
</svg>

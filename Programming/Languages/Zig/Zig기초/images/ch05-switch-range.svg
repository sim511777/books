<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff" />

  <!-- Box A: input value -->
  <rect x="280" y="20" width="140" height="50" fill="none" stroke="#000000" stroke-width="2" />
  <text x="350" y="50" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#000000">score: u8</text>

  <!-- Arrow A to B -->
  <line x1="350" y1="70" x2="350" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)" />

  <!-- Box B: switch -->
  <rect x="230" y="110" width="240" height="55" fill="none" stroke="#000000" stroke-width="2" />
  <text x="350" y="143" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">switch (score) { ... }</text>

  <!-- Fan-out arrows -->
  <line x1="300" y1="165" x2="115" y2="245" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)" />
  <line x1="350" y1="165" x2="350" y2="245" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)" />
  <line x1="400" y1="165" x2="585" y2="245" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)" />

  <!-- Case boxes -->
  <rect x="30" y="245" width="170" height="70" fill="none" stroke="#000000" stroke-width="2" />
  <text x="115" y="272" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">0...59</text>
  <text x="115" y="294" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">=&gt; "F"</text>

  <rect x="265" y="245" width="170" height="70" fill="none" stroke="#000000" stroke-width="2" />
  <text x="350" y="272" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">60...89</text>
  <text x="350" y="294" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">=&gt; "B"</text>

  <rect x="500" y="245" width="170" height="70" fill="none" stroke="#000000" stroke-width="2" />
  <text x="585" y="272" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">90...100</text>
  <text x="585" y="294" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">=&gt; "A"</text>

  <!-- Caption -->
  <text x="350" y="350" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">score 값과 일치하는 분기 하나만 실행되고, switch 전체는 그 분기의 값을 반환한다</text>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="400" y="38" font-family="sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">지연 평가: thunk가 값으로 바뀌는 순간</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 코드 -->
  <text x="400" y="78" font-family="monospace" font-size="15" fill="#000000" text-anchor="middle">let ys = map (*2) [1, 2, 3]</text>

  <!-- 1단계 라벨 -->
  <text x="60" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">1. 정의 시점</text>
  <text x="60" y="150" font-family="sans-serif" font-size="13" fill="#000000">아직 아무 계산도 실행되지 않는다</text>

  <!-- 1단계: 세 개의 thunk (점선 박스) -->
  <rect x="220" y="105" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="295" y="130" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">thunk</text>
  <text x="295" y="150" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">(*2) 1</text>

  <rect x="390" y="105" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="465" y="130" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">thunk</text>
  <text x="465" y="150" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">(*2) 2</text>

  <rect x="560" y="105" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="635" y="130" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">thunk</text>
  <text x="635" y="150" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">(*2) 3</text>

  <!-- 트리거 -->
  <text x="400" y="210" font-family="monospace" font-size="15" fill="#000000" text-anchor="middle">ys !! 0</text>
  <line x1="400" y1="220" x2="400" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="440" y="245" font-family="sans-serif" font-size="13" fill="#000000">첫 번째 값만 요구</text>

  <!-- 2단계 라벨 -->
  <text x="60" y="300" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">2. 값이 필요해진 시점</text>
  <text x="60" y="320" font-family="sans-serif" font-size="13" fill="#000000">요구된 값만 평가되고,</text>
  <text x="60" y="338" font-family="sans-serif" font-size="13" fill="#000000">나머지는 여전히 thunk로 남는다</text>

  <!-- 2단계: 첫 번째는 평가된 값(실선), 나머지는 여전히 thunk(점선) -->
  <rect x="220" y="275" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="295" y="300" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">평가됨</text>
  <text x="295" y="320" font-family="monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">2</text>

  <rect x="390" y="275" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="465" y="300" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">thunk</text>
  <text x="465" y="320" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">(*2) 2</text>

  <rect x="560" y="275" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="635" y="300" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">thunk</text>
  <text x="635" y="320" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">(*2) 3</text>

  <!-- GHCi :sprint 결과 -->
  <rect x="150" y="390" width="500" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="415" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">GHCi로 직접 관찰하기: :sprint</text>
  <text x="400" y="440" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">ghci&gt; :sprint ys</text>
  <text x="400" y="460" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">ys = [2, _, _]</text>

  <!-- 범례 -->
  <rect x="130" y="500" width="18" height="18" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="155" y="514" font-family="sans-serif" font-size="13" fill="#000000">미평가 thunk ( _ )</text>
  <rect x="330" y="500" width="18" height="18" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="355" y="514" font-family="sans-serif" font-size="13" fill="#000000">평가된 값</text>

  <text x="400" y="545" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">필요한 값만, 필요해진 순간에 정확히 그만큼만 평가된다</text>
</svg>

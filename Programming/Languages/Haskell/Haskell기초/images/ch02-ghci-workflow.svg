<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="400" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">GHCi 개발 순환 흐름</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 1. 코드 작성 (좌상단) -->
  <rect x="90" y="100" width="220" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="200" y="140" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">1. 코드 작성</text>
  <text x="200" y="165" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">에디터에서 .hs 파일 편집</text>
  <text x="200" y="184" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">예: Hello.hs</text>

  <!-- 2. GHCi에 로드 (우상단) -->
  <rect x="490" y="100" width="220" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="140" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">2. GHCi에 로드</text>
  <text x="600" y="165" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">:load Hello.hs</text>
  <text x="600" y="184" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">(수정 후에는 :reload)</text>

  <!-- 3. 평가 (우하단) -->
  <rect x="490" y="330" width="220" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">3. 평가</text>
  <text x="600" y="395" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">ghci&gt; main</text>
  <text x="600" y="414" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">함수와 표현식 호출</text>

  <!-- 4. 결과 확인 (좌하단) -->
  <rect x="90" y="330" width="220" height="100" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="200" y="370" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">4. 결과 확인</text>
  <text x="200" y="395" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">출력 값과 :type 확인</text>
  <text x="200" y="414" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">기대한 결과인지 검토</text>

  <!-- 화살표: 1 -> 2 -->
  <line x1="310" y1="150" x2="490" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표: 2 -> 3 -->
  <line x1="600" y1="200" x2="600" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표: 3 -> 4 -->
  <line x1="490" y1="380" x2="310" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표: 4 -> 1 (다시 코드 수정) -->
  <line x1="200" y1="330" x2="200" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 순환 설명 라벨 -->
  <text x="200" y="270" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">결과가 다르면</text>
  <text x="200" y="288" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">코드를 다시 수정</text>

  <!-- 하단 안내 -->
  <text x="400" y="490" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">코드 작성 → 로드(:load/:reload) → 평가 → 결과 확인 → 다시 코드 작성으로 이어지는 반복 흐름</text>
</svg>

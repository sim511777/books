<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">do 표기법으로 연결된 IO 액션</text>

  <!-- 전체를 감싸는 점선 상자: 전체가 하나의 IO () 값 -->
  <rect x="40" y="60" width="500" height="430" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="60" y="82" font-size="13" fill="#000000">전체는 하나의 IO () 값 (main)</text>

  <!-- Box 1 -->
  <rect x="90" y="100" width="400" height="70" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="290" y="128" text-anchor="middle" font-size="15" fill="#000000">putStrLn "이름을 입력하세요:"</text>
  <text x="290" y="150" text-anchor="middle" font-size="13" fill="#000000">:: IO ()</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="170" x2="290" y2="215" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="198" text-anchor="end" font-size="13" fill="#000000">&gt;&gt; (결과 무시하고 순서만 이음)</text>

  <!-- Box 2 -->
  <rect x="90" y="220" width="400" height="70" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="290" y="248" text-anchor="middle" font-size="15" fill="#000000">getLine</text>
  <text x="290" y="270" text-anchor="middle" font-size="13" fill="#000000">:: IO String</text>

  <!-- side box: extracted value -->
  <rect x="560" y="228" width="150" height="54" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="635" y="250" text-anchor="middle" font-size="13" fill="#000000">name :: String</text>
  <text x="635" y="268" text-anchor="middle" font-size="12" fill="#000000">(상자에서 꺼낸 값)</text>
  <line x1="490" y1="255" x2="558" y2="255" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="524" y="245" text-anchor="middle" font-size="11" fill="#000000">name &lt;-</text>

  <!-- Arrow 2 -->
  <line x1="290" y1="290" x2="290" y2="335" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="318" text-anchor="end" font-size="13" fill="#000000">&gt;&gt;= (name 값을 다음 액션에 전달)</text>

  <!-- Box 3 -->
  <rect x="90" y="340" width="400" height="70" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="290" y="366" text-anchor="middle" font-size="14" fill="#000000">putStrLn ("안녕하세요, " ++ name ++ "!")</text>
  <text x="290" y="390" text-anchor="middle" font-size="13" fill="#000000">:: IO ()</text>

  <!-- Arrow 3 to result -->
  <line x1="290" y1="410" x2="290" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result box -->
  <rect x="130" y="455" width="320" height="45" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="290" y="483" text-anchor="middle" font-size="13" fill="#000000">runtime이 main을 실행 → 실제 부작용 발생</text>

  <text x="380" y="530" text-anchor="middle" font-size="12" fill="#000000">각 상자는 "부작용을 수행하는 계획"이며, &gt;&gt;=/&gt;&gt;는 계획들을 순서대로 이어 붙인다.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" font-size="18" text-anchor="middle" font-weight="bold">vcpkg와 CMake의 통합 흐름</text>

  <!-- Stage 1: vcpkg install -->
  <rect x="20" y="70" width="140" height="90" fill="white" stroke="black" stroke-width="2" />
  <text x="90" y="100" font-size="13" text-anchor="middle" font-weight="bold">vcpkg install fmt</text>
  <text x="90" y="120" font-size="11" text-anchor="middle" fill="#555">라이브러리 컴파일</text>
  <text x="90" y="136" font-size="11" text-anchor="middle" fill="#555">installed/ 에 저장</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="115" x2="205" y2="115" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2: toolchain file -->
  <rect x="210" y="70" width="150" height="90" fill="white" stroke="black" stroke-width="2" />
  <text x="285" y="95" font-size="13" text-anchor="middle" font-weight="bold">툴체인 파일</text>
  <text x="285" y="115" font-size="10.5" text-anchor="middle" fill="#555">scripts/buildsystems/</text>
  <text x="285" y="130" font-size="10.5" text-anchor="middle" fill="#555">vcpkg.cmake</text>
  <text x="285" y="148" font-size="10.5" text-anchor="middle" fill="#555">CMAKE_TOOLCHAIN_FILE</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="115" x2="405" y2="115" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 3: CMakeLists.txt -->
  <rect x="410" y="70" width="150" height="90" fill="white" stroke="black" stroke-width="2" />
  <text x="485" y="95" font-size="13" text-anchor="middle" font-weight="bold">CMakeLists.txt</text>
  <text x="485" y="115" font-size="10" text-anchor="middle" fill="#555">find_package(fmt</text>
  <text x="485" y="129" font-size="10" text-anchor="middle" fill="#555">  CONFIG REQUIRED)</text>
  <text x="485" y="147" font-size="10" text-anchor="middle" fill="#555">target_link_libraries(...)</text>

  <!-- Arrow 3 -->
  <line x1="560" y1="115" x2="605" y2="115" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 4: build result -->
  <rect x="610" y="70" width="75" height="90" fill="white" stroke="black" stroke-width="2" />
  <text x="647" y="105" font-size="12" text-anchor="middle">실행 파일</text>
  <text x="647" y="122" font-size="10" text-anchor="middle" fill="#555">fmt_demo</text>

  <!-- Detail: installed folder -->
  <rect x="20" y="220" width="140" height="90" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="90" y="240" font-size="11" text-anchor="middle" font-weight="bold">installed/</text>
  <text x="35" y="260" font-size="10">- include/fmt/*.h</text>
  <text x="35" y="277" font-size="10">- lib/fmt.lib</text>
  <text x="35" y="294" font-size="10">- share/fmt/*.cmake</text>

  <line x1="90" y1="160" x2="90" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Detail: cmake command -->
  <rect x="210" y="220" width="150" height="90" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="285" y="240" font-size="11" text-anchor="middle" font-weight="bold">cmake -B build</text>
  <text x="222" y="262" font-size="9.5">-DCMAKE_TOOLCHAIN_FILE=</text>
  <text x="222" y="278" font-size="9.5">C:/vcpkg/scripts/</text>
  <text x="222" y="294" font-size="9.5">buildsystems/vcpkg.cmake</text>

  <line x1="285" y1="160" x2="285" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Detail: link target -->
  <rect x="410" y="220" width="150" height="90" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="485" y="240" font-size="11" text-anchor="middle" font-weight="bold">임포트된 타겟</text>
  <text x="485" y="262" font-size="10.5" text-anchor="middle">fmt::fmt</text>
  <text x="485" y="282" font-size="9.5" text-anchor="middle" fill="#555">헤더 경로 + 라이브러리</text>
  <text x="485" y="296" font-size="9.5" text-anchor="middle" fill="#555">자동으로 함께 연결</text>

  <line x1="485" y1="160" x2="485" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Note -->
  <text x="350" y="390" font-size="12" text-anchor="middle" fill="#555">네 단계 중 하나라도 빠지면 구성(configure) 또는 링크 단계에서 오류가 발생한다</text>
</svg>

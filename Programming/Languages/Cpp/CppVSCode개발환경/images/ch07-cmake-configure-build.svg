<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-size="18" text-anchor="middle" font-weight="bold">CMake의 Configure → Generate → Build 흐름</text>

  <!-- Stage 1: CMakeLists.txt -->
  <rect x="30" y="80" width="140" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="100" y="115" font-size="14" text-anchor="middle">CMakeLists.txt</text>
  <text x="100" y="135" font-size="11" text-anchor="middle" fill="#555">(프로젝트 설정)</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="120" x2="220" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <text x="195" y="105" font-size="11" text-anchor="middle">cmake -B build</text>

  <!-- Stage 2: Configure/Generate -->
  <rect x="225" y="80" width="160" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="305" y="108" font-size="14" text-anchor="middle">Configure</text>
  <text x="305" y="126" font-size="14" text-anchor="middle">+ Generate</text>
  <text x="305" y="145" font-size="11" text-anchor="middle" fill="#555">(build/ 안에 빌드 파일 생성)</text>

  <!-- Arrow 2 -->
  <line x1="385" y1="120" x2="435" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="105" font-size="11" text-anchor="middle">cmake --build</text>

  <!-- Stage 3: Build -->
  <rect x="440" y="80" width="140" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="510" y="115" font-size="14" text-anchor="middle">Build</text>
  <text x="510" y="135" font-size="11" text-anchor="middle" fill="#555">(실제 컴파일·링크)</text>

  <!-- Arrow 3 -->
  <line x1="580" y1="120" x2="630" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 4: Executable -->
  <rect x="600" y="80" width="90" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="645" y="115" font-size="13" text-anchor="middle">실행 파일</text>
  <text x="645" y="132" font-size="10" text-anchor="middle" fill="#555">(.exe)</text>

  <!-- Detail boxes below stage 2 -->
  <rect x="225" y="220" width="160" height="120" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="305" y="240" font-size="12" text-anchor="middle" font-weight="bold">build/ 디렉토리</text>
  <text x="240" y="265" font-size="11">- CMakeCache.txt</text>
  <text x="240" y="285" font-size="11">- build.ninja</text>
  <text x="240" y="305" font-size="11">  (또는 Makefile)</text>
  <text x="240" y="325" font-size="11">- CMakeFiles/</text>

  <line x1="305" y1="160" x2="305" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Note -->
  <text x="350" y="380" font-size="12" text-anchor="middle" fill="#555">Configure는 한 번만, Build는 소스가 바뀔 때마다 반복 실행</text>
</svg>

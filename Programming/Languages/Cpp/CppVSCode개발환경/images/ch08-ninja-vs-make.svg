<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <text x="350" y="28" font-size="18" text-anchor="middle" font-weight="bold">Make와 Ninja 빌드 방식 비교</text>

  <!-- Divider -->
  <line x1="350" y1="45" x2="350" y2="400" stroke="black" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Make side -->
  <text x="175" y="60" font-size="15" text-anchor="middle" font-weight="bold">Make</text>
  <rect x="55" y="75" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="175" y="98" font-size="12" text-anchor="middle">Makefile 파싱</text>
  <text x="175" y="116" font-size="10" text-anchor="middle" fill="#555">(셸 문법 포함, 규칙 재해석)</text>

  <line x1="175" y1="130" x2="175" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow2)" />

  <rect x="55" y="160" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="175" y="183" font-size="12" text-anchor="middle">의존성 그래프 계산</text>
  <text x="175" y="201" font-size="10" text-anchor="middle" fill="#555">(실행할 때마다 다시 계산)</text>

  <line x1="175" y1="215" x2="175" y2="245" stroke="black" stroke-width="2" marker-end="url(#arrow2)" />

  <rect x="55" y="245" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="175" y="268" font-size="12" text-anchor="middle">작업 스케줄링 및 실행</text>
  <text x="175" y="286" font-size="10" text-anchor="middle" fill="#555">(병렬화 효율 상대적으로 낮음)</text>

  <rect x="55" y="330" width="240" height="46" fill="#eee" stroke="black" stroke-width="1.5" />
  <text x="175" y="350" font-size="12" text-anchor="middle" font-weight="bold">증분 빌드 확인 비용 ↑</text>
  <text x="175" y="366" font-size="10" text-anchor="middle" fill="#555">사람이 직접 작성하기도 함</text>

  <!-- Ninja side -->
  <text x="525" y="60" font-size="15" text-anchor="middle" font-weight="bold">Ninja</text>
  <rect x="405" y="75" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="525" y="98" font-size="12" text-anchor="middle">build.ninja 로드</text>
  <text x="525" y="116" font-size="10" text-anchor="middle" fill="#555">(단순한 선언적 문법, 파싱 빠름)</text>

  <line x1="525" y1="130" x2="525" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow2)" />

  <rect x="405" y="160" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="525" y="183" font-size="12" text-anchor="middle">사전 계산된 그래프 사용</text>
  <text x="525" y="201" font-size="10" text-anchor="middle" fill="#555">(CMake가 미리 만들어 둠)</text>

  <line x1="525" y1="215" x2="525" y2="245" stroke="black" stroke-width="2" marker-end="url(#arrow2)" />

  <rect x="405" y="245" width="240" height="55" fill="white" stroke="black" stroke-width="2" />
  <text x="525" y="268" font-size="12" text-anchor="middle">작업 스케줄링 및 실행</text>
  <text x="525" y="286" font-size="10" text-anchor="middle" fill="#555">(병렬 작업 스케줄링 최적화)</text>

  <rect x="405" y="330" width="240" height="46" fill="#eee" stroke="black" stroke-width="1.5" />
  <text x="525" y="350" font-size="12" text-anchor="middle" font-weight="bold">증분 빌드 확인 비용 ↓</text>
  <text x="525" y="366" font-size="10" text-anchor="middle" fill="#555">CMake 등 상위 도구가 생성한 파일 실행 전용</text>

  <text x="350" y="410" font-size="11" text-anchor="middle" fill="#555">같은 프로젝트라도 Ninja는 그래프 재계산과 파싱 비용이 적어 반복 빌드가 더 빠르다</text>
</svg>

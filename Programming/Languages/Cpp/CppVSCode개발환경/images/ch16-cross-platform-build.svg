<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" font-size="16" text-anchor="middle" font-weight="bold">CMakePresets.json으로 하나의 프로젝트를 여러 플랫폼에서 빌드하기</text>

  <!-- Source box -->
  <rect x="20" y="160" width="150" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="95" y="188" font-size="12" text-anchor="middle" font-weight="bold">CMakeLists.txt</text>
  <text x="95" y="206" font-size="12" text-anchor="middle" font-weight="bold">+</text>
  <text x="95" y="224" font-size="12" text-anchor="middle" font-weight="bold">CMakePresets.json</text>

  <!-- Row 1: Windows -->
  <line x1="170" y1="200" x2="230" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="230" y="60" width="150" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="305" y="83" font-size="12" text-anchor="middle">configurePreset</text>
  <text x="305" y="100" font-size="12" text-anchor="middle" font-weight="bold">"windows-msvc"</text>
  <text x="305" y="132" font-size="10" text-anchor="middle" fill="#555">generator: Visual Studio</text>
  <text x="305" y="145" font-size="10" text-anchor="middle" fill="#555">triplet: x64-windows</text>

  <line x1="380" y1="90" x2="440" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="440" y="60" width="130" height="60" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="505" y="93" font-size="11" text-anchor="middle">build/windows/</text>

  <line x1="570" y1="90" x2="610" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="610" y="60" width="70" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="645" y="88" font-size="11" text-anchor="middle">app.exe</text>
  <text x="645" y="103" font-size="9" text-anchor="middle" fill="#555">(MSVC)</text>

  <!-- Row 2: Linux -->
  <line x1="170" y1="200" x2="230" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="230" y="170" width="150" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="305" y="193" font-size="12" text-anchor="middle">configurePreset</text>
  <text x="305" y="210" font-size="12" text-anchor="middle" font-weight="bold">"linux-gcc"</text>
  <text x="305" y="242" font-size="10" text-anchor="middle" fill="#555">generator: Ninja</text>
  <text x="305" y="255" font-size="10" text-anchor="middle" fill="#555">triplet: x64-linux</text>

  <line x1="380" y1="200" x2="440" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="440" y="170" width="130" height="60" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="505" y="203" font-size="11" text-anchor="middle">build/linux/</text>

  <line x1="570" y1="200" x2="610" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="610" y="170" width="70" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="645" y="198" font-size="11" text-anchor="middle">app</text>
  <text x="645" y="213" font-size="9" text-anchor="middle" fill="#555">(ELF)</text>

  <!-- Row 3: macOS -->
  <line x1="170" y1="200" x2="230" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="230" y="280" width="150" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="305" y="303" font-size="12" text-anchor="middle">configurePreset</text>
  <text x="305" y="320" font-size="12" text-anchor="middle" font-weight="bold">"macos-clang"</text>
  <text x="305" y="352" font-size="10" text-anchor="middle" fill="#555">generator: Ninja</text>
  <text x="305" y="365" font-size="10" text-anchor="middle" fill="#555">triplet: x64-osx</text>

  <line x1="380" y1="310" x2="440" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="440" y="280" width="130" height="60" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="505" y="313" font-size="11" text-anchor="middle">build/macos/</text>

  <line x1="570" y1="310" x2="610" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="610" y="280" width="70" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="645" y="308" font-size="11" text-anchor="middle">app</text>
  <text x="645" y="323" font-size="9" text-anchor="middle" fill="#555">(Mach-O)</text>
</svg>

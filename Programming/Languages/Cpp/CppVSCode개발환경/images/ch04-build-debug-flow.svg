<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <!-- Step 1: Source code -->
  <rect x="20" y="40" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="95" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">main.cpp</text>
  <text x="95" y="88" text-anchor="middle" font-size="11" fill="#000000">소스 코드</text>

  <!-- Step 2: tasks.json -->
  <rect x="215" y="40" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="290" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">tasks.json</text>
  <text x="290" y="80" text-anchor="middle" font-size="10.5" fill="#000000">g++ 빌드 명령 정의</text>
  <text x="290" y="94" text-anchor="middle" font-size="10.5" fill="#000000">Ctrl+Shift+B</text>

  <!-- Step 3: Executable -->
  <rect x="410" y="40" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="485" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">main.exe</text>
  <text x="485" y="88" text-anchor="middle" font-size="11" fill="#000000">빌드된 실행 파일</text>

  <!-- Step 4: launch.json -->
  <rect x="605" y="40" width="135" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="672" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">launch.json</text>
  <text x="672" y="80" text-anchor="middle" font-size="10.5" fill="#000000">디버거 실행 설정</text>
  <text x="672" y="94" text-anchor="middle" font-size="10.5" fill="#000000">F5</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Arrows across top row -->
  <line x1="170" y1="75" x2="212" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="365" y1="75" x2="407" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="388" y="60" text-anchor="middle" font-size="10" fill="#000000">컴파일</text>
  <line x1="560" y1="75" x2="602" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="582" y="60" text-anchor="middle" font-size="10" fill="#000000">program 지정</text>

  <!-- preLaunchTask relation: launch.json back to tasks.json -->
  <path d="M 672 113 C 672 200, 290 200, 290 113" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="480" y="185" text-anchor="middle" font-size="10.5" fill="#000000">preLaunchTask로 빌드를 먼저 실행</text>

  <!-- Step 5: GDB -->
  <rect x="530" y="330" width="180" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="620" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">GDB</text>
  <text x="620" y="377" text-anchor="middle" font-size="11" fill="#000000">miDebuggerPath로 지정된</text>
  <text x="620" y="392" text-anchor="middle" font-size="11" fill="#000000">디버거 프로세스</text>

  <!-- launch.json -> GDB -->
  <line x1="672" y1="113" x2="640" y2="327" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="230" font-size="10.5" fill="#000000">디버거 연결</text>

  <!-- GDB -> executable (attach/run) -->
  <line x1="527" y1="370" x2="485" y2="113" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="230" font-size="10.5" fill="#000000">실행 파일 구동 및</text>
  <text x="440" y="244" font-size="10.5" fill="#000000">중단점에서 정지</text>

  <!-- VS Code editor box behind, showing breakpoint interaction -->
  <rect x="20" y="330" width="420" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="230" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">VS Code 편집기 화면</text>
  <text x="230" y="374" text-anchor="middle" font-size="10.5" fill="#000000">중단점(breakpoint) 표시, 변수 값 확인</text>
  <text x="230" y="390" text-anchor="middle" font-size="10.5" fill="#000000">Step Over / Into / Out 제어</text>

  <!-- GDB <-> editor -->
  <line x1="527" y1="380" x2="443" y2="375" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="365" text-anchor="middle" font-size="10" fill="#000000">상태 보고</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <!-- 배경: 흰색 -->
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="380" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000000">배열의 메모리 배치와 포인터</text>

  <!-- 코드 설명 -->
  <text x="30" y="60" font-family="monospace" font-size="14" fill="#000000">int numbers[5] = {10, 20, 30, 40, 50};</text>
  <text x="30" y="80" font-family="monospace" font-size="14" fill="#000000">int* p = numbers;   // 배열 이름은 첫 원소의 주소로 변환된다</text>

  <!-- 메모리 주소 라벨 -->
  <text x="120" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">0x1000</text>
  <text x="220" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">0x1004</text>
  <text x="320" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">0x1008</text>
  <text x="420" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">0x100C</text>
  <text x="520" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">0x1010</text>

  <!-- 배열 원소 박스 (연속된 메모리) -->
  <g stroke="#000000" stroke-width="2" fill="#ffffff">
    <rect x="70" y="130" width="100" height="60"/>
    <rect x="170" y="130" width="100" height="60"/>
    <rect x="270" y="130" width="100" height="60"/>
    <rect x="370" y="130" width="100" height="60"/>
    <rect x="470" y="130" width="100" height="60"/>
  </g>

  <!-- 원소 값 -->
  <text x="120" y="167" font-family="monospace" font-size="16" text-anchor="middle" fill="#000000">10</text>
  <text x="220" y="167" font-family="monospace" font-size="16" text-anchor="middle" fill="#000000">20</text>
  <text x="320" y="167" font-family="monospace" font-size="16" text-anchor="middle" fill="#000000">30</text>
  <text x="420" y="167" font-family="monospace" font-size="16" text-anchor="middle" fill="#000000">40</text>
  <text x="520" y="167" font-family="monospace" font-size="16" text-anchor="middle" fill="#000000">50</text>

  <!-- 인덱스 라벨 -->
  <text x="120" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">numbers[0]</text>
  <text x="220" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">numbers[1]</text>
  <text x="320" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">numbers[2]</text>
  <text x="420" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">numbers[3]</text>
  <text x="520" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">numbers[4]</text>

  <!-- 배열 전체를 감싸는 점선: 연속된 메모리 영역임을 표시 -->
  <rect x="65" y="125" width="510" height="70" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="580" y="165" font-family="sans-serif" font-size="12" fill="#000000">(연속된 메모리)</text>

  <!-- 포인터 변수 박스 -->
  <rect x="70" y="270" width="120" height="50" stroke="#000000" stroke-width="2" fill="#ffffff"/>
  <text x="130" y="290" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">포인터 변수</text>
  <text x="130" y="308" font-family="monospace" font-size="14" text-anchor="middle" fill="#000000">p = 0x1000</text>

  <!-- 포인터가 첫 원소를 가리키는 화살표 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
  <path d="M130,270 C130,240 120,210 120,192" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 하단 설명 -->
  <text x="230" y="300" font-family="sans-serif" font-size="13" fill="#000000">p는 numbers 배열의 첫 원소 numbers[0]의 주소를 저장하며,</text>
  <text x="230" y="320" font-family="sans-serif" font-size="13" fill="#000000">*p는 10, *(p+1)은 20, p[2]는 30을 가리킨다.</text>
</svg>

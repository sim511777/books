<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="520" fill="white" stroke="none"/>

  <!-- 제목 -->
  <text x="450" y="32" font-size="18" text-anchor="middle" fill="black" font-weight="bold">unique_ptr vs shared_ptr 소유권 모델</text>

  <!-- 구분선 -->
  <line x1="450" y1="55" x2="450" y2="470" stroke="black" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- 왼쪽: unique_ptr -->
  <text x="225" y="75" font-size="15" text-anchor="middle" fill="black" font-weight="bold">unique_ptr : 단독 소유권</text>

  <rect x="150" y="100" width="150" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="225" y="130" font-size="13" text-anchor="middle" fill="black">unique_ptr&lt;Widget&gt; ptr</text>

  <line x1="225" y1="150" x2="225" y2="215" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="220" width="150" height="60" fill="#f2f2f2" stroke="black" stroke-width="1.5"/>
  <text x="225" y="245" font-size="13" text-anchor="middle" fill="black">Widget 객체</text>
  <text x="225" y="263" font-size="12" text-anchor="middle" fill="black">(heap)</text>

  <text x="225" y="330" font-size="12" text-anchor="middle" fill="black">소유자는 오직 하나뿐</text>
  <text x="225" y="350" font-size="12" text-anchor="middle" fill="black">복사(copy) 불가, 이동(move)만 가능</text>

  <rect x="120" y="390" width="210" height="46" fill="white" stroke="black" stroke-width="1"/>
  <text x="225" y="410" font-size="12" text-anchor="middle" fill="black">ptr가 범위를 벗어나면</text>
  <text x="225" y="426" font-size="12" text-anchor="middle" fill="black">소멸자가 자동으로 delete 호출</text>

  <!-- 오른쪽: shared_ptr -->
  <text x="675" y="75" font-size="15" text-anchor="middle" fill="black" font-weight="bold">shared_ptr : 공유 소유권 (참조 카운트)</text>

  <rect x="500" y="95" width="140" height="36" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="118" font-size="12" text-anchor="middle" fill="black">shared_ptr ptr1</text>

  <rect x="500" y="150" width="140" height="36" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="173" font-size="12" text-anchor="middle" fill="black">shared_ptr ptr2</text>

  <rect x="500" y="205" width="140" height="36" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="228" font-size="12" text-anchor="middle" fill="black">shared_ptr ptr3</text>

  <rect x="700" y="140" width="150" height="60" fill="#f2f2f2" stroke="black" stroke-width="1.5"/>
  <text x="775" y="165" font-size="13" text-anchor="middle" fill="black">Widget 객체</text>
  <text x="775" y="183" font-size="12" text-anchor="middle" fill="black">(heap)</text>

  <line x1="640" y1="113" x2="700" y2="155" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="168" x2="700" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="223" x2="700" y2="185" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="775" y1="200" x2="775" y2="235" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="705" y="235" width="140" height="36" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="775" y="258" font-size="12" text-anchor="middle" fill="black">참조 카운트 : 3</text>

  <text x="675" y="305" font-size="12" text-anchor="middle" fill="black">shared_ptr를 복사하면 카운트 +1</text>
  <text x="675" y="325" font-size="12" text-anchor="middle" fill="black">shared_ptr가 소멸하면 카운트 -1</text>

  <rect x="565" y="390" width="220" height="46" fill="white" stroke="black" stroke-width="1"/>
  <text x="675" y="410" font-size="12" text-anchor="middle" fill="black">참조 카운트가 0이 되는 순간</text>
  <text x="675" y="426" font-size="12" text-anchor="middle" fill="black">마지막 소유자가 delete 호출</text>

  <!-- 하단 공통 설명 -->
  <rect x="60" y="455" width="780" height="45" fill="white" stroke="black" stroke-width="1"/>
  <text x="450" y="483" font-size="13" text-anchor="middle" fill="black">두 경우 모두 소멸자가 자동으로 호출되어 메모리 해제를 보장한다 (RAII 원칙)</text>
</svg>

<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">스택(Stack)과 힙(Heap) 메모리</text>

  <!-- Stack region -->
  <rect x="40" y="60" width="260" height="380" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="170" y="85" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">스택 영역</text>
  <text x="170" y="103" font-size="11" text-anchor="middle" fill="#000000">함수 호출과 함께 자동 생성/소멸</text>

  <!-- stack frames -->
  <rect x="60" y="120" width="220" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="140" font-size="12" text-anchor="middle" fill="#000000">main() 함수 프레임</text>
  <text x="170" y="158" font-size="11" text-anchor="middle" fill="#000000">int number = 5;</text>
  <text x="170" y="174" font-size="11" text-anchor="middle" fill="#000000">int&amp; ref = number;</text>

  <rect x="60" y="195" width="220" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="215" font-size="12" text-anchor="middle" fill="#000000">use_buffer() 함수 프레임</text>
  <text x="170" y="233" font-size="11" text-anchor="middle" fill="#000000">int* dynamic_array</text>
  <text x="170" y="249" font-size="11" text-anchor="middle" fill="#000000">(힙 주소를 저장)</text>

  <!-- arrow growth -->
  <line x1="60" y1="270" x2="60" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="298" font-size="10" fill="#000000">호출될수록 아래로 쌓임</text>

  <text x="170" y="420" font-size="11" text-anchor="middle" fill="#000000">스코프 종료 시 자동 해제</text>
  <text x="170" y="436" font-size="11" text-anchor="middle" fill="#000000">(별도의 delete 불필요)</text>

  <!-- Heap region -->
  <rect x="400" y="60" width="260" height="380" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="530" y="85" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold">힙 영역</text>
  <text x="530" y="103" font-size="11" text-anchor="middle" fill="#000000">new로 할당, delete로 해제</text>

  <rect x="420" y="130" width="220" height="70" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="530" y="150" font-size="12" text-anchor="middle" fill="#000000">new int[5]로 할당된 블록</text>
  <text x="530" y="168" font-size="11" text-anchor="middle" fill="#000000">[0][1][2][3][4]</text>
  <text x="530" y="186" font-size="10" text-anchor="middle" fill="#000000">delete[] 호출 전까지 계속 존재</text>

  <rect x="420" y="215" width="220" height="60" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="530" y="238" font-size="11" text-anchor="middle" fill="#000000">delete[]를 잊으면</text>
  <text x="530" y="256" font-size="11" text-anchor="middle" fill="#000000">메모리 누수 발생</text>

  <text x="530" y="420" font-size="11" text-anchor="middle" fill="#000000">프로그래머(또는 RAII 객체)가</text>
  <text x="530" y="436" font-size="11" text-anchor="middle" fill="#000000">직접 해제 책임을 짐</text>

  <!-- pointer arrow from stack to heap -->
  <line x1="280" y1="240" x2="420" y2="165" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="345" y="195" font-size="11" fill="#000000">dynamic_array가 가리킴</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

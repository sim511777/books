<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff" />

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="500" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">C++ 빌드 파이프라인</text>

  <!-- 1. 소스 코드 -->
  <rect x="30" y="90" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="105" y="118" font-size="15" text-anchor="middle" fill="#000000">소스 코드</text>
  <text x="105" y="138" font-size="13" text-anchor="middle" fill="#000000">main.cpp</text>

  <path d="M180,125 L225,125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. 전처리기 -->
  <rect x="225" y="90" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="300" y="118" font-size="15" text-anchor="middle" fill="#000000">전처리기</text>
  <text x="300" y="138" font-size="13" text-anchor="middle" fill="#000000">#include, #define 처리</text>

  <path d="M375,125 L420,125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. 컴파일러 -->
  <rect x="420" y="90" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="495" y="118" font-size="15" text-anchor="middle" fill="#000000">컴파일러</text>
  <text x="495" y="138" font-size="13" text-anchor="middle" fill="#000000">소스 → 어셈블리(.s)</text>

  <path d="M570,125 L615,125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. 어셈블러 -->
  <rect x="615" y="90" width="150" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="690" y="118" font-size="15" text-anchor="middle" fill="#000000">어셈블러</text>
  <text x="690" y="138" font-size="13" text-anchor="middle" fill="#000000">어셈블리 → 목적 파일</text>

  <!-- 목적 파일 -->
  <path d="M690,160 L690,230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="615" y="230" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="690" y="255" font-size="15" text-anchor="middle" fill="#000000">목적 파일</text>
  <text x="690" y="275" font-size="13" text-anchor="middle" fill="#000000">main.o</text>

  <!-- 다른 소스 파일들도 같은 과정을 거침을 보여주는 보조 경로 -->
  <rect x="30" y="230" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />
  <text x="105" y="255" font-size="14" text-anchor="middle" fill="#000000">utils.cpp</text>
  <text x="105" y="273" font-size="12" text-anchor="middle" fill="#000000">(같은 과정을 거쳐 .o 생성)</text>
  <path d="M105,290 L105,330" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M105,330 L560,330" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="230" y="300" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="305" y="325" font-size="15" text-anchor="middle" fill="#000000">목적 파일</text>
  <text x="305" y="343" font-size="13" text-anchor="middle" fill="#000000">utils.o</text>

  <!-- 라이브러리 -->
  <rect x="420" y="300" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="495" y="325" font-size="15" text-anchor="middle" fill="#000000">라이브러리</text>
  <text x="495" y="343" font-size="13" text-anchor="middle" fill="#000000">libstdc++, libc 등</text>

  <!-- 링커로 모이는 화살표 -->
  <path d="M690,290 L500,430" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M305,360 L470,430" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M495,360 L495,430" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. 링커 -->
  <rect x="380" y="430" width="230" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="495" y="460" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">링커 (Linker)</text>
  <text x="495" y="480" font-size="13" text-anchor="middle" fill="#000000">여러 .o와 라이브러리를 하나로 결합</text>

  <path d="M495,500 L495,545" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6. 실행 파일 -->
  <rect x="395" y="545" width="200" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="495" y="572" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">실행 파일</text>
  <text x="495" y="592" font-size="13" text-anchor="middle" fill="#000000">a.out / app.exe</text>
</svg>

<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="940" height="620" fill="white"/>

  <!-- 제목 -->
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="black">상속(extends)과 믹스인(with)의 구조</text>

  <!-- Animal 박스 -->
  <rect x="370" y="55" width="200" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="black">Animal</text>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="black">name, makeSound()</text>

  <!-- 분기선: Animal에서 아래로, 좌우로 갈라짐 -->
  <line x1="470" y1="115" x2="470" y2="150" stroke="black" stroke-width="2"/>
  <line x1="175" y1="150" x2="755" y2="150" stroke="black" stroke-width="2"/>
  <line x1="175" y1="150" x2="175" y2="205" stroke="black" stroke-width="2" marker-end="url(#arrow10)"/>
  <line x1="470" y1="150" x2="470" y2="205" stroke="black" stroke-width="2" marker-end="url(#arrow10)"/>
  <line x1="755" y1="150" x2="755" y2="205" stroke="black" stroke-width="2" marker-end="url(#arrow10)"/>

  <text x="175" y="175" text-anchor="middle" font-size="12" fill="black">extends</text>
  <text x="470" y="175" text-anchor="middle" font-size="12" fill="black">extends</text>
  <text x="755" y="175" text-anchor="middle" font-size="12" fill="black">extends</text>

  <!-- Dog -->
  <rect x="90" y="205" width="170" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="175" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="black">Dog</text>
  <text x="175" y="250" text-anchor="middle" font-size="11" fill="black">makeSound() 재정의</text>

  <!-- Cat -->
  <rect x="385" y="205" width="170" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="470" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="black">Cat</text>
  <text x="470" y="250" text-anchor="middle" font-size="11" fill="black">makeSound() 재정의</text>

  <!-- Duck -->
  <rect x="670" y="205" width="170" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="755" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="black">Duck</text>
  <text x="755" y="246" text-anchor="middle" font-size="11" fill="black">with Flyable,</text>
  <text x="755" y="262" text-anchor="middle" font-size="11" fill="black">Swimmable</text>

  <!-- 믹스인 박스 (점선 테두리) -->
  <rect x="560" y="400" width="170" height="55" fill="white" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="645" y="423" text-anchor="middle" font-size="14" font-weight="bold" fill="black">Flyable</text>
  <text x="645" y="441" text-anchor="middle" font-size="11" fill="black">mixin: fly()</text>

  <rect x="760" y="400" width="170" height="55" fill="white" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="845" y="423" text-anchor="middle" font-size="14" font-weight="bold" fill="black">Swimmable</text>
  <text x="845" y="441" text-anchor="middle" font-size="11" fill="black">mixin: swim()</text>

  <!-- 점선 화살표: 믹스인 -> Duck -->
  <line x1="660" y1="400" x2="740" y2="278" stroke="black" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow10)"/>
  <line x1="830" y1="400" x2="770" y2="278" stroke="black" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow10)"/>

  <text x="600" y="345" text-anchor="middle" font-size="12" fill="black">with</text>
  <text x="855" y="345" text-anchor="middle" font-size="12" fill="black">with</text>

  <!-- 범례 -->
  <line x1="90" y1="500" x2="140" y2="500" stroke="black" stroke-width="2"/>
  <text x="150" y="504" font-size="12" fill="black">실선: extends (부모는 오직 하나만 가능)</text>

  <line x1="90" y1="525" x2="140" y2="525" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="529" font-size="12" fill="black">점선: with (믹스인은 여러 개를 동시에 조합 가능)</text>

  <!-- 하단 설명 -->
  <rect x="60" y="555" width="820" height="46" fill="white" stroke="black" stroke-width="1"/>
  <text x="470" y="583" text-anchor="middle" font-size="13" fill="black">Duck은 Animal의 자식(is-a)이면서, 동시에 Flyable과 Swimmable의 능력을 함께 갖는다.</text>
</svg>

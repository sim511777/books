<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="480" fill="white" />

  <!-- 제목 -->
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="black">동기 실행 vs Future.wait 동시 실행 — 시간 흐름 비교</text>

  <!-- ===================== 섹션 1: 동기 실행 ===================== -->
  <text x="60" y="68" font-size="16" font-weight="bold" fill="black">① 동기 실행 (순서대로 기다림)</text>

  <!-- 작업 박스: A, B, C가 순서대로 이어짐 -->
  <rect x="150" y="90" width="160" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="230" y="115" text-anchor="middle" font-size="13" fill="black">작업 A</text>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="black">(2초)</text>

  <rect x="310" y="90" width="240" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="430" y="115" text-anchor="middle" font-size="13" fill="black">작업 B</text>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="black">(3초)</text>

  <rect x="550" y="90" width="80" height="60" fill="white" stroke="black" stroke-width="2" />
  <text x="590" y="115" text-anchor="middle" font-size="13" fill="black">작업 C</text>
  <text x="590" y="134" text-anchor="middle" font-size="12" fill="black">(1초)</text>

  <!-- 시간 축: 0초 ~ 6초 -->
  <line x1="150" y1="170" x2="630" y2="170" stroke="black" stroke-width="1" />
  <g font-size="11" fill="black">
    <line x1="150" y1="165" x2="150" y2="175" stroke="black" stroke-width="1" />
    <text x="150" y="188" text-anchor="middle">0초</text>
    <line x1="230" y1="165" x2="230" y2="175" stroke="black" stroke-width="1" />
    <text x="230" y="188" text-anchor="middle">1초</text>
    <line x1="310" y1="165" x2="310" y2="175" stroke="black" stroke-width="1" />
    <text x="310" y="188" text-anchor="middle">2초</text>
    <line x1="390" y1="165" x2="390" y2="175" stroke="black" stroke-width="1" />
    <text x="390" y="188" text-anchor="middle">3초</text>
    <line x1="470" y1="165" x2="470" y2="175" stroke="black" stroke-width="1" />
    <text x="470" y="188" text-anchor="middle">4초</text>
    <line x1="550" y1="165" x2="550" y2="175" stroke="black" stroke-width="1" />
    <text x="550" y="188" text-anchor="middle">5초</text>
    <line x1="630" y1="165" x2="630" y2="175" stroke="black" stroke-width="1" />
    <text x="630" y="188" text-anchor="middle">6초</text>
  </g>

  <!-- 총 소요 시간 화살표 -->
  <line x1="150" y1="210" x2="630" y2="210" stroke="black" stroke-width="1.5" />
  <polygon points="150,210 160,205 160,215" fill="black" />
  <polygon points="630,210 620,205 620,215" fill="black" />
  <text x="390" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="black">총 소요 시간: 6초 (2 + 3 + 1)</text>

  <!-- 구분선 -->
  <line x1="40" y1="252" x2="860" y2="252" stroke="black" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ===================== 섹션 2: Future.wait 동시 실행 ===================== -->
  <text x="60" y="284" font-size="16" font-weight="bold" fill="black">② Future.wait 동시 실행 (동시에 시작)</text>

  <!-- 작업 A: 0~2초 -->
  <rect x="150" y="300" width="160" height="36" fill="white" stroke="black" stroke-width="2" />
  <text x="230" y="323" text-anchor="middle" font-size="13" fill="black">작업 A (2초)</text>

  <!-- 작업 B: 0~3초 -->
  <rect x="150" y="345" width="240" height="36" fill="white" stroke="black" stroke-width="2" />
  <text x="270" y="368" text-anchor="middle" font-size="13" fill="black">작업 B (3초)</text>

  <!-- 작업 C: 0~1초 -->
  <rect x="150" y="390" width="80" height="36" fill="white" stroke="black" stroke-width="2" />
  <text x="190" y="413" text-anchor="middle" font-size="13" fill="black">작업 C (1초)</text>

  <!-- 시간 축: 0초 ~ 6초 (섹션 1과 같은 척도) -->
  <line x1="150" y1="434" x2="630" y2="434" stroke="black" stroke-width="1" />
  <g font-size="11" fill="black">
    <line x1="150" y1="429" x2="150" y2="439" stroke="black" stroke-width="1" />
    <text x="150" y="452" text-anchor="middle">0초</text>
    <line x1="230" y1="429" x2="230" y2="439" stroke="black" stroke-width="1" />
    <text x="230" y="452" text-anchor="middle">1초</text>
    <line x1="310" y1="429" x2="310" y2="439" stroke="black" stroke-width="1" />
    <text x="310" y="452" text-anchor="middle">2초</text>
    <line x1="390" y1="429" x2="390" y2="439" stroke="black" stroke-width="1" />
    <text x="390" y="452" text-anchor="middle">3초</text>
    <line x1="470" y1="429" x2="470" y2="439" stroke="black" stroke-width="1" />
    <text x="470" y="452" text-anchor="middle">4초</text>
    <line x1="550" y1="429" x2="550" y2="439" stroke="black" stroke-width="1" />
    <text x="550" y="452" text-anchor="middle">5초</text>
    <line x1="630" y1="429" x2="630" y2="439" stroke="black" stroke-width="1" />
    <text x="630" y="452" text-anchor="middle">6초</text>
  </g>

  <!-- 총 소요 시간 화살표: 가장 오래 걸리는 작업 B(3초) 기준 -->
  <line x1="150" y1="470" x2="390" y2="470" stroke="black" stroke-width="1.5" />
  <polygon points="150,470 160,465 160,475" fill="black" />
  <polygon points="390,470 380,465 380,475" fill="black" />
  <text x="270" y="472" text-anchor="middle" font-size="0" fill="black"></text>
  <text x="500" y="472" text-anchor="start" font-size="14" font-weight="bold" fill="black">총 소요 시간: 3초 (가장 긴 작업 기준)</text>
</svg>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="white" />

  <!-- Generic function name -->
  <rect x="270" y="20" width="160" height="60" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="45" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">area(shape)</text>
  <text x="350" y="65" font-family="sans-serif" font-size="12" text-anchor="middle">제네릭 함수</text>

  <!-- Method 1: Circle -->
  <rect x="30" y="180" width="180" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="207" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">area(shape::Circle)</text>
  <text x="120" y="227" font-family="sans-serif" font-size="12" text-anchor="middle">pi * radius^2</text>

  <!-- Method 2: Rectangle -->
  <rect x="260" y="180" width="180" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="207" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">area(shape::Rectangle)</text>
  <text x="350" y="227" font-family="sans-serif" font-size="12" text-anchor="middle">width * height</text>

  <!-- Method 3: Triangle -->
  <rect x="490" y="180" width="180" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="580" y="207" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">area(shape::Triangle)</text>
  <text x="580" y="227" font-family="sans-serif" font-size="12" text-anchor="middle">base * height / 2</text>

  <!-- Arrows from generic function to each method -->
  <line x1="300" y1="80" x2="130" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arrow10)" />
  <line x1="350" y1="80" x2="350" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arrow10)" />
  <line x1="400" y1="80" x2="570" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arrow10)" />

  <!-- Call examples below each method -->
  <text x="120" y="285" font-family="sans-serif" font-size="12" text-anchor="middle">area(Circle(3.0))</text>
  <text x="350" y="285" font-family="sans-serif" font-size="12" text-anchor="middle">area(Rectangle(4.0, 5.0))</text>
  <text x="580" y="285" font-family="sans-serif" font-size="12" text-anchor="middle">area(Triangle(6.0, 2.0))</text>

  <line x1="120" y1="250" x2="120" y2="275" stroke="black" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="350" y1="250" x2="350" y2="275" stroke="black" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="580" y1="250" x2="580" y2="275" stroke="black" stroke-width="1" stroke-dasharray="3,3" />

  <text x="350" y="350" font-family="sans-serif" font-size="14" text-anchor="middle" font-style="italic">같은 함수 이름이라도 인자 타입 조합에 따라 다른 메서드가 선택된다</text>
</svg>

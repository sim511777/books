<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow17" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="white" />

  <!-- ============ 순차 실행 ============ -->
  <text x="350" y="26" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">순차 실행 (스레드 1개)</text>

  <rect x="50" y="45" width="140" height="65" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="83" font-family="sans-serif" font-size="14" text-anchor="middle">작업 1</text>

  <rect x="200" y="45" width="140" height="65" fill="none" stroke="black" stroke-width="2" />
  <text x="270" y="83" font-family="sans-serif" font-size="14" text-anchor="middle">작업 2</text>

  <rect x="350" y="45" width="140" height="65" fill="none" stroke="black" stroke-width="2" />
  <text x="420" y="83" font-family="sans-serif" font-size="14" text-anchor="middle">작업 3</text>

  <rect x="500" y="45" width="140" height="65" fill="none" stroke="black" stroke-width="2" />
  <text x="570" y="83" font-family="sans-serif" font-size="14" text-anchor="middle">작업 4</text>

  <!-- time axis for sequential -->
  <line x1="50" y1="135" x2="655" y2="135" stroke="black" stroke-width="1.5" marker-end="url(#arrow17)" />
  <text x="670" y="140" font-family="sans-serif" font-size="13" text-anchor="middle">시간</text>
  <line x1="640" y1="112" x2="640" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4,3" />
  <text x="640" y="165" font-family="sans-serif" font-size="12" text-anchor="middle">완료</text>

  <!-- divider -->
  <line x1="20" y1="195" x2="680" y2="195" stroke="black" stroke-width="1" stroke-dasharray="2,3" />

  <!-- ============ 병렬 실행 ============ -->
  <text x="350" y="222" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">병렬 실행: Threads.@threads (스레드 4개)</text>

  <rect x="50" y="240" width="140" height="45" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="267" font-family="sans-serif" font-size="13" text-anchor="middle">스레드1: 작업1</text>

  <rect x="50" y="295" width="140" height="45" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="322" font-family="sans-serif" font-size="13" text-anchor="middle">스레드2: 작업2</text>

  <rect x="50" y="350" width="140" height="45" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="377" font-family="sans-serif" font-size="13" text-anchor="middle">스레드3: 작업3</text>

  <rect x="50" y="405" width="140" height="45" fill="none" stroke="black" stroke-width="2" />
  <text x="120" y="432" font-family="sans-serif" font-size="13" text-anchor="middle">스레드4: 작업4</text>

  <!-- alignment lines showing simultaneous start/end -->
  <line x1="50" y1="232" x2="50" y2="458" stroke="black" stroke-width="1" stroke-dasharray="4,3" />
  <line x1="190" y1="232" x2="190" y2="458" stroke="black" stroke-width="1" stroke-dasharray="4,3" />

  <!-- time axis for parallel -->
  <line x1="50" y1="465" x2="655" y2="465" stroke="black" stroke-width="1.5" marker-end="url(#arrow17)" />
  <text x="670" y="470" font-family="sans-serif" font-size="13" text-anchor="middle">시간</text>

  <text x="270" y="270" font-family="sans-serif" font-size="12" text-anchor="start">4개의 작업이</text>
  <text x="270" y="288" font-family="sans-serif" font-size="12" text-anchor="start">동시에 시작해서</text>
  <text x="270" y="306" font-family="sans-serif" font-size="12" text-anchor="start">동시에 끝납니다.</text>
  <text x="270" y="330" font-family="sans-serif" font-size="12" text-anchor="start" font-style="italic">(이론상 1/4 시간)</text>
</svg>

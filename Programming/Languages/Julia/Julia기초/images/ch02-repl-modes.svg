<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="white" />

  <!-- Julian mode (center) -->
  <rect x="270" y="165" width="160" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="192" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">Julian 모드</text>
  <text x="350" y="212" font-family="sans-serif" font-size="13" text-anchor="middle">(기본, julia&gt;)</text>

  <!-- Pkg mode (top) -->
  <rect x="270" y="20" width="160" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="47" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">Pkg 모드</text>
  <text x="350" y="67" font-family="sans-serif" font-size="13" text-anchor="middle">(pkg&gt;)</text>

  <!-- Shell mode (left) -->
  <rect x="30" y="165" width="160" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="110" y="192" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">셸 모드</text>
  <text x="110" y="212" font-family="sans-serif" font-size="13" text-anchor="middle">(shell&gt;)</text>

  <!-- Help mode (right) -->
  <rect x="510" y="165" width="160" height="70" fill="none" stroke="black" stroke-width="2" />
  <text x="590" y="192" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">도움말 모드</text>
  <text x="590" y="212" font-family="sans-serif" font-size="13" text-anchor="middle">(help?&gt;)</text>

  <!-- Julian -> Pkg -->
  <line x1="335" y1="165" x2="335" y2="92" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="130" font-family="sans-serif" font-size="14" text-anchor="middle">]</text>
  <!-- Pkg -> Julian -->
  <line x1="365" y1="92" x2="365" y2="165" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="400" y="130" font-family="sans-serif" font-size="12" text-anchor="middle">Backspace</text>

  <!-- Julian -> Shell -->
  <line x1="270" y1="188" x2="192" y2="188" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="230" y="182" font-family="sans-serif" font-size="14" text-anchor="middle">;</text>
  <!-- Shell -> Julian -->
  <line x1="192" y1="212" x2="270" y2="212" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="230" y="230" font-family="sans-serif" font-size="12" text-anchor="middle">Backspace</text>

  <!-- Julian -> Help -->
  <line x1="430" y1="188" x2="508" y2="188" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="470" y="182" font-family="sans-serif" font-size="14" text-anchor="middle">?</text>
  <!-- Help -> Julian -->
  <line x1="508" y1="212" x2="430" y2="212" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="470" y="230" font-family="sans-serif" font-size="12" text-anchor="middle">Backspace</text>

  <!-- Bottom note -->
  <text x="350" y="290" font-family="sans-serif" font-size="13" text-anchor="middle">각 모드는 프롬프트 맨 앞에서 전환 키를 눌러 들어가고,</text>
  <text x="350" y="310" font-family="sans-serif" font-size="13" text-anchor="middle">빈 줄에서 Backspace를 누르면 다시 Julian 모드로 돌아옵니다.</text>

  <text x="350" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" font-style="italic">Julia REPL의 네 가지 모드</text>
</svg>

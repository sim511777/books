<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="450" fill="white" />

  <!-- Any -->
  <rect x="280" y="20" width="140" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="50" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Any</text>

  <!-- Number -->
  <rect x="280" y="100" width="140" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="130" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">Number</text>

  <!-- Real -->
  <rect x="280" y="180" width="140" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">Real</text>

  <!-- AbstractFloat -->
  <rect x="100" y="260" width="170" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="185" y="290" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">AbstractFloat</text>

  <!-- Integer -->
  <rect x="430" y="260" width="170" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="515" y="290" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Integer</text>

  <!-- Float64 -->
  <rect x="20" y="360" width="110" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="75" y="390" font-family="sans-serif" font-size="13" text-anchor="middle">Float64</text>

  <!-- Float32 -->
  <rect x="150" y="360" width="110" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="205" y="390" font-family="sans-serif" font-size="13" text-anchor="middle">Float32</text>

  <!-- Int64 -->
  <rect x="390" y="360" width="110" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="445" y="390" font-family="sans-serif" font-size="13" text-anchor="middle">Int64</text>

  <!-- Int32 -->
  <rect x="520" y="360" width="110" height="50" fill="none" stroke="black" stroke-width="2" />
  <text x="575" y="390" font-family="sans-serif" font-size="13" text-anchor="middle">Int32</text>

  <!-- Any -> Number -->
  <line x1="350" y1="70" x2="350" y2="98" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- Number -> Real -->
  <line x1="350" y1="150" x2="350" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- Real -> AbstractFloat -->
  <line x1="300" y1="230" x2="200" y2="258" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- Real -> Integer -->
  <line x1="400" y1="230" x2="500" y2="258" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- AbstractFloat -> Float64 -->
  <line x1="160" y1="310" x2="90" y2="358" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- AbstractFloat -> Float32 -->
  <line x1="210" y1="310" x2="215" y2="358" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- Integer -> Int64 -->
  <line x1="490" y1="310" x2="460" y2="358" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />
  <!-- Integer -> Int32 -->
  <line x1="540" y1="310" x2="565" y2="358" stroke="black" stroke-width="1.5" marker-end="url(#arrow9)" />

  <text x="350" y="435" font-family="sans-serif" font-size="14" text-anchor="middle" font-style="italic">Julia 숫자 타입 계층 (추상 타입은 굵은 글씨, 맨 아래 줄이 구체 타입)</text>
</svg>

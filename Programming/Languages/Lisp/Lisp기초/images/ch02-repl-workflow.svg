<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="35" text-anchor="middle" font-size="20" fill="#000000" font-weight="bold">REPL 기반 개발 순환 흐름</text>

  <!-- Node 1: 코드 작성 -->
  <rect x="60" y="90" width="180" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-size="18" fill="#000000">코드 작성</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#000000">(.lisp 파일 또는</text>
  <text x="150" y="168" text-anchor="middle" font-size="13" fill="#000000">REPL 입력줄)</text>

  <!-- Node 2: REPL에 평가 -->
  <rect x="270" y="220" width="180" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="360" y="255" text-anchor="middle" font-size="18" fill="#000000">REPL에 평가</text>
  <text x="360" y="280" text-anchor="middle" font-size="13" fill="#000000">(load "파일명") 또는</text>
  <text x="360" y="298" text-anchor="middle" font-size="13" fill="#000000">표현식 직접 입력</text>

  <!-- Node 3: 결과 확인 -->
  <rect x="480" y="90" width="180" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="570" y="125" text-anchor="middle" font-size="18" fill="#000000">결과 확인</text>
  <text x="570" y="150" text-anchor="middle" font-size="13" fill="#000000">(=> 값, print,</text>
  <text x="570" y="168" text-anchor="middle" font-size="13" fill="#000000">format 출력)</text>

  <!-- Arrow 1: 코드작성 -> REPL평가 -->
  <line x1="200" y1="180" x2="310" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow 2: REPL평가 -> 결과확인 -->
  <line x1="420" y1="230" x2="520" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow 3: 결과확인 -> 코드작성 (loop back, top) -->
  <path d="M 480 130 C 380 40, 260 40, 245 85" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- labels on arrows -->
  <text x="220" y="195" font-size="12" fill="#000000">수정/작성</text>
  <text x="450" y="195" font-size="12" fill="#000000">실행</text>
  <text x="330" y="55" font-size="12" fill="#000000">오류나 개선점 발견 시 다시 수정</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- bottom caption -->
  <text x="360" y="390" text-anchor="middle" font-size="13" fill="#333333">이 순환을 빠르게 반복하는 것이 Lisp의 대화형(REPL) 개발 방식의 핵심입니다.</text>
</svg>

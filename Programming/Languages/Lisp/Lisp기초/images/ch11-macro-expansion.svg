<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="white"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">매크로 확장과 실행 흐름</text>

  <!-- Box 1: 매크로 호출 코드 -->
  <rect x="30" y="70" width="230" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="145" y="95" font-size="14" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">① 매크로 호출 코드</text>
  <text x="145" y="120" font-size="12" font-family="monospace" text-anchor="middle" fill="black">(my-unless</text>
  <text x="145" y="138" font-size="12" font-family="monospace" text-anchor="middle" fill="black">  (&gt; 3 5)</text>
  <text x="145" y="156" font-size="12" font-family="monospace" text-anchor="middle" fill="black">  (format t "실행됨"))</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="125" x2="330" y2="125" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="100" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">매크로</text>
  <text x="295" y="113" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">확장</text>

  <!-- Box 2: 확장된 코드 -->
  <rect x="335" y="70" width="230" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="450" y="95" font-size="14" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">② 확장된 코드</text>
  <text x="450" y="120" font-size="12" font-family="monospace" text-anchor="middle" fill="black">(if (not (&gt; 3 5))</text>
  <text x="450" y="138" font-size="12" font-family="monospace" text-anchor="middle" fill="black">  (progn</text>
  <text x="450" y="156" font-size="12" font-family="monospace" text-anchor="middle" fill="black">    (format t "실행됨")))</text>

  <!-- Arrow 2 -->
  <line x1="565" y1="125" x2="635" y2="125" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="100" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">컴파일</text>
  <text x="600" y="113" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">/평가</text>

  <!-- Box 3: 실행 결과 -->
  <rect x="640" y="70" width="230" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="755" y="95" font-size="14" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">③ 실행 결과</text>
  <text x="755" y="125" font-size="12" font-family="monospace" text-anchor="middle" fill="black">(NOT (&gt; 3 5))</text>
  <text x="755" y="143" font-size="12" font-family="monospace" text-anchor="middle" fill="black">→ T 이므로</text>
  <text x="755" y="161" font-size="12" font-family="monospace" text-anchor="middle" fill="black">"실행됨" 출력</text>

  <!-- Bottom timeline -->
  <line x1="30" y1="260" x2="870" y2="260" stroke="black" stroke-width="1.5"/>
  <line x1="450" y1="250" x2="450" y2="270" stroke="black" stroke-width="1.5"/>

  <text x="145" y="290" font-size="13" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">매크로 확장 시점</text>
  <text x="145" y="308" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">(컴파일 타임)</text>
  <text x="145" y="326" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">코드(리스트)를 받아</text>
  <text x="145" y="342" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">새로운 코드(리스트)를 생성</text>

  <text x="755" y="290" font-size="13" font-family="sans-serif" text-anchor="middle" fill="black" font-weight="bold">실행 시점</text>
  <text x="755" y="308" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">(런타임)</text>
  <text x="755" y="326" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">생성된 코드가</text>
  <text x="755" y="342" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">실제로 평가되어 동작</text>

  <text x="450" y="360" font-size="11" font-family="sans-serif" text-anchor="middle" fill="black">※ 함수 호출이었다면 인자가 먼저 평가된 뒤 호출되지만, 매크로는 코드 자체를 변형한다</text>
</svg>

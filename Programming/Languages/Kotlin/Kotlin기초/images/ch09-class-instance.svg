<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 흰 배경 -->
  <rect x="0" y="0" width="800" height="420" fill="white"/>

  <!-- 클래스(설계도) 박스 -->
  <rect x="30" y="140" width="220" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="black">클래스 Person (설계도)</text>
  <line x1="30" y1="175" x2="250" y2="175" stroke="black" stroke-width="1"/>
  <text x="45" y="200" font-size="15" fill="black">val name: String</text>
  <text x="45" y="225" font-size="15" fill="black">var age: Int</text>
  <text x="45" y="255" font-size="13" fill="black">(각 필드는 값이</text>
  <text x="45" y="272" font-size="13" fill="black">정해지지 않은 상태)</text>

  <!-- 화살표들: 클래스에서 인스턴스로 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <line x1="250" y1="180" x2="420" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="210" x2="420" y2="210" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="240" x2="420" y2="330" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="300" y="120" font-size="13" fill="black">생성</text>
  <text x="300" y="200" font-size="13" fill="black">생성</text>
  <text x="300" y="300" font-size="13" fill="black">생성</text>

  <!-- 인스턴스 1 -->
  <rect x="430" y="30" width="330" height="90" fill="white" stroke="black" stroke-width="2"/>
  <text x="445" y="55" font-size="15" font-weight="bold" fill="black">인스턴스 p1 : Person</text>
  <line x1="430" y1="65" x2="760" y2="65" stroke="black" stroke-width="1"/>
  <text x="445" y="85" font-size="14" fill="black">name = "김철수"</text>
  <text x="445" y="105" font-size="14" fill="black">age = 25</text>

  <!-- 인스턴스 2 -->
  <rect x="430" y="165" width="330" height="90" fill="white" stroke="black" stroke-width="2"/>
  <text x="445" y="190" font-size="15" font-weight="bold" fill="black">인스턴스 p2 : Person</text>
  <line x1="430" y1="200" x2="760" y2="200" stroke="black" stroke-width="1"/>
  <text x="445" y="220" font-size="14" fill="black">name = "이영희"</text>
  <text x="445" y="240" font-size="14" fill="black">age = 30</text>

  <!-- 인스턴스 3 -->
  <rect x="430" y="285" width="330" height="90" fill="white" stroke="black" stroke-width="2"/>
  <text x="445" y="310" font-size="15" font-weight="bold" fill="black">인스턴스 p3 : Person</text>
  <line x1="430" y1="320" x2="760" y2="320" stroke="black" stroke-width="1"/>
  <text x="445" y="340" font-size="14" fill="black">name = "박민수"</text>
  <text x="445" y="360" font-size="14" fill="black">age = 17</text>

  <text x="400" y="405" text-anchor="middle" font-size="14" fill="black">하나의 클래스로 여러 개의 독립된 인스턴스를 만들 수 있다</text>
</svg>

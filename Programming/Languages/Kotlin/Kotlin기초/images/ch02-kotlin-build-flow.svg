<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <!-- 1. 소스 코드 박스 -->
  <rect x="30" y="130" width="170" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="115" y="155" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">소스 코드</text>
  <text x="115" y="178" font-size="13" text-anchor="middle" font-family="monospace">Main.kt</text>
  <text x="115" y="200" font-size="12" text-anchor="middle" font-family="monospace">fun main() {</text>
  <text x="115" y="218" font-size="12" text-anchor="middle" font-family="monospace">  println(...)</text>

  <!-- 화살표 1 -->
  <line x1="200" y1="185" x2="270" y2="185" stroke="#000000" stroke-width="2"/>
  <polygon points="270,185 258,179 258,191" fill="#000000"/>
  <text x="235" y="170" font-size="12" text-anchor="middle" font-family="sans-serif">컴파일</text>
  <text x="235" y="205" font-size="11" text-anchor="middle" font-family="monospace" fill="#333333">(kotlinc)</text>

  <!-- 2. 컴파일러 박스 -->
  <rect x="280" y="130" width="170" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="365" y="155" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Kotlin 컴파일러</text>
  <text x="365" y="178" font-size="13" text-anchor="middle" font-family="monospace">kotlinc</text>
  <text x="365" y="200" font-size="12" text-anchor="middle" font-family="sans-serif">문법 검사</text>
  <text x="365" y="218" font-size="12" text-anchor="middle" font-family="sans-serif">타입 추론 · 최적화</text>

  <!-- 화살표 2 -->
  <line x1="450" y1="185" x2="520" y2="185" stroke="#000000" stroke-width="2"/>
  <polygon points="520,185 508,179 508,191" fill="#000000"/>
  <text x="485" y="170" font-size="12" text-anchor="middle" font-family="sans-serif">생성</text>

  <!-- 3. 바이트코드 박스 -->
  <rect x="530" y="130" width="170" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="615" y="155" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">바이트코드</text>
  <text x="615" y="178" font-size="13" text-anchor="middle" font-family="monospace">MainKt.class</text>
  <text x="615" y="200" font-size="12" text-anchor="middle" font-family="sans-serif">JVM이 이해하는</text>
  <text x="615" y="218" font-size="12" text-anchor="middle" font-family="sans-serif">중간 표현 형식</text>

  <!-- 화살표 3 -->
  <line x1="700" y1="185" x2="770" y2="185" stroke="#000000" stroke-width="2"/>
  <polygon points="770,185 758,179 758,191" fill="#000000"/>
  <text x="735" y="170" font-size="12" text-anchor="middle" font-family="sans-serif">실행</text>

  <!-- 4. JVM 박스 -->
  <rect x="780" y="110" width="105" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="832" y="140" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">JVM</text>
  <text x="832" y="165" font-size="11" text-anchor="middle" font-family="sans-serif">Java Virtual</text>
  <text x="832" y="180" font-size="11" text-anchor="middle" font-family="sans-serif">Machine</text>
  <line x1="795" y1="195" x2="870" y2="195" stroke="#000000" stroke-width="1"/>
  <text x="832" y="215" font-size="11" text-anchor="middle" font-family="sans-serif">프로그램</text>
  <text x="832" y="230" font-size="11" text-anchor="middle" font-family="sans-serif">실행</text>

  <!-- 하단 설명 -->
  <text x="450" y="300" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#333333">
    Kotlin 소스 코드는 컴파일러를 거쳐 Java와 동일한 형식의 바이트코드로 변환되고,
  </text>
  <text x="450" y="322" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#333333">
    이 바이트코드를 JVM이 해석하여 실제 프로그램을 실행합니다.
  </text>
  <text x="450" y="350" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#555555">
    (Java 소스 코드도 javac 컴파일러를 통해 같은 형식의 바이트코드로 변환되어, 동일한 JVM에서 함께 실행될 수 있습니다.)
  </text>
</svg>

<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Segoe UI', sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="320" fill="white"/>

  <!-- 제목 -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="black">변수 이름 · 메모리 주소 · 값의 관계</text>

  <!-- age 변수 -->
  <text x="150" y="70" text-anchor="middle" font-size="14" fill="black">age (int, 4바이트)</text>
  <line x1="150" y1="78" x2="150" y2="105" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="105" width="120" height="70" fill="white" stroke="black" stroke-width="2"/>
  <line x1="120" y1="105" x2="120" y2="175" stroke="black" stroke-width="1"/>
  <line x1="150" y1="105" x2="150" y2="175" stroke="black" stroke-width="1"/>
  <line x1="180" y1="105" x2="180" y2="175" stroke="black" stroke-width="1"/>
  <text x="150" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="black">25</text>
  <text x="150" y="195" text-anchor="middle" font-size="12" fill="black">주소: 0x1000</text>

  <!-- height 변수 -->
  <text x="360" y="70" text-anchor="middle" font-size="14" fill="black">height (float, 4바이트)</text>
  <line x1="360" y1="78" x2="360" y2="105" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="105" width="120" height="70" fill="white" stroke="black" stroke-width="2"/>
  <line x1="330" y1="105" x2="330" y2="175" stroke="black" stroke-width="1"/>
  <line x1="360" y1="105" x2="360" y2="175" stroke="black" stroke-width="1"/>
  <line x1="390" y1="105" x2="390" y2="175" stroke="black" stroke-width="1"/>
  <text x="360" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="black">175.5</text>
  <text x="360" y="195" text-anchor="middle" font-size="12" fill="black">주소: 0x1004</text>

  <!-- grade 변수 -->
  <text x="570" y="70" text-anchor="middle" font-size="14" fill="black">grade (char, 1바이트)</text>
  <line x1="570" y1="78" x2="570" y2="105" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="105" width="60" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="570" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="black">'A'</text>
  <text x="570" y="195" text-anchor="middle" font-size="12" fill="black">주소: 0x1008</text>

  <!-- 메모리 주소 증가 방향 화살표 -->
  <line x1="70" y1="230" x2="630" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="250" text-anchor="middle" font-size="13" fill="black">메모리 주소가 증가하는 방향</text>

  <!-- 설명 텍스트 -->
  <text x="350" y="285" text-anchor="middle" font-size="12" fill="black">변수 이름은 프로그래머가 값에 붙인 별명이고, 실제로 컴파일러는 정해진 메모리 주소를 통해 값을 찾아간다.</text>
  <text x="350" y="303" text-anchor="middle" font-size="12" fill="black">각 자료형은 저장에 필요한 바이트 수(칸의 개수)가 다르며, 실제 주소 값은 프로그램을 실행할 때마다 달라질 수 있다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
</svg>

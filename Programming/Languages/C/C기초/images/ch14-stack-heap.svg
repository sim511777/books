<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="460" fill="white"/>

  <!-- 제목 -->
  <text x="380" y="28" font-size="16" text-anchor="middle" fill="black" font-weight="bold">스택(Stack)과 힙(Heap) 메모리 영역 비교</text>

  <!-- 전체 메모리 구조 박스 -->
  <g stroke="black" stroke-width="2" fill="none">
    <rect x="260" y="60" width="240" height="360"/>
  </g>
  <text x="380" y="50" font-size="13" text-anchor="middle" fill="black">프로세스의 주소 공간 (개념도)</text>

  <!-- 코드/전역 영역 -->
  <rect x="260" y="60" width="240" height="40" fill="#f2f2f2" stroke="black" stroke-width="1"/>
  <text x="380" y="85" font-size="12" text-anchor="middle" fill="black">코드 / 전역 변수 영역</text>

  <!-- 힙 영역 -->
  <rect x="260" y="100" width="240" height="130" fill="none" stroke="black" stroke-width="1"/>
  <text x="380" y="120" font-size="13" text-anchor="middle" fill="black" font-weight="bold">힙 (Heap)</text>
  <text x="380" y="140" font-size="12" text-anchor="middle" fill="black">malloc / calloc / realloc 으로 확보</text>
  <text x="380" y="158" font-size="12" text-anchor="middle" fill="black">낮은 주소 → 높은 주소로 증가</text>
  <g stroke="black" stroke-width="1">
    <line x1="330" y1="175" x2="330" y2="215"/>
    <line x1="325" y1="215" x2="335" y2="215"/>
    <line x1="325" y1="175" x2="335" y2="175"/>
  </g>
  <text x="345" y="200" font-size="12" fill="black">증가 방향 ↓</text>

  <!-- 빈 공간(화살표 방향 표시) -->
  <line x1="260" y1="230" x2="500" y2="230" stroke="black" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="380" y="248" font-size="11" text-anchor="middle" fill="#888">(사용되지 않은 여유 공간)</text>

  <!-- 스택 영역 -->
  <rect x="260" y="260" width="240" height="160" fill="none" stroke="black" stroke-width="1"/>
  <text x="380" y="280" font-size="13" text-anchor="middle" fill="black" font-weight="bold">스택 (Stack)</text>
  <text x="380" y="300" font-size="12" text-anchor="middle" fill="black">함수 호출 시 지역 변수, 매개변수 저장</text>
  <text x="380" y="318" font-size="12" text-anchor="middle" fill="black">높은 주소 → 낮은 주소로 증가</text>
  <g stroke="black" stroke-width="1">
    <line x1="330" y1="335" x2="330" y2="375"/>
    <line x1="325" y1="335" x2="335" y2="335"/>
    <line x1="325" y1="375" x2="335" y2="375"/>
  </g>
  <text x="345" y="360" font-size="12" fill="black">증가 방향 ↑</text>
  <text x="380" y="400" font-size="12" text-anchor="middle" fill="black">함수가 끝나면 자동으로 해제됨</text>

  <!-- 왼쪽 설명: 스택 특징 -->
  <text x="20"  y="300" font-size="13" fill="black" font-weight="bold">스택 특징</text>
  <text x="20"  y="320" font-size="12" fill="black">- 크기가 작고 빠름</text>
  <text x="20"  y="338" font-size="12" fill="black">- 함수 반환 시</text>
  <text x="20"  y="354" font-size="12" fill="black">  자동으로 정리됨</text>
  <text x="20"  y="372" font-size="12" fill="black">- 크기를 프로그램</text>
  <text x="20"  y="388" font-size="12" fill="black">  실행 중 늘릴 수 없음</text>

  <!-- 오른쪽 설명: 힙 특징 -->
  <text x="530" y="120" font-size="13" fill="black" font-weight="bold">힙 특징</text>
  <text x="530" y="140" font-size="12" fill="black">- 크기가 크고 유연함</text>
  <text x="530" y="158" font-size="12" fill="black">- 프로그래머가 직접</text>
  <text x="530" y="174" font-size="12" fill="black">  free()로 해제해야 함</text>
  <text x="530" y="192" font-size="12" fill="black">- 해제를 잊으면</text>
  <text x="530" y="208" font-size="12" fill="black">  메모리 누수 발생</text>

  <!-- 하단 설명 -->
  <text x="380" y="445" font-size="12" text-anchor="middle" fill="black">지역 변수는 스택에, malloc으로 얻은 메모리는 힙에 저장되며 생명주기 관리 방식이 서로 다릅니다.</text>
</svg>

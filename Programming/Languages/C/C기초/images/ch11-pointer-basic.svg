<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="720" height="380" fill="white"/>

  <!-- 제목 -->
  <text x="360" y="30" font-size="18" text-anchor="middle" fill="black" font-weight="bold">변수, 포인터, 메모리 주소의 관계</text>

  <!-- 메모리 전체를 표현하는 큰 틀 -->
  <rect x="40" y="60" width="640" height="280" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="80" font-size="13" fill="black">메모리(RAM)</text>

  <!-- num 변수 박스 -->
  <rect x="100" y="140" width="140" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="170" y="165" font-size="14" text-anchor="middle" fill="black">num</text>
  <text x="170" y="190" font-size="20" text-anchor="middle" fill="black" font-weight="bold">42</text>
  <text x="170" y="230" font-size="13" text-anchor="middle" fill="black">주소: 0x1000</text>

  <!-- p 포인터 박스 -->
  <rect x="440" y="140" width="160" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="520" y="165" font-size="14" text-anchor="middle" fill="black">p (int *)</text>
  <text x="520" y="190" font-size="16" text-anchor="middle" fill="black" font-weight="bold">0x1000</text>
  <text x="520" y="230" font-size="13" text-anchor="middle" fill="black">주소: 0x2000</text>

  <!-- 화살표: p가 num을 가리킴 -->
  <path d="M 500 140 C 480 90, 260 90, 190 140" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="90" font-size="13" text-anchor="middle" fill="black">p가 num의 주소를 저장 → num을 가리킨다</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <!-- 설명 텍스트 -->
  <text x="170" y="260" font-size="12" text-anchor="middle" fill="black">&amp;num == 0x1000</text>
  <text x="520" y="260" font-size="12" text-anchor="middle" fill="black">*p == 42  (역참조)</text>

  <!-- 하단 설명 -->
  <text x="360" y="310" font-size="13" text-anchor="middle" fill="black">int num = 42;      int *p = &amp;num;</text>
  <text x="360" y="332" font-size="12" text-anchor="middle" fill="black">p 자신도 메모리에 저장되는 하나의 변수이며, 그 값은 다른 변수의 주소이다.</text>
</svg>

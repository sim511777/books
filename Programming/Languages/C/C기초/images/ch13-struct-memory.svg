<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="780" height="420" fill="white"/>

  <!-- 제목 -->
  <text x="390" y="28" font-size="16" text-anchor="middle" fill="black" font-weight="bold">struct point { char label; int x; double y; }; 의 메모리 배치</text>

  <!-- 구조체 정의 코드 -->
  <text x="60" y="58" font-size="13" fill="black" font-family="Consolas, monospace">struct point {</text>
  <text x="60" y="76" font-size="13" fill="black" font-family="Consolas, monospace">    char label;   /* 1바이트 */</text>
  <text x="60" y="94" font-size="13" fill="black" font-family="Consolas, monospace">    int x;        /* 4바이트 */</text>
  <text x="60" y="112" font-size="13" fill="black" font-family="Consolas, monospace">    double y;     /* 8바이트 */</text>
  <text x="60" y="130" font-size="13" fill="black" font-family="Consolas, monospace">};</text>

  <!-- 멤버 라벨 -->
  <text x="90"  y="160" font-size="13" text-anchor="middle" fill="black">label</text>
  <text x="150" y="160" font-size="12" text-anchor="middle" fill="#888">(패딩)</text>
  <text x="260" y="160" font-size="13" text-anchor="middle" fill="black">x</text>
  <text x="480" y="160" font-size="13" text-anchor="middle" fill="black">y</text>

  <!-- 박스: 전체 메모리 블록 -->
  <g stroke="black" stroke-width="2" fill="none">
    <rect x="40"  y="170" width="60"  height="60"/>
    <rect x="100" y="170" width="120" height="60" stroke-dasharray="4,3"/>
    <rect x="220" y="170" width="120" height="60"/>
    <rect x="340" y="170" width="240" height="60"/>
  </g>

  <!-- 바이트 크기 표시 -->
  <text x="70"  y="207" font-size="12" text-anchor="middle" fill="black">1B</text>
  <text x="160" y="207" font-size="12" text-anchor="middle" fill="#888">3B</text>
  <text x="280" y="207" font-size="12" text-anchor="middle" fill="black">4B</text>
  <text x="460" y="207" font-size="12" text-anchor="middle" fill="black">8B</text>

  <!-- 오프셋 -->
  <text x="40"  y="252" font-size="12" text-anchor="middle" fill="black">offset 0</text>
  <text x="220" y="252" font-size="12" text-anchor="middle" fill="black">offset 4</text>
  <text x="340" y="252" font-size="12" text-anchor="middle" fill="black">offset 8</text>
  <text x="580" y="252" font-size="12" text-anchor="middle" fill="black">offset 16</text>

  <!-- sizeof 화살표 -->
  <g stroke="black" stroke-width="1">
    <line x1="40" y1="270" x2="580" y2="270"/>
    <line x1="40" y1="265" x2="40" y2="275"/>
    <line x1="580" y1="265" x2="580" y2="275"/>
  </g>
  <text x="310" y="290" font-size="13" text-anchor="middle" fill="black">sizeof(struct point) == 16 (정렬을 위한 패딩 포함)</text>

  <!-- 설명 -->
  <text x="390" y="330" font-size="13" text-anchor="middle" fill="black">각 멤버는 자신의 정렬(alignment) 요구 조건에 맞춰 배치되며,</text>
  <text x="390" y="350" font-size="13" text-anchor="middle" fill="black">중간에 빈 공간(패딩)이 생길 수 있습니다. 멤버 선언 순서에 따라 전체 크기가 달라질 수 있습니다.</text>
  <text x="390" y="380" font-size="13" text-anchor="middle" fill="black">p.x 로 멤버에 접근하면 컴파일러가 내부적으로 (p의 주소 + offset)를 계산해 값을 읽고 씁니다.</text>
</svg>

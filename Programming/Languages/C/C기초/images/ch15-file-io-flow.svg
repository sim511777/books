<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="260" fill="white"/>

  <!-- 1. 파일 열기 -->
  <rect x="20" y="90" width="140" height="80" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="90" y="120" text-anchor="middle" font-size="16" fill="black">fopen()</text>
  <text x="90" y="142" text-anchor="middle" font-size="13" fill="black">파일 열기</text>
  <text x="90" y="160" text-anchor="middle" font-size="11" fill="black">FILE* 획득</text>

  <!-- 화살표 1 -->
  <line x1="160" y1="130" x2="220" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. NULL 체크 -->
  <polygon points="220,90 300,130 220,170 140,130" fill="none" stroke="black" stroke-width="2" transform="translate(60,0)"/>
  <text x="340" y="126" text-anchor="middle" font-size="13" fill="black">fp == NULL?</text>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="black">오류 확인</text>

  <!-- 실패 경로 -->
  <line x1="340" y1="90" x2="340" y2="30" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="20" font-size="12" fill="black">예 (실패)</text>
  <rect x="260" y="0" width="160" height="0" fill="none"/>
  <text x="410" y="35" font-size="11" fill="black">perror 후 종료</text>

  <!-- 정상 경로 화살표 -->
  <line x1="420" y1="130" x2="480" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="120" font-size="11" fill="black">아니오</text>

  <!-- 3. 읽기/쓰기 반복 -->
  <rect x="480" y="90" width="150" height="80" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="555" y="118" text-anchor="middle" font-size="14" fill="black">fread/fwrite</text>
  <text x="555" y="136" text-anchor="middle" font-size="14" fill="black">fgets/fputs</text>
  <text x="555" y="154" text-anchor="middle" font-size="14" fill="black">fscanf/fprintf</text>

  <!-- 반복 화살표 (자기 자신으로) -->
  <path d="M 500 90 C 500 60, 610 60, 610 90" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="55" text-anchor="middle" font-size="11" fill="black">EOF까지 반복</text>

  <!-- 화살표 2 -->
  <line x1="630" y1="130" x2="690" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. 파일 닫기 -->
  <rect x="690" y="90" width="140" height="80" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <text x="760" y="120" text-anchor="middle" font-size="16" fill="black">fclose()</text>
  <text x="760" y="142" text-anchor="middle" font-size="13" fill="black">파일 닫기</text>
  <text x="760" y="160" text-anchor="middle" font-size="11" fill="black">버퍼 비움</text>

  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <!-- 하단 설명 -->
  <text x="450" y="220" text-anchor="middle" font-size="12" fill="black">파일 입출력의 기본 흐름: 열기 -&gt; 오류 확인 -&gt; 읽기/쓰기 반복 -&gt; 닫기</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="black">fclose를 호출해야 버퍼에 남은 데이터가 실제로 디스크에 기록됩니다.</text>
</svg>

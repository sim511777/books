<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="560" fill="white"/>

  <!-- 제목 -->
  <text x="380" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="black">factorial(3) 호출 시 함수 호출 스택의 변화</text>

  <!-- 왼쪽: 호출이 쌓이는 과정 -->
  <text x="150" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="black">① 호출 단계 (스택이 쌓임)</text>

  <!-- 스택 프레임 4개: factorial(3), (2), (1), (0) -->
  <!-- factorial(3) - 맨 아래 -->
  <rect x="40" y="380" width="220" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="150" y="402" font-size="13" text-anchor="middle" fill="black">factorial(3) 프레임</text>
  <text x="150" y="420" font-size="12" text-anchor="middle" fill="black">n = 3</text>

  <!-- factorial(2) -->
  <rect x="40" y="310" width="220" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="150" y="332" font-size="13" text-anchor="middle" fill="black">factorial(2) 프레임</text>
  <text x="150" y="350" font-size="12" text-anchor="middle" fill="black">n = 2</text>

  <!-- factorial(1) -->
  <rect x="40" y="240" width="220" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="150" y="262" font-size="13" text-anchor="middle" fill="black">factorial(1) 프레임</text>
  <text x="150" y="280" font-size="12" text-anchor="middle" fill="black">n = 1</text>

  <!-- factorial(0) - 맨 위, 기저 조건 -->
  <rect x="40" y="170" width="220" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="150" y="192" font-size="13" text-anchor="middle" fill="black">factorial(0) 프레임</text>
  <text x="150" y="210" font-size="12" text-anchor="middle" fill="black">n = 0  (기저 조건, return 1)</text>

  <!-- 호출 화살표 (아래에서 위로 쌓임을 표시) -->
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L10,0 L5,9 Z" fill="black"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="0" orient="auto">
      <path d="M0,9 L10,9 L5,0 Z" fill="black"/>
    </marker>
  </defs>

  <text x="285" y="405" font-size="20" fill="black">→</text>
  <text x="285" y="335" font-size="20" fill="black">→</text>
  <text x="285" y="265" font-size="20" fill="black">→</text>

  <text x="150" y="150" font-size="12" text-anchor="middle" fill="black">호출할 때마다 새 프레임이</text>
  <text x="150" y="165" font-size="12" text-anchor="middle" fill="black">위로 쌓입니다 (스택 push)</text>
  <line x1="150" y1="170" x2="150" y2="440" stroke="black" stroke-width="1" stroke-dasharray="3,3" marker-start="url(#arrowDown)" transform="translate(-95,0)"/>

  <!-- 오른쪽: 반환 단계 -->
  <text x="600" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="black">② 반환 단계 (스택이 줄어듦)</text>

  <rect x="490" y="380" width="220" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="600" y="402" font-size="13" text-anchor="middle" fill="black">factorial(3)</text>
  <text x="600" y="420" font-size="12" text-anchor="middle" fill="black">return 3 * factorial(2) = 6</text>

  <rect x="490" y="310" width="220" height="60" fill="white" stroke="black" stroke-width="1.5" opacity="0.6"/>
  <text x="600" y="332" font-size="13" text-anchor="middle" fill="black">factorial(2)</text>
  <text x="600" y="350" font-size="12" text-anchor="middle" fill="black">return 2 * factorial(1) = 2</text>

  <rect x="490" y="240" width="220" height="60" fill="white" stroke="black" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="262" font-size="13" text-anchor="middle" fill="black">factorial(1)</text>
  <text x="600" y="280" font-size="12" text-anchor="middle" fill="black">return 1 * factorial(0) = 1</text>

  <rect x="490" y="170" width="220" height="60" fill="white" stroke="black" stroke-width="1" opacity="0.25"/>
  <text x="600" y="192" font-size="13" text-anchor="middle" fill="black">factorial(0)</text>
  <text x="600" y="210" font-size="12" text-anchor="middle" fill="black">return 1  (완료, 프레임 제거)</text>

  <text x="600" y="150" font-size="12" text-anchor="middle" fill="black">값을 반환하며 프레임이</text>
  <text x="600" y="165" font-size="12" text-anchor="middle" fill="black">아래에서부터 제거됩니다 (스택 pop)</text>

  <!-- 반환 흐름 화살표 (위에서 아래로) -->
  <line x1="605" y1="230" x2="605" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <line x1="605" y1="300" x2="605" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <line x1="605" y1="370" x2="605" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- 하단 설명 -->
  <rect x="40" y="470" width="670" height="70" fill="white" stroke="black" stroke-width="1"/>
  <text x="375" y="492" font-size="13" text-anchor="middle" fill="black">각 함수 호출은 자신만의 지역변수(n 등)를 담은 독립된 스택 프레임을 가집니다.</text>
  <text x="375" y="512" font-size="13" text-anchor="middle" fill="black">재귀 호출이 깊어질수록 프레임이 계속 쌓이며, 기저 조건(n == 0)에 도달하면</text>
  <text x="375" y="532" font-size="13" text-anchor="middle" fill="black">더 이상 호출하지 않고 값을 반환하면서 프레임이 순서대로 제거됩니다.</text>
</svg>

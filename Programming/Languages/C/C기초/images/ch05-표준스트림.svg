<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="white"/>

  <!-- 프로그램 박스 -->
  <rect x="250" y="110" width="140" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" font-size="18" fill="black">프로그램</text>

  <!-- stdin: 키보드 -> 프로그램 -->
  <rect x="30" y="30" width="120" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="90" y="60" text-anchor="middle" font-size="14" fill="black">키보드</text>
  <line x1="150" y1="55" x2="250" y2="130" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="85" font-size="13" fill="black">stdin (0)</text>

  <!-- stdout: 프로그램 -> 화면 -->
  <rect x="490" y="30" width="120" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="black">화면(콘솔)</text>
  <line x1="390" y1="130" x2="490" y2="55" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="85" font-size="13" fill="black">stdout (1)</text>

  <!-- stderr: 프로그램 -> 화면(에러) -->
  <rect x="490" y="220" width="120" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="550" y="250" text-anchor="middle" font-size="14" fill="black">화면(에러)</text>
  <line x1="390" y1="170" x2="490" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="225" font-size="13" fill="black">stderr (2)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
</svg>

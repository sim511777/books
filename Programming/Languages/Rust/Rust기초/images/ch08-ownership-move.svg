<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="380" y="30" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">let s2 = s1; 실행 시 소유권 이동</text>

  <!-- 단계 1 라벨 -->
  <text x="190" y="60" font-size="14" fill="#000000" text-anchor="middle">이동 전</text>
  <text x="570" y="60" font-size="14" fill="#000000" text-anchor="middle">이동 후 (s1 = s2)</text>

  <!-- ===== 왼쪽: 이동 전 ===== -->
  <!-- s1 변수 박스 -->
  <rect x="60" y="90" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="105" y="115" font-size="15" fill="#000000" text-anchor="middle">s1</text>

  <!-- 화살표: s1 -> 힙 데이터 -->
  <line x1="150" y1="110" x2="230" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 힙 데이터 박스 (스택 메타데이터) -->
  <rect x="230" y="70" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="305" y="90" font-size="12" fill="#000000" text-anchor="middle">(스택) 메타데이터</text>
  <line x1="230" y1="98" x2="380" y2="98" stroke="#000000" stroke-width="1"/>
  <text x="240" y="115" font-size="12" fill="#000000">ptr</text>
  <text x="240" y="132" font-size="12" fill="#000000">len: 5</text>
  <text x="240" y="149" font-size="12" fill="#000000">cap: 5</text>

  <!-- 힙 데이터 실제 문자열 -->
  <line x1="270" y1="115" x2="270" y2="200" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="230" y="200" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="305" y="225" font-size="13" fill="#000000" text-anchor="middle">"hello" (힙)</text>

  <!-- ===== 오른쪽: 이동 후 ===== -->
  <!-- s1 변수 박스 (무효화됨) -->
  <rect x="440" y="90" width="90" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="485" y="115" font-size="15" fill="#888888" text-anchor="middle">s1</text>
  <text x="485" y="145" font-size="11" fill="#888888" text-anchor="middle">(더 이상 유효하지 않음)</text>

  <!-- X 표시: s1의 연결이 끊어짐 -->
  <line x1="530" y1="100" x2="560" y2="120" stroke="#000000" stroke-width="2"/>
  <line x1="560" y1="100" x2="530" y2="120" stroke="#000000" stroke-width="2"/>

  <!-- s2 변수 박스 -->
  <rect x="440" y="180" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="485" y="205" font-size="15" fill="#000000" text-anchor="middle">s2</text>

  <!-- 화살표: s2 -> 힙 데이터 -->
  <line x1="530" y1="200" x2="600" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="200" x2="565" y2="150" stroke="#000000" stroke-width="2"/>
  <line x1="565" y1="150" x2="600" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 힙 데이터 박스 (동일한 데이터, 소유자만 바뀜) -->
  <rect x="600" y="130" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="675" y="150" font-size="12" fill="#000000" text-anchor="middle">(스택) 메타데이터</text>
  <line x1="600" y1="158" x2="750" y2="158" stroke="#000000" stroke-width="1"/>
  <text x="610" y="175" font-size="12" fill="#000000">ptr</text>
  <text x="610" y="192" font-size="12" fill="#000000">len: 5</text>
  <text x="610" y="209" font-size="12" fill="#000000">cap: 5</text>

  <line x1="640" y1="175" x2="640" y2="260" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="600" y="260" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="675" y="285" font-size="13" fill="#000000" text-anchor="middle">"hello" (힙)</text>

  <!-- 하단 설명 -->
  <text x="380" y="350" font-size="13" fill="#000000" text-anchor="middle">힙 데이터는 복사되지 않고 그대로 유지되며, 소유권만 s1에서 s2로 이동한다.</text>
  <text x="380" y="370" font-size="13" fill="#000000" text-anchor="middle">이동 후 s1을 사용하려 하면 컴파일 오류가 발생한다.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">Rust 소스 코드에서 실행까지</text>

  <!-- Step 1: source file -->
  <rect x="30" y="90" width="150" height="80" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="105" y="120" font-size="14" text-anchor="middle" fill="#000000">main.rs</text>
  <text x="105" y="140" font-size="12" text-anchor="middle" fill="#000000">(소스 코드)</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="130" x2="250" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="115" font-size="11" text-anchor="middle" fill="#000000">rustc</text>

  <!-- Step 2: compiler -->
  <rect x="250" y="90" width="150" height="80" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="325" y="120" font-size="14" text-anchor="middle" fill="#000000">rustc</text>
  <text x="325" y="140" font-size="12" text-anchor="middle" fill="#000000">(컴파일러)</text>
  <text x="325" y="158" font-size="11" text-anchor="middle" fill="#000000">문법·타입·소유권 검사</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="130" x2="470" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: binary -->
  <rect x="470" y="90" width="150" height="80" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="545" y="120" font-size="14" text-anchor="middle" fill="#000000">실행 파일</text>
  <text x="545" y="140" font-size="12" text-anchor="middle" fill="#000000">(예: main.exe)</text>
  <text x="545" y="158" font-size="11" text-anchor="middle" fill="#000000">기계어 바이너리</text>

  <!-- Arrow 3 -->
  <line x1="620" y1="130" x2="690" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: execution -->
  <rect x="690" y="90" width="150" height="80" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="765" y="120" font-size="14" text-anchor="middle" fill="#000000">실행</text>
  <text x="765" y="140" font-size="12" text-anchor="middle" fill="#000000">(프로그램 동작)</text>
  <text x="765" y="158" font-size="11" text-anchor="middle" fill="#000000">터미널에 결과 출력</text>

  <!-- cargo build brace -->
  <path d="M 30 200 L 30 230 L 620 230 L 620 200" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="325" y="250" font-size="13" text-anchor="middle" fill="#000000">cargo build → 소스를 컴파일해서 실행 파일만 생성</text>

  <!-- cargo run brace -->
  <path d="M 30 280 L 30 310 L 840 310 L 840 280" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="435" y="330" font-size="13" text-anchor="middle" fill="#000000">cargo run → 컴파일 후 곧바로 실행 파일까지 실행</text>

  <!-- Note -->
  <text x="450" y="365" font-size="11" text-anchor="middle" fill="#000000">Cargo.toml에 정의된 설정과 의존성 정보를 바탕으로 cargo가 rustc를 호출한다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

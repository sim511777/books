<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">C# 소스 코드가 실행되기까지</text>

  <!-- Step 1: Source code -->
  <rect x="30" y="80" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="105" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">소스 코드</text>
  <text x="105" y="130" text-anchor="middle" font-size="12" fill="#000000">Program.cs</text>
  <text x="105" y="150" text-anchor="middle" font-size="11" fill="#333333">사람이 작성한</text>
  <text x="105" y="165" text-anchor="middle" font-size="11" fill="#333333">C# 텍스트</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="125" x2="240" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="115" text-anchor="middle" font-size="11" fill="#000000">컴파일</text>

  <!-- Step 2: Compiler -->
  <rect x="240" y="80" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="315" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">C# 컴파일러</text>
  <text x="315" y="130" text-anchor="middle" font-size="12" fill="#000000">(Roslyn)</text>
  <text x="315" y="150" text-anchor="middle" font-size="11" fill="#333333">문법 검사 후</text>
  <text x="315" y="165" text-anchor="middle" font-size="11" fill="#333333">IL로 번역</text>

  <!-- Arrow 2 -->
  <line x1="390" y1="125" x2="450" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="420" y="115" text-anchor="middle" font-size="11" fill="#000000">생성</text>

  <!-- Step 3: IL / Assembly -->
  <rect x="450" y="80" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="525" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">IL 코드</text>
  <text x="525" y="123" text-anchor="middle" font-size="12" fill="#000000">(중간 언어)</text>
  <text x="525" y="143" text-anchor="middle" font-size="11" fill="#333333">.dll / .exe</text>
  <text x="525" y="158" text-anchor="middle" font-size="11" fill="#333333">어셈블리 파일</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="125" x2="660" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="630" y="115" text-anchor="middle" font-size="11" fill="#000000">실행 시점</text>

  <!-- Step 4: JIT -->
  <rect x="660" y="80" width="200" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="760" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">JIT 컴파일러</text>
  <text x="760" y="130" text-anchor="middle" font-size="12" fill="#000000">(.NET 런타임)</text>
  <text x="760" y="150" text-anchor="middle" font-size="11" fill="#333333">IL을 CPU가 이해하는</text>
  <text x="760" y="165" text-anchor="middle" font-size="11" fill="#333333">네이티브 코드로 변환</text>

  <!-- Arrow down from JIT to Execution -->
  <line x1="760" y1="170" x2="760" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Execution -->
  <rect x="660" y="230" width="200" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="760" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">네이티브 코드 실행</text>
  <text x="760" y="280" text-anchor="middle" font-size="12" fill="#000000">CPU</text>
  <text x="760" y="300" text-anchor="middle" font-size="11" fill="#333333">실제 결과 출력</text>

  <!-- dotnet run label bracket across the whole flow -->
  <line x1="30" y1="350" x2="860" y2="350" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="445" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">dotnet run 명령 한 번이면 이 과정 전체가 자동으로 이어집니다</text>

  <!-- Labels under dotnet build / dotnet run mapping -->
  <text x="315" y="200" text-anchor="middle" font-size="11" fill="#555555">dotnet build</text>
  <line x1="240" y1="192" x2="600" y2="192" stroke="#555555" stroke-width="1" stroke-dasharray="3,3" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>

<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">값 타입과 참조 타입의 메모리 저장 방식</text>

  <!-- 스택 영역 -->
  <rect x="30" y="60" width="380" height="470" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="220" y="88" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">스택 (Stack)</text>
  <text x="220" y="108" font-size="12" text-anchor="middle" fill="#000000">변수(지역 변수)가 직접 저장되는 공간</text>

  <!-- 값 타입 예시: int -->
  <rect x="55" y="130" width="330" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="65" y="150" font-size="13" fill="#000000">int number = 42;</text>
  <rect x="230" y="158" width="130" height="24" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="295" y="175" font-size="13" text-anchor="middle" fill="#000000">42</text>
  <text x="65" y="182" font-size="11" fill="#555555">변수 이름: number</text>

  <!-- 값 타입 복사 -->
  <rect x="55" y="200" width="330" height="90" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="65" y="220" font-size="13" fill="#000000">int number2 = number;  // 값 복사</text>
  <rect x="230" y="228" width="130" height="24" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="295" y="245" font-size="13" text-anchor="middle" fill="#000000">42</text>
  <text x="65" y="252" font-size="11" fill="#555555">변수 이름: number (원본)</text>
  <rect x="230" y="258" width="130" height="24" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="295" y="275" font-size="13" text-anchor="middle" fill="#000000">42</text>
  <text x="65" y="282" font-size="11" fill="#555555">변수 이름: number2 (독립된 복사본)</text>

  <!-- 참조 타입 예시 -->
  <rect x="55" y="310" width="330" height="150" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="65" y="330" font-size="13" fill="#000000">Person person1 = new Person();</text>
  <text x="65" y="348" font-size="13" fill="#000000">Person person2 = person1;  // 참조 복사</text>

  <rect x="230" y="360" width="130" height="24" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="295" y="377" font-size="12" text-anchor="middle" fill="#000000">주소 0xA1</text>
  <text x="65" y="382" font-size="11" fill="#555555">변수 이름: person1</text>

  <rect x="230" y="400" width="130" height="24" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="295" y="417" font-size="12" text-anchor="middle" fill="#000000">주소 0xA1</text>
  <text x="65" y="422" font-size="11" fill="#555555">변수 이름: person2 (같은 주소를 가리킴)</text>

  <text x="65" y="448" font-size="11" fill="#555555">→ person1과 person2는 힙의 같은 객체를 공유</text>

  <!-- 힙 영역 -->
  <rect x="470" y="60" width="400" height="470" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="670" y="88" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">힙 (Heap)</text>
  <text x="670" y="108" font-size="12" text-anchor="middle" fill="#000000">참조 타입 인스턴스(객체)가 저장되는 공간</text>

  <rect x="560" y="150" width="220" height="120" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="670" y="172" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Person 객체 (주소 0xA1)</text>
  <line x1="560" y1="182" x2="780" y2="182" stroke="#000000" stroke-width="1"/>
  <text x="575" y="202" font-size="12" fill="#000000">Name: "지민"</text>
  <text x="575" y="224" font-size="12" fill="#000000">Age: 28</text>
  <text x="575" y="246" font-size="12" fill="#555555">(필드 값들은 여기에 실제 저장)</text>

  <!-- 화살표: 스택 -> 힙 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
  <path d="M360,372 C 440,372 470,260 560,220" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M360,412 C 460,412 490,300 560,235" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 하단 설명 -->
  <rect x="470" y="330" width="400" height="200" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="490" y="355" font-size="13" font-weight="bold" fill="#000000">핵심 차이</text>
  <text x="490" y="380" font-size="12" fill="#000000">1. 값 타입: 변수에 값이 직접 저장됨</text>
  <text x="490" y="400" font-size="12" fill="#000000">   대입하면 값이 그대로 복사되어</text>
  <text x="490" y="418" font-size="12" fill="#000000">   두 변수는 서로 영향을 주지 않음</text>
  <text x="490" y="446" font-size="12" fill="#000000">2. 참조 타입: 변수에는 힙 객체의</text>
  <text x="490" y="464" font-size="12" fill="#000000">   주소(참조)만 저장됨. 대입하면</text>
  <text x="490" y="482" font-size="12" fill="#000000">   주소가 복사되어 두 변수가 같은</text>
  <text x="490" y="500" font-size="12" fill="#000000">   객체를 공유하게 됨</text>
</svg>

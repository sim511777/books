<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="900" height="700" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">동기 실행과 비동기 실행의 시간 흐름 비교</text>

  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1"/>
    </pattern>
    <marker id="tick" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M5,0 L5,10" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ===================== 시간 축 (공통) ===================== -->
  <!-- x=180 은 t=0초, 1초당 90px -->

  <!-- ===================== 섹션 1: 동기 실행 ===================== -->
  <text x="60" y="65" font-size="15" font-weight="bold" fill="#000000">1. 동기 실행 — 하나씩 순서대로 await (또는 Thread.Sleep)</text>

  <text x="40" y="140" font-size="12" fill="#000000">메인 스레드</text>

  <!-- A: 0~2초 -->
  <rect x="180" y="115" width="180" height="45" fill="#eeeeee" stroke="#000000" stroke-width="1.5"/>
  <text x="270" y="134" font-size="12" text-anchor="middle" fill="#000000">A 다운로드 대기</text>
  <text x="270" y="150" font-size="11" text-anchor="middle" fill="#555555">(2초, 스레드 블로킹)</text>

  <!-- B: 2~5초 -->
  <rect x="360" y="115" width="270" height="45" fill="#e0e0e0" stroke="#000000" stroke-width="1.5"/>
  <text x="495" y="134" font-size="12" text-anchor="middle" fill="#000000">B 다운로드 대기</text>
  <text x="495" y="150" font-size="11" text-anchor="middle" fill="#555555">(3초, 스레드 블로킹)</text>

  <!-- C: 5~6초 -->
  <rect x="630" y="115" width="90" height="45" fill="#cccccc" stroke="#000000" stroke-width="1.5"/>
  <text x="675" y="134" font-size="11" text-anchor="middle" fill="#000000">C 대기</text>
  <text x="675" y="150" font-size="10" text-anchor="middle" fill="#555555">(1초)</text>

  <text x="40" y="185" font-size="11" fill="#555555">→ 한 작업이 끝나야 다음 작업을 시작할 수 있음</text>

  <!-- 총 소요시간 브래킷 -->
  <line x1="180" y1="205" x2="720" y2="205" stroke="#000000" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="450" y="225" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">총 6초 소요 (2 + 3 + 1)</text>

  <!-- 구분선 -->
  <line x1="30" y1="255" x2="870" y2="255" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===================== 섹션 2: 비동기 실행 ===================== -->
  <text x="60" y="290" font-size="15" font-weight="bold" fill="#000000">2. 비동기 실행 — 동시에 시작하고 Task.WhenAll로 함께 대기</text>

  <!-- 메인 스레드 행 -->
  <text x="40" y="335" font-size="12" fill="#000000">메인 스레드</text>
  <rect x="180" y="315" width="270" height="40" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="315" y="332" font-size="11" text-anchor="middle" fill="#000000">블로킹 없이 대기 (다른 작업 처리 가능)</text>
  <text x="315" y="347" font-size="10" text-anchor="middle" fill="#555555">await Task.WhenAll(taskA, taskB, taskC)</text>

  <!-- Task A -->
  <text x="40" y="385" font-size="12" fill="#000000">Task A</text>
  <rect x="180" y="365" width="180" height="30" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text x="270" y="385" font-size="11" text-anchor="middle" fill="#000000">2초 후 완료</text>

  <!-- Task B -->
  <text x="40" y="425" font-size="12" fill="#000000">Task B</text>
  <rect x="180" y="405" width="270" height="30" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text x="315" y="425" font-size="11" text-anchor="middle" fill="#000000">3초 후 완료 (가장 오래 걸림)</text>

  <!-- Task C -->
  <text x="40" y="465" font-size="12" fill="#000000">Task C</text>
  <rect x="180" y="445" width="90" height="30" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text x="225" y="465" font-size="11" text-anchor="middle" fill="#000000">1초 후 완료</text>

  <text x="40" y="495" font-size="11" fill="#555555">→ 세 작업이 같은 시점에 시작되어 대기 시간이 겹쳐짐</text>

  <!-- 총 소요시간 브래킷 -->
  <line x1="180" y1="515" x2="450" y2="515" stroke="#000000" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="315" y="535" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">총 3초 소요 (가장 긴 작업 시간만큼만 대기)</text>

  <!-- 3초 시점 비교를 위한 세로 기준선 -->
  <line x1="450" y1="108" x2="450" y2="560" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="455" y="100" font-size="11" fill="#000000">3초 시점</text>

  <!-- 하단 비교 설명 -->
  <rect x="60" y="580" width="780" height="90" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="80" y="605" font-size="13" font-weight="bold" fill="#000000">같은 3초 시점에서 비교하면</text>
  <text x="80" y="628" font-size="12" fill="#000000">· 동기 실행: 아직 B 작업 대기 중 (전체 완료까지 3초 더 필요)</text>
  <text x="80" y="650" font-size="12" fill="#000000">· 비동기 실행: 세 작업 모두 이미 완료됨</text>

  <!-- 시간 축 눈금 (하단) -->
  <text x="180" y="690" font-size="10" text-anchor="middle" fill="#777777">0초</text>
  <text x="360" y="690" font-size="10" text-anchor="middle" fill="#777777">2초</text>
  <text x="450" y="690" font-size="10" text-anchor="middle" fill="#777777">3초</text>
  <text x="630" y="690" font-size="10" text-anchor="middle" fill="#777777">5초</text>
  <text x="720" y="690" font-size="10" text-anchor="middle" fill="#777777">6초</text>
</svg>

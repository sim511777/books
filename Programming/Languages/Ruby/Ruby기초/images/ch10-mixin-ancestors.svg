<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#000000">Dog 클래스의 메서드 조회 순서 (ancestors)</text>

  <!-- prepend module (searched first) -->
  <rect x="270" y="50" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="350" y="72" text-anchor="middle" font-size="14" fill="#000000">Loggable</text>
  <text x="350" y="90" text-anchor="middle" font-size="11" fill="#555555">(prepend)</text>

  <line x1="350" y1="100" x2="350" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dog class -->
  <rect x="270" y="125" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="147" text-anchor="middle" font-size="14" fill="#000000">Dog</text>
  <text x="350" y="165" text-anchor="middle" font-size="11" fill="#555555">(클래스 본문)</text>

  <line x1="350" y1="175" x2="350" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- included module 2 (last included = searched first among includes) -->
  <rect x="270" y="200" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="222" text-anchor="middle" font-size="14" fill="#000000">Comparable</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#555555">(include, 나중에 포함)</text>

  <line x1="350" y1="250" x2="350" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- included module 1 -->
  <rect x="270" y="275" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="297" text-anchor="middle" font-size="14" fill="#000000">Walkable</text>
  <text x="350" y="315" text-anchor="middle" font-size="11" fill="#555555">(include, 먼저 포함)</text>

  <line x1="350" y1="325" x2="350" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Object -->
  <rect x="270" y="350" width="160" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="375" text-anchor="middle" font-size="14" fill="#000000">Object ...</text>

  <!-- side note -->
  <rect x="480" y="90" width="180" height="220" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="570" y="112" text-anchor="middle" font-size="12" fill="#000000">탐색 순서 요약</text>
  <text x="495" y="140" font-size="11" fill="#333333">1. prepend한 모듈</text>
  <text x="495" y="160" font-size="11" fill="#333333">2. 클래스 자신</text>
  <text x="495" y="180" font-size="11" fill="#333333">3. include한 모듈</text>
  <text x="510" y="198" font-size="11" fill="#555555">(나중에 include한</text>
  <text x="510" y="214" font-size="11" fill="#555555">모듈이 먼저 탐색됨)</text>
  <text x="495" y="238" font-size="11" fill="#333333">4. 상위 클래스</text>
  <text x="495" y="258" font-size="11" fill="#333333">5. Object, Kernel,</text>
  <text x="510" y="274" font-size="11" fill="#333333">BasicObject</text>
  <text x="495" y="298" font-size="10" fill="#777777">Dog.ancestors 로 확인 가능</text>

  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#555555">위에서 아래로</text>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#555555">메서드를 찾다가</text>
  <text x="130" y="236" text-anchor="middle" font-size="11" fill="#555555">가장 먼저 발견된</text>
  <text x="130" y="254" text-anchor="middle" font-size="11" fill="#555555">것을 사용합니다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <!-- Box A: 조건 확인 -->
  <rect x="250" y="20" width="200" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" fill="#000000">반복 조건 확인</text>
  <text x="350" y="65" text-anchor="middle" font-size="11" fill="#555555">(while / each 등)</text>

  <!-- Box B: 블록 실행 -->
  <rect x="250" y="170" width="200" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="195" text-anchor="middle" font-size="14" fill="#000000">블록(body) 실행</text>
  <text x="350" y="215" text-anchor="middle" font-size="11" fill="#555555">한 번의 반복</text>

  <!-- Box C: 종료 후 -->
  <rect x="230" y="340" width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="365" text-anchor="middle" font-size="14" fill="#000000">반복 종료</text>
  <text x="350" y="385" text-anchor="middle" font-size="11" fill="#555555">반복문 다음 코드로 진행</text>

  <!-- A -> B : 참 -->
  <line x1="350" y1="80" x2="350" y2="167" stroke="#000000" stroke-width="2" marker-end="url(#arrow6)"/>
  <text x="368" y="128" text-anchor="middle" font-size="11" fill="#333333">참</text>

  <!-- A -> C : 거짓, side route on the right -->
  <polyline points="452,50 620,50 620,370 472,370" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="630" y="210" text-anchor="middle" font-size="11" fill="#333333" transform="rotate(90 630 210)">거짓 (조건 불만족)</text>

  <!-- B -> C : break -->
  <line x1="350" y1="230" x2="350" y2="337" stroke="#000000" stroke-width="2" marker-end="url(#arrow6)"/>
  <text x="385" y="290" text-anchor="middle" font-size="11" fill="#333333">break</text>
  <text x="385" y="305" text-anchor="middle" font-size="10" fill="#555555">즉시 반복 탈출</text>

  <!-- B -> A : next, left side route -->
  <polyline points="248,190 90,190 90,50 248,50" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="60" y="120" text-anchor="middle" font-size="11" fill="#333333" transform="rotate(-90 60 120)">next (나머지 건너뛰고 다음 반복)</text>

  <!-- B self loop : redo -->
  <polyline points="450,185 520,185 520,215 450,215" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="560" y="200" text-anchor="middle" font-size="11" fill="#333333">redo</text>
  <text x="560" y="214" text-anchor="middle" font-size="10" fill="#555555">같은 반복</text>
  <text x="560" y="227" text-anchor="middle" font-size="10" fill="#555555">다시 실행</text>

  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

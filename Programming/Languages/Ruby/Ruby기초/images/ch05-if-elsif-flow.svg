<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <!-- Condition boxes -->
  <rect x="10" y="30" width="150" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="85" y="55" text-anchor="middle" font-size="13" fill="#000000">score &gt;= 90 ?</text>
  <text x="85" y="75" text-anchor="middle" font-size="11" fill="#555555">(if 조건)</text>

  <rect x="195" y="30" width="150" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="270" y="55" text-anchor="middle" font-size="13" fill="#000000">score &gt;= 80 ?</text>
  <text x="270" y="75" text-anchor="middle" font-size="11" fill="#555555">(elsif 조건)</text>

  <rect x="380" y="30" width="150" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="455" y="55" text-anchor="middle" font-size="13" fill="#000000">score &gt;= 70 ?</text>
  <text x="455" y="75" text-anchor="middle" font-size="11" fill="#555555">(elsif 조건)</text>

  <rect x="560" y="30" width="130" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="625" y="55" text-anchor="middle" font-size="13" fill="#000000">else</text>
  <text x="625" y="75" text-anchor="middle" font-size="11" fill="#555555">(나머지 전부)</text>

  <!-- horizontal arrows: 거짓 -->
  <line x1="160" y1="60" x2="192" y2="60" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="176" y="50" text-anchor="middle" font-size="11" fill="#333333">거짓</text>

  <line x1="345" y1="60" x2="377" y2="60" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="361" y="50" text-anchor="middle" font-size="11" fill="#333333">거짓</text>

  <line x1="530" y1="60" x2="557" y2="60" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="543" y="50" text-anchor="middle" font-size="11" fill="#333333">거짓</text>

  <!-- Result boxes -->
  <rect x="10" y="200" width="150" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="85" y="232" text-anchor="middle" font-size="13" fill="#000000">'A' 등급 처리</text>

  <rect x="195" y="200" width="150" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="270" y="232" text-anchor="middle" font-size="13" fill="#000000">'B' 등급 처리</text>

  <rect x="380" y="200" width="150" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="455" y="232" text-anchor="middle" font-size="13" fill="#000000">'C' 등급 처리</text>

  <rect x="560" y="200" width="130" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="625" y="232" text-anchor="middle" font-size="13" fill="#000000">'F' 등급 처리</text>

  <!-- vertical arrows: 참 -->
  <line x1="85" y1="90" x2="85" y2="197" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="100" y="145" text-anchor="middle" font-size="11" fill="#333333">참</text>

  <line x1="270" y1="90" x2="270" y2="197" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="285" y="145" text-anchor="middle" font-size="11" fill="#333333">참</text>

  <line x1="455" y1="90" x2="455" y2="197" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="470" y="145" text-anchor="middle" font-size="11" fill="#333333">참</text>

  <line x1="625" y1="90" x2="625" y2="197" stroke="#000000" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- converge to final value box -->
  <rect x="230" y="330" width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="350" y="355" text-anchor="middle" font-size="13" fill="#000000">if 식 전체의 값</text>
  <text x="350" y="375" text-anchor="middle" font-size="11" fill="#555555">실행된 블록의 마지막 값</text>

  <line x1="85" y1="255" x2="260" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="270" y1="255" x2="310" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="455" y1="255" x2="400" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="625" y1="255" x2="450" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Step 1: 메서드 호출 -->
  <rect x="260" y="20" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" fill="#000000">person.name 호출</text>
  <text x="350" y="65" text-anchor="middle" font-size="11" fill="#555555">(정의되지 않은 메서드)</text>

  <line x1="350" y1="80" x2="350" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: 메서드 탐색 -->
  <rect x="230" y="110" width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="135" text-anchor="middle" font-size="14" fill="#000000">클래스 체인에서 메서드 탐색</text>
  <text x="350" y="155" text-anchor="middle" font-size="11" fill="#555555">DynamicRecord → Object → ...</text>

  <line x1="350" y1="170" x2="350" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="350,200 440,240 350,280 260,240" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" fill="#000000">메서드를</text>
  <text x="350" y="252" text-anchor="middle" font-size="13" fill="#000000">찾았는가?</text>

  <!-- Yes branch -->
  <line x1="440" y1="240" x2="560" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="230" text-anchor="middle" font-size="12" fill="#333333">예</text>
  <rect x="560" y="210" width="120" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-size="13" fill="#000000">해당 메서드</text>
  <text x="620" y="253" text-anchor="middle" font-size="13" fill="#000000">그대로 실행</text>

  <!-- No branch -->
  <line x1="350" y1="280" x2="350" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="298" font-size="12" fill="#333333">아니오</text>

  <!-- method_missing box -->
  <rect x="220" y="310" width="260" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="335" text-anchor="middle" font-size="14" fill="#000000">method_missing 호출</text>
  <text x="350" y="355" text-anchor="middle" font-size="11" fill="#555555">name = :name, args = []</text>

  <line x1="350" y1="370" x2="350" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final decision -->
  <rect x="150" y="400" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="240" y="422" text-anchor="middle" font-size="12" fill="#333333">처리 가능하면</text>
  <text x="240" y="440" text-anchor="middle" font-size="12" fill="#333333">instance_variable_get 등으로 응답</text>

  <rect x="370" y="400" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="422" text-anchor="middle" font-size="12" fill="#333333">처리 불가능하면</text>
  <text x="460" y="440" text-anchor="middle" font-size="12" fill="#333333">super 호출 → NoMethodError</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

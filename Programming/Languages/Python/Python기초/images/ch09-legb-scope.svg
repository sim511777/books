<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="white"/>

  <!-- 제목 -->
  <text x="400" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="black">LEGB 규칙 : 변수를 찾는 순서</text>

  <!-- Built-in 영역 (가장 바깥) -->
  <rect x="50" y="70" width="700" height="450" fill="none" stroke="black" stroke-width="2"/>
  <text x="70" y="100" font-size="18" font-weight="bold" fill="black">B — Built-in (내장 스코프)</text>
  <text x="70" y="122" font-size="13" fill="black">len, print, range 등 파이썬이 기본 제공하는 이름</text>

  <!-- Global 영역 -->
  <rect x="90" y="145" width="620" height="345" fill="none" stroke="black" stroke-width="2"/>
  <text x="110" y="175" font-size="18" font-weight="bold" fill="black">G — Global (전역 스코프)</text>
  <text x="110" y="197" font-size="13" fill="black">모듈(파일) 최상단에서 정의한 변수</text>

  <!-- Enclosing 영역 -->
  <rect x="130" y="220" width="540" height="240" fill="none" stroke="black" stroke-width="2"/>
  <text x="150" y="250" font-size="18" font-weight="bold" fill="black">E — Enclosing (감싸는 함수 스코프)</text>
  <text x="150" y="272" font-size="13" fill="black">함수 안에 정의된 함수(중첩 함수)를 감싸는 바깥 함수의 변수</text>

  <!-- Local 영역 (가장 안쪽) -->
  <rect x="200" y="300" width="400" height="130" fill="none" stroke="black" stroke-width="2"/>
  <text x="220" y="330" font-size="18" font-weight="bold" fill="black">L — Local (지역 스코프)</text>
  <text x="220" y="352" font-size="13" fill="black">현재 실행 중인 함수 안에서 정의한 변수</text>
  <text x="220" y="374" font-size="13" fill="black">가장 먼저 검색되는 영역</text>

  <!-- 검색 순서 화살표: 안에서 밖으로 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <line x1="400" y1="480" x2="400" y2="500" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="500" font-size="13" fill="black">L에서 못 찾으면 E로</text>

  <!-- 하단 설명 : 검색 순서 요약 -->
  <rect x="50" y="490" width="0" height="0" fill="none"/>
  <text x="400" y="530" font-size="16" text-anchor="middle" fill="black" font-weight="bold">검색 순서 : Local → Enclosing → Global → Built-in</text>
  <text x="400" y="550" font-size="13" text-anchor="middle" fill="black">이름을 찾을 때까지 안쪽에서 바깥쪽으로 차례로 검색하며, 끝까지 없으면 NameError 발생</text>
</svg>

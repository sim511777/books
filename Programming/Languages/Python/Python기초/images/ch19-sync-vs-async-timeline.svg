<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#000">동기 실행 (순차 처리)</text>

  <!-- 동기: 세 블록이 순서대로 이어짐 -->
  <rect x="80" y="45" width="150" height="35" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="155" y="67" font-size="13" text-anchor="middle" fill="#000">서버 A (1초)</text>

  <rect x="230" y="45" width="150" height="35" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="305" y="67" font-size="13" text-anchor="middle" fill="#000">서버 B (1초)</text>

  <rect x="380" y="45" width="150" height="35" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="455" y="67" font-size="13" text-anchor="middle" fill="#000">서버 C (1초)</text>

  <line x1="80" y1="95" x2="530" y2="95" stroke="#000" stroke-width="1"/>
  <text x="80" y="112" font-size="12" text-anchor="middle" fill="#000">0초</text>
  <text x="530" y="112" font-size="12" text-anchor="middle" fill="#000">3초</text>
  <text x="600" y="67" font-size="14" fill="#000">총 3.0초</text>

  <text x="20" y="170" font-size="16" font-weight="bold" fill="#000">비동기 실행 (asyncio.gather)</text>

  <!-- 비동기: 세 블록이 동시에 시작 -->
  <rect x="80" y="185" width="150" height="30" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="155" y="205" font-size="13" text-anchor="middle" fill="#000">서버 A (1초)</text>

  <rect x="80" y="220" width="150" height="30" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="155" y="240" font-size="13" text-anchor="middle" fill="#000">서버 B (1초)</text>

  <rect x="80" y="255" width="150" height="30" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="155" y="275" font-size="13" text-anchor="middle" fill="#000">서버 C (1초)</text>

  <line x1="80" y1="292" x2="230" y2="292" stroke="#000" stroke-width="1"/>
  <text x="80" y="292" font-size="0" fill="#000"></text>
  <text x="600" y="220" font-size="14" fill="#000">총 1.0초</text>

  <text x="80" y="298" font-size="11" text-anchor="middle" fill="#555">0초</text>
  <text x="230" y="298" font-size="11" text-anchor="middle" fill="#555">1초</text>
</svg>

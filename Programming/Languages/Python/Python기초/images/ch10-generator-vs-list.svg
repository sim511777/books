<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="white"/>

  <text x="410" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="black">리스트 컴프리헨션 vs 제너레이터</text>

  <!-- 왼쪽: 리스트 -->
  <text x="200" y="75" font-size="18" font-weight="bold" text-anchor="middle" fill="black">[x for x in range(5)]</text>
  <text x="200" y="97" font-size="13" text-anchor="middle" fill="black">리스트 컴프리헨션 — 모든 값을 한번에 메모리에 생성</text>

  <rect x="60" y="120" width="280" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="145" font-size="13" text-anchor="middle" fill="black">메모리</text>
  <g font-size="16" fill="black" text-anchor="middle">
    <rect x="70" y="155" width="40" height="40" fill="none" stroke="black"/>
    <text x="90" y="180">0</text>
    <rect x="120" y="155" width="40" height="40" fill="none" stroke="black"/>
    <text x="140" y="180">1</text>
    <rect x="170" y="155" width="40" height="40" fill="none" stroke="black"/>
    <text x="190" y="180">2</text>
    <rect x="220" y="155" width="40" height="40" fill="none" stroke="black"/>
    <text x="240" y="180">3</text>
    <rect x="270" y="155" width="40" height="40" fill="none" stroke="black"/>
    <text x="290" y="180">4</text>
  </g>

  <text x="200" y="240" font-size="13" text-anchor="middle" fill="black">0, 1, 2, 3, 4 모두를 동시에 저장</text>
  <text x="200" y="260" font-size="13" text-anchor="middle" fill="black" font-weight="bold">원소 개수가 많을수록 메모리 사용량 증가</text>

  <!-- 구분선 -->
  <line x1="410" y1="70" x2="410" y2="440" stroke="black" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- 오른쪽: 제너레이터 -->
  <text x="610" y="75" font-size="18" font-weight="bold" text-anchor="middle" fill="black">(x for x in range(5))</text>
  <text x="610" y="97" font-size="13" text-anchor="middle" fill="black">제너레이터 표현식 — 값을 필요할 때 하나씩 생성</text>

  <rect x="480" y="120" width="260" height="60" fill="none" stroke="black" stroke-width="2"/>
  <text x="610" y="155" font-size="14" text-anchor="middle" fill="black">제너레이터 객체 (상태만 기억)</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <line x1="610" y1="180" x2="610" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="650" y="200" font-size="12" fill="black">next() 호출</text>

  <rect x="560" y="215" width="100" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="610" y="240" font-size="16" text-anchor="middle" fill="black">0</text>

  <line x1="610" y1="255" x2="610" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow2)" stroke-dasharray="4,3"/>
  <text x="650" y="273" font-size="12" fill="black">next() 호출</text>

  <rect x="560" y="285" width="100" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="610" y="310" font-size="16" text-anchor="middle" fill="black">1</text>

  <text x="610" y="345" font-size="14" text-anchor="middle" fill="black">… 이후 2, 3, 4가 호출될 때마다 생성 …</text>

  <text x="610" y="390" font-size="13" text-anchor="middle" fill="black">한 번에 하나의 값만 메모리에 존재</text>
  <text x="610" y="410" font-size="13" text-anchor="middle" fill="black" font-weight="bold">원소 개수와 무관하게 메모리 사용량 일정</text>
</svg>

<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="820" height="560" fill="white"/>

  <text x="410" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="black">데코레이터가 함수를 감싸는 구조</text>
  <text x="410" y="58" font-size="13" text-anchor="middle" fill="black">@my_decorator 를 적용하면 원본 함수는 wrapper 함수 안에 감싸인다</text>

  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <!-- 호출자 -->
  <rect x="330" y="80" width="160" height="44" fill="none" stroke="black" stroke-width="2"/>
  <text x="410" y="107" font-size="15" text-anchor="middle" fill="black">호출자: say_hello()</text>

  <line x1="410" y1="124" x2="410" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- 바깥 상자: wrapper 함수 (데코레이터가 만든 함수) -->
  <rect x="120" y="150" width="580" height="360" fill="none" stroke="black" stroke-width="2.5"/>
  <text x="410" y="178" font-size="16" font-weight="bold" text-anchor="middle" fill="black">wrapper() — 데코레이터가 반환한 새 함수 (실제로 say_hello 이름표를 달고 있음)</text>

  <!-- 사전 작업 -->
  <rect x="160" y="196" width="500" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="410" y="226" font-size="14" text-anchor="middle" fill="black">① 원본 함수 실행 전 코드 (예: 시작 시각 기록)</text>

  <line x1="410" y1="246" x2="410" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="470" y="264" font-size="12" fill="black">func(*args, **kwargs) 호출</text>

  <!-- 안쪽 상자: 원본 함수 -->
  <rect x="220" y="276" width="380" height="90" fill="none" stroke="black" stroke-width="2.5" stroke-dasharray="2,0"/>
  <text x="410" y="300" font-size="15" font-weight="bold" text-anchor="middle" fill="black">func() — 원본 함수 (say_hello의 진짜 몸체)</text>
  <text x="410" y="325" font-size="13" text-anchor="middle" fill="black">본래 작성했던 로직을 그대로 수행</text>
  <text x="410" y="347" font-size="13" text-anchor="middle" fill="black">return 결과값</text>

  <line x1="410" y1="366" x2="410" y2="390" stroke="black" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="470" y="384" font-size="12" fill="black">결과값 반환</text>

  <!-- 사후 작업 -->
  <rect x="160" y="396" width="500" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="410" y="426" font-size="14" text-anchor="middle" fill="black">② 원본 함수 실행 후 코드 (예: 종료 시각 기록, 로그 출력)</text>

  <line x1="410" y1="446" x2="410" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrowD)"/>

  <rect x="330" y="470" width="160" height="40" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="410" y="495" font-size="14" text-anchor="middle" fill="black">wrapper의 결과를 반환</text>

  <text x="410" y="535" font-size="13" text-anchor="middle" fill="black">호출자 입장에서는 여전히 say_hello() 하나를 부른 것처럼 보인다</text>
</svg>

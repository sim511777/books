<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="640" height="420" fill="white" />

  <!-- Animal -->
  <rect x="230" y="20" width="140" height="50" fill="white" stroke="black" stroke-width="2" />
  <text x="300" y="50" text-anchor="middle" font-size="16">Animal</text>

  <!-- Swimmer -->
  <rect x="80" y="150" width="150" height="50" fill="white" stroke="black" stroke-width="2" />
  <text x="155" y="180" text-anchor="middle" font-size="16">Swimmer</text>

  <!-- Flyer -->
  <rect x="380" y="150" width="150" height="50" fill="white" stroke="black" stroke-width="2" />
  <text x="455" y="180" text-anchor="middle" font-size="16">Flyer</text>

  <!-- Duck -->
  <rect x="230" y="280" width="140" height="50" fill="white" stroke="black" stroke-width="2" />
  <text x="300" y="310" text-anchor="middle" font-size="16">Duck</text>

  <!-- 화살표: 자식 -> 부모 (상속 방향) -->
  <line x1="180" y1="150" x2="270" y2="72" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420" y1="150" x2="330" y2="72" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="270" y1="280" x2="180" y2="202" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="330" y1="280" x2="420" y2="202" stroke="black" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 클래스 정의 표기 -->
  <text x="155" y="230" text-anchor="middle" font-size="13">class Swimmer(Animal)</text>
  <text x="455" y="230" text-anchor="middle" font-size="13">class Flyer(Animal)</text>
  <text x="300" y="345" text-anchor="middle" font-size="13">class Duck(Swimmer, Flyer)</text>

  <!-- MRO 순서 박스 -->
  <rect x="60" y="370" width="520" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="320" y="395" text-anchor="middle" font-size="15">MRO 순서: Duck → Swimmer → Flyer → Animal → object</text>
</svg>

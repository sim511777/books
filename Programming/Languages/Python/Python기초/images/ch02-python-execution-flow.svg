<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="450" y="35" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Python 소스 코드 실행 흐름</text>

  <!-- 1. 소스 코드 박스 -->
  <rect x="40" y="90" width="200" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="140" y="115" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">소스 코드</text>
  <text x="140" y="135" font-size="12" fill="#000000" text-anchor="middle">hello.py</text>
  <rect x="55" y="145" width="170" height="70" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
  <text x="65" y="163" font-size="11" fill="#000000" font-family="monospace">name = "파이썬"</text>
  <text x="65" y="180" font-size="11" fill="#000000" font-family="monospace">print(</text>
  <text x="65" y="197" font-size="11" fill="#000000" font-family="monospace">  f"안녕, {name}")</text>

  <!-- 화살표 1 -->
  <line x1="240" y1="160" x2="320" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="145" font-size="11" fill="#000000" text-anchor="middle">한 줄씩 읽음</text>

  <!-- 2. 인터프리터 박스 -->
  <rect x="330" y="70" width="240" height="180" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="95" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Python 인터프리터</text>

  <rect x="350" y="110" width="200" height="40" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
  <text x="450" y="135" font-size="12" fill="#000000" text-anchor="middle">① 문법 분석 (해석)</text>

  <rect x="350" y="160" width="200" height="40" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
  <text x="450" y="185" font-size="12" fill="#000000" text-anchor="middle">② 한 줄 즉시 실행</text>

  <text x="450" y="222" font-size="11" fill="#000000" text-anchor="middle">다음 줄로 이동해 반복</text>

  <!-- 인터프리터 내부 반복 화살표 -->
  <path d="M 555 130 C 590 130, 590 195, 555 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 화살표 2 -->
  <line x1="570" y1="160" x2="650" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="145" font-size="11" fill="#000000" text-anchor="middle">결과 전달</text>

  <!-- 3. 실행 결과 박스 -->
  <rect x="660" y="90" width="200" height="140" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="760" y="115" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">실행 결과</text>
  <text x="760" y="135" font-size="12" fill="#000000" text-anchor="middle">터미널 화면</text>
  <rect x="675" y="145" width="170" height="55" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
  <text x="685" y="175" font-size="12" fill="#000000" font-family="monospace">안녕, 파이썬</text>

  <!-- 하단 설명 -->
  <text x="450" y="290" font-size="13" fill="#000000" text-anchor="middle">컴파일 언어처럼 전체를 먼저 번역하지 않고,</text>
  <text x="450" y="312" font-size="13" fill="#000000" text-anchor="middle">인터프리터가 코드를 한 줄씩 해석하며 그 자리에서 바로 실행합니다.</text>

  <!-- 오류 발생 경로 -->
  <line x1="450" y1="250" x2="450" y2="330" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="470" y="345" font-size="12" fill="#000000">문법 오류가 있으면 그 줄에서 즉시 멈추고</text>
  <text x="470" y="365" font-size="12" fill="#000000">에러 메시지를 출력합니다 (Traceback)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

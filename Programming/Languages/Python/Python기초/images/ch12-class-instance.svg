<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="800" height="480" fill="#ffffff" />

  <!-- 제목 -->
  <text x="400" y="30" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">클래스(설계도)와 인스턴스(객체)의 관계</text>

  <!-- 클래스 박스 (설계도) -->
  <rect x="40" y="70" width="260" height="220" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="170" y="98" font-size="16" text-anchor="middle" fill="#000000" font-weight="bold">클래스 Dog</text>
  <text x="170" y="116" font-size="12" text-anchor="middle" fill="#000000">(설계도, blueprint)</text>
  <line x1="40" y1="128" x2="300" y2="128" stroke="#000000" stroke-width="1" />

  <text x="56" y="150" font-size="13" fill="#000000">속성 (정의만 있음)</text>
  <text x="66" y="170" font-size="12" fill="#000000">- name</text>
  <text x="66" y="188" font-size="12" fill="#000000">- breed</text>

  <line x1="40" y1="202" x2="300" y2="202" stroke="#000000" stroke-width="1" />

  <text x="56" y="222" font-size="13" fill="#000000">메서드</text>
  <text x="66" y="242" font-size="12" fill="#000000">- __init__(self, name, breed)</text>
  <text x="66" y="260" font-size="12" fill="#000000">- bark(self)</text>

  <text x="170" y="282" font-size="11" text-anchor="middle" fill="#555555">실제 값은 없고, 구조와 동작만 정의</text>

  <!-- 화살표: 인스턴스 생성 -->
  <text x="360" y="175" font-size="12" text-anchor="middle" fill="#000000">Dog(...)</text>
  <text x="360" y="192" font-size="11" text-anchor="middle" fill="#555555">인스턴스 생성</text>
  <line x1="305" y1="200" x2="410" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- 인스턴스 박스 1 -->
  <rect x="420" y="60" width="340" height="110" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="82" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">인스턴스 (객체) : my_dog</text>
  <line x1="420" y1="92" x2="760" y2="92" stroke="#000000" stroke-width="1" />
  <text x="436" y="112" font-size="12" fill="#000000">name = "초코"</text>
  <text x="436" y="130" font-size="12" fill="#000000">breed = "진돗개"</text>
  <text x="436" y="152" font-size="11" fill="#555555">my_dog.bark() → "초코가 짖습니다: 멍멍!"</text>

  <!-- 인스턴스 박스 2 -->
  <rect x="420" y="190" width="340" height="110" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="212" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">인스턴스 (객체) : your_dog</text>
  <line x1="420" y1="222" x2="760" y2="222" stroke="#000000" stroke-width="1" />
  <text x="436" y="242" font-size="12" fill="#000000">name = "흰둥이"</text>
  <text x="436" y="260" font-size="12" fill="#000000">breed = "말티즈"</text>
  <text x="436" y="282" font-size="11" fill="#555555">your_dog.bark() → "흰둥이가 짖습니다: 멍멍!"</text>

  <!-- 하단 설명 -->
  <rect x="40" y="330" width="720" height="120" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" />
  <text x="60" y="356" font-size="13" fill="#000000" font-weight="bold">핵심 개념</text>
  <text x="60" y="380" font-size="12" fill="#000000">- 클래스는 하나뿐이지만, 그 클래스로부터 만들어지는 인스턴스는 여러 개가 될 수 있습니다.</text>
  <text x="60" y="400" font-size="12" fill="#000000">- 각 인스턴스는 같은 구조(속성, 메서드)를 공유하지만, 실제 데이터(name, breed 값)는 서로 다릅니다.</text>
  <text x="60" y="420" font-size="12" fill="#000000">- my_dog와 your_dog는 모두 Dog 클래스의 인스턴스이므로, type(my_dog) == Dog 는 True 입니다.</text>
  <text x="60" y="440" font-size="12" fill="#000000">- 클래스는 붕어빵 틀, 인스턴스는 그 틀로 찍어낸 붕어빵 하나하나에 비유할 수 있습니다.</text>
</svg>

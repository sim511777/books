<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="450" y="30" font-family="sans-serif" font-size="18" fill="#000000" text-anchor="middle">스트림 파이프라인: filter → map → collect</text>

  <!-- 원본 리스트 -->
  <g>
    <text x="70" y="70" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">원본 리스트</text>
    <rect x="20" y="90" width="100" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="70" y="112" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">[1,2,3,4,5,6]</text>
  </g>

  <!-- 화살표 1 -->
  <line x1="130" y1="107" x2="185" y2="107" stroke="#000000" stroke-width="1.5"/>
  <polygon points="185,107 175,102 175,112" fill="#000000"/>

  <!-- stream() -->
  <g>
    <rect x="190" y="90" width="90" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="235" y="112" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">stream()</text>
  </g>

  <!-- 화살표 2 -->
  <line x1="280" y1="107" x2="335" y2="107" stroke="#000000" stroke-width="1.5"/>
  <polygon points="335,107 325,102 325,112" fill="#000000"/>

  <!-- filter 단계 -->
  <g>
    <rect x="340" y="70" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="415" y="92" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">중간 연산</text>
    <text x="415" y="112" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">filter(</text>
    <text x="415" y="128" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">n -&gt; n % 2 == 0)</text>
    <text x="415" y="148" font-family="sans-serif" font-size="11" fill="#000000" text-anchor="middle">짝수만 남김</text>
  </g>
  <text x="415" y="185" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">→ [2, 4, 6]</text>

  <!-- 화살표 3 -->
  <line x1="490" y1="107" x2="545" y2="107" stroke="#000000" stroke-width="1.5"/>
  <polygon points="545,107 535,102 535,112" fill="#000000"/>

  <!-- map 단계 -->
  <g>
    <rect x="550" y="70" width="150" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="625" y="92" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">중간 연산</text>
    <text x="625" y="112" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">map(</text>
    <text x="625" y="128" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">n -&gt; n * n)</text>
    <text x="625" y="148" font-family="sans-serif" font-size="11" fill="#000000" text-anchor="middle">각 값을 제곱으로 변환</text>
  </g>
  <text x="625" y="185" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">→ [4, 16, 36]</text>

  <!-- 화살표 4 -->
  <line x1="700" y1="107" x2="755" y2="107" stroke="#000000" stroke-width="1.5"/>
  <polygon points="755,107 745,102 745,112" fill="#000000"/>

  <!-- collect 단계 -->
  <g>
    <rect x="760" y="70" width="120" height="90" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="820" y="92" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">최종 연산</text>
    <text x="820" y="112" font-family="monospace" font-size="13" fill="#000000" text-anchor="middle">collect(</text>
    <text x="820" y="128" font-family="monospace" font-size="11" fill="#000000" text-anchor="middle">toList())</text>
    <text x="820" y="148" font-family="sans-serif" font-size="11" fill="#000000" text-anchor="middle">결과 생성</text>
  </g>
  <text x="820" y="185" font-family="monospace" font-size="12" fill="#000000" text-anchor="middle">→ [4, 16, 36]</text>

  <!-- 하단 설명: 지연 실행 -->
  <line x1="20" y1="230" x2="880" y2="230" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="450" y="255" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">
    filter와 map은 중간 연산으로, collect가 호출되기 전까지는 실제로 실행되지 않는다 (지연 실행)
  </text>
  <text x="450" y="280" font-family="sans-serif" font-size="13" fill="#000000" text-anchor="middle">
    collect가 호출되는 순간, 원본 리스트의 각 원소가 파이프라인을 한 번씩 통과하며 최종 결과가 만들어진다
  </text>

  <!-- 범례 -->
  <g>
    <rect x="60" y="310" width="18" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="88" y="324" font-family="sans-serif" font-size="12" fill="#000000">중간 연산 (Intermediate Operation) — 새로운 스트림을 반환</text>
  </g>
  <g>
    <rect x="60" y="338" width="18" height="18" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="88" y="352" font-family="sans-serif" font-size="12" fill="#000000">최종 연산 (Terminal Operation) — 파이프라인을 실행하고 결과를 만듦</text>
  </g>
</svg>

<svg width="760" height="500" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">synchronized가 공유 자원을 보호하는 방식</text>

  <!-- ================= Panel 1 : 시각 1 ================= -->
  <text x="20" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000000">시각 1 — 스레드A가 락을 획득하고 임계 구역에 진입</text>

  <!-- Thread A box (active) -->
  <rect x="30" y="80" width="140" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="105" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">스레드A</text>
  <text x="100" y="124" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#000000">실행 중</text>

  <!-- Thread B box (waiting) -->
  <rect x="30" y="160" width="140" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="100" y="185" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">스레드B</text>
  <text x="100" y="204" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#000000">대기 중 (blocked)</text>

  <!-- Critical section box -->
  <rect x="330" y="80" width="220" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="440" y="102" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">임계 구역</text>
  <text x="440" y="120" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">synchronized</text>
  <text x="440" y="138" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">increment()</text>
  <line x1="345" y1="150" x2="535" y2="150" stroke="#000000" stroke-width="1"/>
  <text x="440" y="170" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">count = 41</text>

  <!-- Lock icon on critical section (locked) -->
  <g transform="translate(500,84)">
    <rect x="0" y="10" width="24" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <path d="M4,10 L4,4 A8,8 0 0 1 20,4 L20,10" fill="none" stroke="#000000" stroke-width="1.5"/>
  </g>
  <text x="512" y="118" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000000">잠김</text>
  <text x="512" y="132" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000000">(A 보유)</text>

  <!-- Arrow A -> critical section (solid, allowed) -->
  <line x1="170" y1="110" x2="330" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="230" y="102" font-family="sans-serif" font-size="11" fill="#000000">진입 허용</text>

  <!-- Arrow B -> critical section (dashed, blocked) -->
  <line x1="170" y1="195" x2="330" y2="170" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOpen)"/>
  <text x="220" y="205" font-family="sans-serif" font-size="11" fill="#000000">진입 거부 (락 대기)</text>

  <!-- ================= Divider ================= -->
  <line x1="20" y1="248" x2="740" y2="248" stroke="#000000" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ================= Panel 2 : 시각 2 ================= -->
  <text x="20" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000000">시각 2 — 스레드A가 락을 반납하고, 스레드B가 락을 획득</text>

  <!-- Thread A box (finished) -->
  <rect x="30" y="298" width="140" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="100" y="323" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">스레드A</text>
  <text x="100" y="342" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#000000">락 반납, 다음 작업</text>

  <!-- Thread B box (active) -->
  <rect x="30" y="378" width="140" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="403" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">스레드B</text>
  <text x="100" y="422" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#000000">실행 중</text>

  <!-- Critical section box 2 -->
  <rect x="330" y="298" width="220" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="440" y="320" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">임계 구역</text>
  <text x="440" y="338" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">synchronized</text>
  <text x="440" y="356" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">increment()</text>
  <line x1="345" y1="368" x2="535" y2="368" stroke="#000000" stroke-width="1"/>
  <text x="440" y="388" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">count = 42</text>

  <!-- Lock icon on critical section 2 (locked by B) -->
  <g transform="translate(500,302)">
    <rect x="0" y="10" width="24" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <path d="M4,10 L4,4 A8,8 0 0 1 20,4 L20,10" fill="none" stroke="#000000" stroke-width="1.5"/>
  </g>
  <text x="512" y="336" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000000">잠김</text>
  <text x="512" y="350" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000000">(B 보유)</text>

  <!-- Arrow B -> critical section (now solid, allowed) -->
  <line x1="170" y1="400" x2="330" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="220" y="415" font-family="sans-serif" font-size="11" fill="#000000">락 획득, 진입 허용</text>

  <!-- Arrow A leaving -->
  <line x1="170" y1="320" x2="290" y2="320" stroke="#000000" stroke-width="1" marker-end="url(#arrowOpen)"/>
  <text x="230" y="313" font-family="sans-serif" font-size="10" fill="#000000">종료</text>

  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <text x="380" y="470" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">같은 락을 두 스레드가 동시에 보유할 수 없으므로, count는 항상 한 스레드에 의해서만 안전하게 수정된다</text>
</svg>

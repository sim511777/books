<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="white"/>
  <text x="400" y="30" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">네 가지 핵심 컬렉션 비교</text>

  <!-- Panel 1: List -->
  <rect x="20" y="60" width="360" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="88" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">리스트 (List)  '(1 2 3)</text>

  <rect x="50" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="80" y="153" font-family="monospace" font-size="24" text-anchor="middle">1</text>
  <line x1="110" y1="145" x2="145" y2="145" stroke="black" stroke-width="2"/>
  <polygon points="145,145 135,140 135,150" fill="black"/>

  <rect x="150" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="180" y="153" font-family="monospace" font-size="24" text-anchor="middle">2</text>
  <line x1="210" y1="145" x2="245" y2="145" stroke="black" stroke-width="2"/>
  <polygon points="245,145 235,140 235,150" fill="black"/>

  <rect x="250" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="280" y="153" font-family="monospace" font-size="24" text-anchor="middle">3</text>
  <line x1="310" y1="145" x2="340" y2="145" stroke="black" stroke-width="2"/>
  <polygon points="340,145 330,140 330,150" fill="black"/>
  <text x="358" y="153" font-family="monospace" font-size="16" text-anchor="middle">nil</text>

  <text x="200" y="210" font-family="sans-serif" font-size="13" text-anchor="middle">첫 원소부터 순차 접근(빠름)</text>
  <text x="200" y="228" font-family="sans-serif" font-size="13" text-anchor="middle">conj는 앞쪽에 추가됨</text>

  <!-- Panel 2: Vector -->
  <rect x="420" y="60" width="360" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="600" y="88" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">벡터 (Vector)  [1 2 3]</text>

  <rect x="520" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="153" font-family="monospace" font-size="24" text-anchor="middle">1</text>
  <rect x="580" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="610" y="153" font-family="monospace" font-size="24" text-anchor="middle">2</text>
  <rect x="640" y="120" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
  <text x="670" y="153" font-family="monospace" font-size="24" text-anchor="middle">3</text>

  <text x="550" y="192" font-family="sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="610" y="192" font-family="sans-serif" font-size="13" text-anchor="middle">1</text>
  <text x="670" y="192" font-family="sans-serif" font-size="13" text-anchor="middle">2</text>

  <text x="600" y="215" font-family="sans-serif" font-size="13" text-anchor="middle">인덱스로 즉시 접근 (nth, get)</text>
  <text x="600" y="233" font-family="sans-serif" font-size="13" text-anchor="middle">conj는 뒤쪽에 추가됨</text>

  <!-- Panel 3: Map -->
  <rect x="20" y="290" width="360" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="318" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">맵 (Map)  {:a 1, :b 2}</text>

  <rect x="90" y="335" width="80" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="130" y="362" font-family="monospace" font-size="18" text-anchor="middle">:a</text>
  <line x1="170" y1="355" x2="200" y2="355" stroke="black" stroke-width="2"/>
  <polygon points="200,355 190,350 190,360" fill="black"/>
  <rect x="205" y="335" width="80" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="245" y="362" font-family="monospace" font-size="18" text-anchor="middle">1</text>

  <rect x="90" y="390" width="80" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="130" y="417" font-family="monospace" font-size="18" text-anchor="middle">:b</text>
  <line x1="170" y1="410" x2="200" y2="410" stroke="black" stroke-width="2"/>
  <polygon points="200,410 190,405 190,415" fill="black"/>
  <rect x="205" y="390" width="80" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="245" y="417" font-family="monospace" font-size="18" text-anchor="middle">2</text>

  <text x="200" y="460" font-family="sans-serif" font-size="13" text-anchor="middle">키로 값을 조회 (get, 또는 :키워드를 함수처럼 호출)</text>
  <text x="200" y="478" font-family="sans-serif" font-size="13" text-anchor="middle">순서를 보장하지 않는 연관 배열</text>

  <!-- Panel 4: Set -->
  <rect x="420" y="290" width="360" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="600" y="312" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">셋 (Set)  #{1 2 3}</text>

  <ellipse cx="600" cy="393" rx="150" ry="63" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="540" cy="378" r="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="540" y="384" font-family="monospace" font-size="18" text-anchor="middle">1</text>
  <circle cx="600" cy="415" r="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="600" y="421" font-family="monospace" font-size="18" text-anchor="middle">2</text>
  <circle cx="660" cy="378" r="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="660" y="384" font-family="monospace" font-size="18" text-anchor="middle">3</text>

  <text x="600" y="470" font-family="sans-serif" font-size="13" text-anchor="middle">중복 없는 원소 모음, contains? 로 포함 여부 확인</text>
</svg>

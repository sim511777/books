<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">아톰 · 레퍼런스 · 에이전트 비교</text>

  <!-- Axis labels -->
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#000000">가로축: 다루는 상태의 개수 / 세로축: 실행 방식(동기·비동기)</text>

  <!-- Axes -->
  <!-- vertical axis -->
  <line x1="130" y1="90" x2="130" y2="470" stroke="#000000" stroke-width="2"/>
  <polygon points="130,84 124,96 136,96" fill="#000000"/>
  <text x="80" y="180" font-size="15" fill="#000000">동기</text>
  <text x="80" y="200" font-size="12" fill="#333333">(호출자가</text>
  <text x="80" y="216" font-size="12" fill="#333333">결과를 기다림)</text>
  <text x="80" y="360" font-size="15" fill="#000000">비동기</text>
  <text x="80" y="380" font-size="12" fill="#333333">(백그라운드</text>
  <text x="80" y="396" font-size="12" fill="#333333">스레드에 위임)</text>

  <!-- horizontal axis -->
  <line x1="130" y1="470" x2="740" y2="470" stroke="#000000" stroke-width="2"/>
  <polygon points="746,470 734,464 734,476" fill="#000000"/>
  <text x="270" y="500" text-anchor="middle" font-size="15" fill="#000000">단일 상태</text>
  <text x="270" y="518" text-anchor="middle" font-size="12" fill="#333333">(독립된 값 하나)</text>
  <text x="590" y="500" text-anchor="middle" font-size="15" fill="#000000">복수 상태</text>
  <text x="590" y="518" text-anchor="middle" font-size="12" fill="#333333">(여러 값을 함께)</text>

  <!-- quadrant divider lines (dashed, light) -->
  <line x1="430" y1="90" x2="430" y2="470" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="130" y1="280" x2="740" y2="280" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Atom box: sync + single -->
  <rect x="175" y="115" width="200" height="140" fill="#ffffff" stroke="#000000" stroke-width="2" rx="8"/>
  <text x="275" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">아톰 (atom)</text>
  <text x="275" y="170" text-anchor="middle" font-size="13" fill="#000000">swap! / reset!</text>
  <text x="275" y="192" text-anchor="middle" font-size="12" fill="#333333">CAS 기반, 재시도로</text>
  <text x="275" y="208" text-anchor="middle" font-size="12" fill="#333333">원자성 보장</text>
  <text x="275" y="232" text-anchor="middle" font-size="12" fill="#555555">예: 카운터, 캐시</text>

  <!-- Ref box: sync + multiple -->
  <rect x="480" y="115" width="220" height="140" fill="#ffffff" stroke="#000000" stroke-width="2" rx="8"/>
  <text x="590" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">레퍼런스 (ref)</text>
  <text x="590" y="170" text-anchor="middle" font-size="13" fill="#000000">dosync 안에서 alter / commute</text>
  <text x="590" y="192" text-anchor="middle" font-size="12" fill="#333333">STM 트랜잭션으로</text>
  <text x="590" y="208" text-anchor="middle" font-size="12" fill="#333333">원자성·일관성·격리성 보장</text>
  <text x="590" y="232" text-anchor="middle" font-size="12" fill="#555555">예: 계좌 간 이체</text>

  <!-- Agent box: async + single -->
  <rect x="175" y="305" width="200" height="140" fill="#ffffff" stroke="#000000" stroke-width="2" rx="8"/>
  <text x="275" y="335" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">에이전트 (agent)</text>
  <text x="275" y="360" text-anchor="middle" font-size="13" fill="#000000">send / send-off</text>
  <text x="275" y="382" text-anchor="middle" font-size="12" fill="#333333">작업을 스레드 풀에 맡기고</text>
  <text x="275" y="398" text-anchor="middle" font-size="12" fill="#333333">즉시 반환, await로 대기 가능</text>
  <text x="275" y="422" text-anchor="middle" font-size="12" fill="#555555">예: 로그 적재, 백그라운드 집계</text>

  <!-- Empty quadrant: async + multiple -->
  <rect x="480" y="305" width="220" height="140" fill="#f5f5f5" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="590" y="365" text-anchor="middle" font-size="14" fill="#777777">해당하는 표준 도구 없음</text>
  <text x="590" y="386" text-anchor="middle" font-size="12" fill="#999999">(필요하면 에이전트 여러 개를</text>
  <text x="590" y="402" text-anchor="middle" font-size="12" fill="#999999">직접 조합해서 구성)</text>

  <!-- Legend note -->
  <text x="400" y="548" text-anchor="middle" font-size="12" fill="#555555">공통점: 세 도구 모두 내부 값은 불변(immutable) 값이며, 참조 타입만 "지금 어떤 값을 가리키는지"를 바꿀 뿐입니다.</text>
</svg>

<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 생산자 go 블록 -->
  <rect x="30" y="90" width="150" height="70" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="105" y="120" font-size="14" text-anchor="middle" fill="#000">생산자</text>
  <text x="105" y="140" font-size="12" text-anchor="middle" fill="#000">(go ...)</text>

  <!-- 채널 -->
  <rect x="260" y="100" width="180" height="50" fill="#ffffff" stroke="#000" stroke-width="1.5" rx="6"/>
  <text x="350" y="122" font-size="13" text-anchor="middle" fill="#000">채널 (chan)</text>
  <text x="350" y="140" font-size="11" text-anchor="middle" fill="#555">&gt;! 로 넣고 &lt;! 로 꺼냄</text>

  <!-- 소비자 go 블록 -->
  <rect x="520" y="90" width="150" height="70" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  <text x="595" y="120" font-size="14" text-anchor="middle" fill="#000">소비자</text>
  <text x="595" y="140" font-size="12" text-anchor="middle" fill="#000">(go ...)</text>

  <!-- 화살표: 생산자 -> 채널 -->
  <line x1="180" y1="125" x2="255" y2="125" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="217" y="115" font-size="11" text-anchor="middle" fill="#000">&gt;! ch 값</text>

  <!-- 화살표: 채널 -> 소비자 -->
  <line x1="440" y1="125" x2="515" y2="125" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="477" y="115" font-size="11" text-anchor="middle" fill="#000">&lt;! ch</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>

  <text x="350" y="210" font-size="12" text-anchor="middle" fill="#555">생산자가 값이 준비될 때까지, 소비자가 값을 받을 때까지 서로 파킹(park)하며 기다린다</text>
</svg>

<svg viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="920" height="380" fill="#ffffff" stroke="none"/>

  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">map → filter → reduce 데이터 처리 파이프라인</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#000000">(입력: 1부터 10까지의 정수 시퀀스)</text>

  <!-- 입력 데이터 -->
  <g>
    <text x="60" y="100" font-size="13" font-weight="bold" fill="#000000">입력</text>
    <rect x="20" y="115" width="120" height="130" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="80" y="135" text-anchor="middle" font-size="12" fill="#000000">(range 1 11)</text>
    <text x="80" y="160" text-anchor="middle" font-size="12" fill="#000000">1 2 3 4 5</text>
    <text x="80" y="180" text-anchor="middle" font-size="12" fill="#000000">6 7 8 9 10</text>
    <text x="80" y="210" text-anchor="middle" font-size="11" fill="#000000">지연 시퀀스</text>
    <text x="80" y="228" text-anchor="middle" font-size="11" fill="#000000">(lazy-seq)</text>
  </g>

  <line x1="150" y1="180" x2="205" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- map 단계 -->
  <g>
    <text x="280" y="100" font-size="13" font-weight="bold" fill="#000000">map</text>
    <text x="280" y="116" text-anchor="middle" font-size="11" fill="#000000">(map #(* % %) coll)</text>
    <rect x="215" y="130" width="130" height="115" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="280" y="150" text-anchor="middle" font-size="11" fill="#000000">각 원소를</text>
    <text x="280" y="168" text-anchor="middle" font-size="11" fill="#000000">제곱으로 변환</text>
    <text x="280" y="192" text-anchor="middle" font-size="12" fill="#000000">1 4 9 16 25</text>
    <text x="280" y="212" text-anchor="middle" font-size="12" fill="#000000">36 49 64 81 100</text>
  </g>

  <line x1="350" y1="187" x2="405" y2="187" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- filter 단계 -->
  <g>
    <text x="480" y="100" font-size="13" font-weight="bold" fill="#000000">filter</text>
    <text x="480" y="116" text-anchor="middle" font-size="11" fill="#000000">(filter even? coll)</text>
    <rect x="415" y="130" width="130" height="115" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="480" y="150" text-anchor="middle" font-size="11" fill="#000000">조건을 만족하는</text>
    <text x="480" y="168" text-anchor="middle" font-size="11" fill="#000000">원소만 통과</text>
    <text x="480" y="192" text-anchor="middle" font-size="12" fill="#000000">4 16 36</text>
    <text x="480" y="212" text-anchor="middle" font-size="12" fill="#000000">64 100</text>
  </g>

  <line x1="550" y1="187" x2="605" y2="187" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- reduce 단계 -->
  <g>
    <text x="680" y="100" font-size="13" font-weight="bold" fill="#000000">reduce</text>
    <text x="680" y="116" text-anchor="middle" font-size="11" fill="#000000">(reduce + 0 coll)</text>
    <rect x="615" y="130" width="130" height="115" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="680" y="150" text-anchor="middle" font-size="11" fill="#000000">누적하여</text>
    <text x="680" y="168" text-anchor="middle" font-size="11" fill="#000000">하나의 값으로</text>
    <text x="680" y="200" text-anchor="middle" font-size="14" fill="#000000">4+16+36+64+100</text>
  </g>

  <line x1="750" y1="187" x2="805" y2="187" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 결과 -->
  <g>
    <text x="855" y="100" font-size="13" font-weight="bold" fill="#000000">결과</text>
    <rect x="815" y="150" width="90" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="860" y="192" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">220</text>
  </g>

  <!-- 스레딩 매크로 표기 -->
  <rect x="20" y="290" width="880" height="70" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="460" y="315" text-anchor="middle" font-size="12" fill="#000000">스레딩 매크로로 표현하면:</text>
  <text x="460" y="340" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#000000">(-&gt;&gt; (range 1 11) (map #(* % %)) (filter even?) (reduce +))</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="420" fill="white"/>

  <!-- 1. 코드 작성 -->
  <rect x="40" y="60" width="180" height="90" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="18" fill="black" font-weight="bold">코드 작성</text>
  <text x="130" y="120" text-anchor="middle" font-size="13" fill="black">에디터에서 함수나</text>
  <text x="130" y="138" text-anchor="middle" font-size="13" fill="black">표현식을 수정</text>

  <!-- 2. REPL에 전송 -->
  <rect x="360" y="60" width="180" height="90" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="18" fill="black" font-weight="bold">REPL에 전송</text>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="black">선택한 코드를</text>
  <text x="450" y="138" text-anchor="middle" font-size="13" fill="black">즉시 평가(eval)</text>

  <!-- 3. 결과 확인 -->
  <rect x="680" y="60" width="180" height="90" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="770" y="95" text-anchor="middle" font-size="18" fill="black" font-weight="bold">결과 확인</text>
  <text x="770" y="120" text-anchor="middle" font-size="13" fill="black">반환값, 출력,</text>
  <text x="770" y="138" text-anchor="middle" font-size="13" fill="black">에러 메시지 확인</text>

  <!-- 화살표 1 -> 2 -->
  <line x1="220" y1="105" x2="352" y2="105" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 화살표 2 -> 3 -->
  <line x1="540" y1="105" x2="672" y2="105" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. 코드 수정 및 개선 -->
  <rect x="360" y="260" width="180" height="90" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="450" y="295" text-anchor="middle" font-size="18" fill="black" font-weight="bold">코드 수정</text>
  <text x="450" y="320" text-anchor="middle" font-size="13" fill="black">결과를 바탕으로</text>
  <text x="450" y="338" text-anchor="middle" font-size="13" fill="black">함수를 다시 정의</text>

  <!-- 화살표 3 -> 4 (아래로 꺾여서) -->
  <path d="M 770 150 L 770 305 L 548 305" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표 4 -> 1 (아래로 꺾여서 돌아감, 순환 강조) -->
  <path d="M 360 305 L 130 305 L 130 158" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 중앙 순환 라벨 -->
  <text x="450" y="230" text-anchor="middle" font-size="14" fill="black" font-style="italic">
    실행 중인 프로그램을 멈추지 않고 반복
  </text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <!-- 하단 설명 -->
  <text x="450" y="400" text-anchor="middle" font-size="14" fill="black">
    REPL 기반 개발 흐름: 작성 → 평가 → 확인 → 수정을 짧은 주기로 반복한다
  </text>
</svg>

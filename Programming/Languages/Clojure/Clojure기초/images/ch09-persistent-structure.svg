<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">영속적 벡터의 구조 공유 (conj 예시)</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#333333">(설명을 위해 리프 노드 용량을 3개로 단순화함 — 실제 Clojure 벡터는 32개씩 묶임)</text>

  <!-- v1 라벨 -->
  <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">v1 = [1 2 3 4 5 6]</text>

  <!-- v2 라벨 -->
  <text x="470" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">v2 = (conj v1 7)</text>
  <text x="470" y="107" text-anchor="middle" font-size="13" fill="#000000">= [1 2 3 4 5 6 7]</text>

  <!-- 루트 노드 v1 -->
  <rect x="105" y="130" width="90" height="44" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="150" y="147" text-anchor="middle" font-size="12" fill="#000000">루트</text>
  <text x="150" y="163" text-anchor="middle" font-size="12" fill="#000000">(v1)</text>

  <!-- 루트 노드 v2 (새로 생성 - 회색) -->
  <rect x="425" y="130" width="90" height="44" fill="#e5e5e5" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="470" y="147" text-anchor="middle" font-size="12" fill="#000000">루트</text>
  <text x="470" y="163" text-anchor="middle" font-size="12" fill="#000000">(v2, 새로 생성)</text>

  <!-- 리프 B (v1 전용, 그대로) -->
  <rect x="55" y="260" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="115" y="280" text-anchor="middle" font-size="12" fill="#000000">리프 B</text>
  <text x="115" y="297" text-anchor="middle" font-size="12" fill="#000000">[ 4  5  6 ]</text>

  <!-- 리프 A (공유) -->
  <rect x="260" y="330" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="4"/>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#000000">리프 A (공유됨)</text>
  <text x="320" y="367" text-anchor="middle" font-size="12" fill="#000000">[ 1  2  3 ]</text>

  <!-- 리프 B' (v2 전용, 새로 생성) -->
  <rect x="435" y="260" width="130" height="50" fill="#e5e5e5" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#000000">리프 B' (새로 생성)</text>
  <text x="500" y="297" text-anchor="middle" font-size="12" fill="#000000">[ 4  5  6  7 ]</text>

  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 루트(v1) -> 리프B -->
  <line x1="130" y1="174" x2="118" y2="258" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 루트(v1) -> 리프A(공유) -->
  <line x1="168" y1="174" x2="295" y2="330" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 루트(v2) -> 리프A(공유) -->
  <line x1="450" y1="174" x2="355" y2="330" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 루트(v2) -> 리프B'(새로 생성) -->
  <line x1="490" y1="174" x2="500" y2="258" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 범례 -->
  <rect x="55" y="400" width="16" height="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="78" y="413" font-size="12" fill="#000000">기존 노드 (변경 없이 그대로 재사용)</text>

  <rect x="330" y="400" width="16" height="16" fill="#e5e5e5" stroke="#000000" stroke-width="2"/>
  <text x="353" y="413" font-size="12" fill="#000000">새로 생성된 노드</text>
</svg>

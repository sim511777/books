<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="320" fill="white"/>

  <!-- 전체를 감싸는 브래킷 (위쪽) -->
  <polyline points="60,85 60,70 650,70 650,85" fill="none" stroke="black" stroke-width="2"/>
  <line x1="355" y1="70" x2="355" y2="50" stroke="black" stroke-width="2"/>
  <text x="355" y="35" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">전체가 하나의 S-표현식(폼) — 실행 가능한 코드 한 덩어리</text>

  <!-- 토큰 박스: ( + 1 2 3 ) -->
  <!-- i0 : ( -->
  <rect x="60" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="105" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">(</text>

  <!-- i1 : + -->
  <rect x="160" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="205" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">+</text>

  <!-- i2 : 1 -->
  <rect x="260" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="305" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">1</text>

  <!-- i3 : 2 -->
  <rect x="360" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="405" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">2</text>

  <!-- i4 : 3 -->
  <rect x="460" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="505" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">3</text>

  <!-- i5 : ) -->
  <rect x="560" y="100" width="90" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="605" y="148" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">)</text>

  <!-- 연산자 라벨: i1의 + 를 가리킴 -->
  <line x1="205" y1="170" x2="205" y2="195" stroke="black" stroke-width="2"/>
  <text x="205" y="215" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">연산자</text>
  <text x="205" y="233" font-family="sans-serif" font-size="13" text-anchor="middle">(항상 맨 앞)</text>

  <!-- 피연산자 브래킷: i2,i3,i4 -->
  <polyline points="260,170 260,190 550,190 550,170" fill="none" stroke="black" stroke-width="2"/>
  <line x1="405" y1="190" x2="405" y2="215" stroke="black" stroke-width="2"/>
  <text x="405" y="235" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">피연산자들 (인자 목록)</text>

  <!-- 하단 설명 -->
  <text x="355" y="285" font-family="sans-serif" font-size="14" text-anchor="middle">Lisp에서는 연산자도 괄호 안의 첫 번째 원소일 뿐입니다 — "함수 호출도 곧 하나의 리스트 데이터"</text>
  <text x="355" y="305" font-family="sans-serif" font-size="14" text-anchor="middle">(+ 1 2 3) 을 평가하면 6 이 되지만, 이 표현은 그 자체로 3개 원소를 담은 리스트이기도 합니다</text>
</svg>

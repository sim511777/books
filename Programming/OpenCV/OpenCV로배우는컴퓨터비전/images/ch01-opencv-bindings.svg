<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">OpenCV Python 생태계와 활용 분야</text>

  <!-- Row A: NumPy and opencv-python hub -->
  <rect x="40" y="42" width="180" height="52" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="130" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">NumPy</text>
  <text x="130" y="81" text-anchor="middle" font-size="11" fill="#000000">(np.ndarray)</text>

  <rect x="340" y="42" width="220" height="52" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="450" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">opencv-python</text>
  <text x="450" y="81" text-anchor="middle" font-size="11" fill="#000000">(import cv2)</text>

  <!-- double-headed arrow NumPy <-> opencv-python -->
  <line x1="222" y1="68" x2="338" y2="68" stroke="#000000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="106" text-anchor="middle" font-size="10" fill="#000000">이미지 = np.ndarray</text>

  <!-- connector: hub -> bus1 -->
  <line x1="450" y1="94" x2="450" y2="130" stroke="#000000" stroke-width="2"/>
  <!-- bus1 -->
  <line x1="10" y1="130" x2="870" y2="130" stroke="#000000" stroke-width="1.5"/>

  <!-- bus1 -> module boxes -->
  <line x1="75" y1="130" x2="75" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="130" x2="225" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="130" x2="375" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="525" y1="130" x2="525" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="130" x2="675" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="130" x2="825" y2="155" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Module row (core opencv-python submodules) -->
  <rect x="10"  y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="75"  y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">imgcodecs</text>
  <text x="75"  y="196" text-anchor="middle" font-size="10" fill="#000000">(파일 입출력)</text>

  <rect x="160" y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="225" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">imgproc</text>
  <text x="225" y="196" text-anchor="middle" font-size="10" fill="#000000">(필터링·변환)</text>

  <rect x="310" y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="375" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">videoio</text>
  <text x="375" y="196" text-anchor="middle" font-size="10" fill="#000000">(비디오·카메라)</text>

  <rect x="460" y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="525" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">objdetect</text>
  <text x="525" y="196" text-anchor="middle" font-size="10" fill="#000000">(얼굴·객체검출)</text>

  <rect x="610" y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="675" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">dnn</text>
  <text x="675" y="196" text-anchor="middle" font-size="10" fill="#000000">(딥러닝 추론)</text>

  <rect x="760" y="155" width="130" height="58" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="825" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">features2d</text>
  <text x="825" y="196" text-anchor="middle" font-size="10" fill="#000000">(특징점 매칭)</text>

  <!-- modules -> bus2 -->
  <line x1="75"  y1="213" x2="75"  y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="225" y1="213" x2="225" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="375" y1="213" x2="375" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="525" y1="213" x2="525" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="675" y1="213" x2="675" y2="240" stroke="#000000" stroke-width="1.5"/>
  <line x1="825" y1="213" x2="825" y2="240" stroke="#000000" stroke-width="1.5"/>

  <!-- bus2 -->
  <line x1="10" y1="240" x2="870" y2="240" stroke="#000000" stroke-width="1.5"/>

  <!-- bus2 -> application boxes -->
  <line x1="75"  y1="240" x2="75"  y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="240" x2="225" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="240" x2="375" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="525" y1="240" x2="525" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="240" x2="675" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="240" x2="825" y2="265" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Application domain row -->
  <rect x="10"  y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="75"  y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">산업 자동화 검사</text>
  <text x="75"  y="306" text-anchor="middle" font-size="10" fill="#000000">(불량품 검출)</text>

  <rect x="160" y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="225" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">의료 영상 분석</text>
  <text x="225" y="306" text-anchor="middle" font-size="10" fill="#000000">(세포·병변 분석)</text>

  <rect x="310" y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="375" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">자율주행</text>
  <text x="375" y="306" text-anchor="middle" font-size="10" fill="#000000">(차선·객체 인식)</text>

  <rect x="460" y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="525" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">AR / VR</text>
  <text x="525" y="306" text-anchor="middle" font-size="10" fill="#000000">(평면 인식·추적)</text>

  <rect x="610" y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="675" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">보안·감시</text>
  <text x="675" y="306" text-anchor="middle" font-size="10" fill="#000000">(사람 계수·이상행동)</text>

  <rect x="760" y="265" width="130" height="62" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="825" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">로보틱스</text>
  <text x="825" y="306" text-anchor="middle" font-size="10" fill="#000000">(비전 기반 제어)</text>

  <!-- Caption -->
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#000000">opencv-python은 NumPy 배열로 이미지를 표현하며, 핵심 모듈들을 통해 다양한 산업 분야에 적용됩니다.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

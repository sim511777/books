<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">OpenCV의 세 언어 바인딩 구조</text>

  <!-- Application layer boxes -->
  <rect x="40" y="60" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-size="15" fill="#000000">Python 애플리케이션</text>

  <rect x="260" y="60" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-size="15" fill="#000000">C++ 애플리케이션</text>

  <rect x="480" y="60" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="570" y="90" text-anchor="middle" font-size="15" fill="#000000">C# 애플리케이션</text>

  <!-- Binding layer boxes -->
  <rect x="40" y="170" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="130" y="195" text-anchor="middle" font-size="14" fill="#000000">opencv-python</text>
  <text x="130" y="215" text-anchor="middle" font-size="12" fill="#000000">(Python 바인딩)</text>

  <rect x="480" y="170" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="570" y="195" text-anchor="middle" font-size="14" fill="#000000">OpenCvSharp</text>
  <text x="570" y="215" text-anchor="middle" font-size="12" fill="#000000">(C# 바인딩)</text>

  <!-- Core box -->
  <rect x="220" y="290" width="260" height="70" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="350" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">OpenCV 코어 라이브러리</text>
  <text x="350" y="338" text-anchor="middle" font-size="13" fill="#000000">(C/C++로 작성된 원본)</text>

  <!-- Arrows: Python app -> python binding -->
  <line x1="130" y1="110" x2="130" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C++ app -> core directly -->
  <line x1="350" y1="110" x2="350" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C# app -> csharp binding -->
  <line x1="570" y1="110" x2="570" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Python binding -> core -->
  <line x1="180" y1="230" x2="290" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C# binding -> core -->
  <line x1="520" y1="230" x2="410" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

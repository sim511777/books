<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">어파인 변환과 원근 변환 비교</text>

  <!-- 원본 이미지 (좌측) -->
  <g transform="translate(40,90)">
    <text x="70" y="-14" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">원본</text>
    <rect x="0" y="0" width="140" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- 코너 표시 -->
    <circle cx="0" cy="0" r="4" fill="#000000"/>
    <circle cx="140" cy="0" r="4" fill="#000000"/>
    <circle cx="0" cy="140" r="4" fill="#000000"/>
    <circle cx="140" cy="140" r="4" fill="#000000"/>
    <text x="-10" y="-8" text-anchor="middle" font-size="11" fill="#000000">A</text>
    <text x="150" y="-8" text-anchor="middle" font-size="11" fill="#000000">B</text>
    <text x="-10" y="152" text-anchor="middle" font-size="11" fill="#000000">D</text>
    <text x="150" y="152" text-anchor="middle" font-size="11" fill="#000000">C</text>
    <!-- 격자 -->
    <line x1="46.6" y1="0" x2="46.6" y2="140" stroke="#000000" stroke-width="0.6"/>
    <line x1="93.3" y1="0" x2="93.3" y2="140" stroke="#000000" stroke-width="0.6"/>
    <line x1="0" y1="46.6" x2="140" y2="46.6" stroke="#000000" stroke-width="0.6"/>
    <line x1="0" y1="93.3" x2="140" y2="93.3" stroke="#000000" stroke-width="0.6"/>
  </g>

  <!-- 어파인 변환 결과 (중앙) -->
  <g transform="translate(300,90)">
    <text x="80" y="-14" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">어파인 변환</text>
    <text x="80" y="-2" text-anchor="middle" font-size="10" fill="#333333">(평행선 유지: 평행사변형)</text>
    <!-- 평행사변형: 위쪽으로 밀리고 회전된 모양 -->
    <polygon points="20,20 150,0 170,140 40,160" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#000000"/>
    <circle cx="150" cy="0" r="4" fill="#000000"/>
    <circle cx="170" cy="140" r="4" fill="#000000"/>
    <circle cx="40" cy="160" r="4" fill="#000000"/>
    <text x="10" y="12" text-anchor="middle" font-size="11" fill="#000000">A'</text>
    <text x="158" y="-6" text-anchor="middle" font-size="11" fill="#000000">B'</text>
    <text x="180" y="150" text-anchor="middle" font-size="11" fill="#000000">C'</text>
    <text x="30" y="172" text-anchor="middle" font-size="11" fill="#000000">D'</text>
    <!-- 격자(어파인 변형 반영한 근사 평행선) -->
    <line x1="63.3" y1="13.3" x2="83.3" y2="153.3" stroke="#000000" stroke-width="0.6"/>
    <line x1="106.6" y1="6.6" x2="126.6" y2="146.6" stroke="#000000" stroke-width="0.6"/>
    <line x1="26.6" y1="66.6" x2="163.3" y2="46.6" stroke="#000000" stroke-width="0.6"/>
    <line x1="33.3" y1="113.3" x2="166.6" y2="93.3" stroke="#000000" stroke-width="0.6"/>
  </g>

  <!-- 원근 변환 결과 (우측) -->
  <g transform="translate(530,90)">
    <text x="70" y="-14" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">원근 변환</text>
    <text x="70" y="-2" text-anchor="middle" font-size="10" fill="#333333">(사다리꼴로 왜곡 가능)</text>
    <!-- 사다리꼴: 원근에 의해 위쪽이 좁아짐 -->
    <polygon points="35,0 125,0 155,140 5,140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="35" cy="0" r="4" fill="#000000"/>
    <circle cx="125" cy="0" r="4" fill="#000000"/>
    <circle cx="155" cy="140" r="4" fill="#000000"/>
    <circle cx="5" cy="140" r="4" fill="#000000"/>
    <text x="25" y="-8" text-anchor="middle" font-size="11" fill="#000000">A''</text>
    <text x="135" y="-8" text-anchor="middle" font-size="11" fill="#000000">B''</text>
    <text x="165" y="150" text-anchor="middle" font-size="11" fill="#000000">C''</text>
    <text x="-5" y="150" text-anchor="middle" font-size="11" fill="#000000">D''</text>
    <!-- 격자(원근 소실점 방향으로 모이는 선) -->
    <line x1="65" y1="0" x2="55" y2="140" stroke="#000000" stroke-width="0.6"/>
    <line x1="95" y1="0" x2="105" y2="140" stroke="#000000" stroke-width="0.6"/>
    <line x1="35" y1="35" x2="125" y2="35" stroke="#000000" stroke-width="0.6"/>
    <line x1="24" y1="85" x2="136" y2="85" stroke="#000000" stroke-width="0.6"/>
  </g>

  <!-- 화살표: 원본 -> 어파인 -->
  <line x1="192" y1="150" x2="292" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="140" text-anchor="middle" font-size="10" fill="#000000">warpAffine</text>

  <!-- 화살표: 원본 -> 원근 (아래쪽 우회 경로로 표현) -->
  <path d="M 110 250 C 250 320, 450 320, 590 250" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="325" text-anchor="middle" font-size="10" fill="#000000">warpPerspective</text>

  <!-- 하단 설명 박스 -->
  <g transform="translate(70,345)">
    <rect x="0" y="0" width="560" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="280" y="18" text-anchor="middle" font-size="11" fill="#000000">어파인 변환: 3개의 점 대응, 직선의 평행 관계가 보존된다 (이동·회전·크기·기울임)</text>
    <text x="280" y="35" text-anchor="middle" font-size="11" fill="#000000">원근 변환: 4개의 점 대응, 평행선도 한 점에서 만나도록 왜곡될 수 있다 (기울어진 문서 펴기 등)</text>
  </g>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">이미지의 3차원 배열 구조: 높이(Height) × 너비(Width) × 채널(Channel)</text>

  <!-- B, G, R 세 개의 층을 겹쳐서 표현 -->
  <!-- 뒤쪽(B 채널) -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- 격자선 -->
    <line x1="55" y1="0" x2="55" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="165" y1="0" x2="165" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="100" x2="220" y2="100" stroke="#000000" stroke-width="1"/>
    <text x="110" y="-8" text-anchor="middle" font-size="12" fill="#000000">채널 0 (B)</text>
  </g>

  <!-- 중간(G 채널) -->
  <g transform="translate(120,110)">
    <rect x="0" y="0" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="55" y1="0" x2="55" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="165" y1="0" x2="165" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="100" x2="220" y2="100" stroke="#000000" stroke-width="1"/>
    <text x="110" y="-8" text-anchor="middle" font-size="12" fill="#000000">채널 1 (G)</text>
  </g>

  <!-- 앞쪽(R 채널) -->
  <g transform="translate(150,70)">
    <rect x="0" y="0" width="220" height="150" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <line x1="55" y1="0" x2="55" y2="150" stroke="#000000" stroke-width="1.2"/>
    <line x1="110" y1="0" x2="110" y2="150" stroke="#000000" stroke-width="1.2"/>
    <line x1="165" y1="0" x2="165" y2="150" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="100" x2="220" y2="100" stroke="#000000" stroke-width="1.2"/>
    <text x="110" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">채널 2 (R)</text>

    <!-- 픽셀 하나 강조 -->
    <rect x="55" y="50" width="55" height="50" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
    <text x="82" y="80" text-anchor="middle" font-size="11" fill="#000000">[1,1]</text>

    <!-- 축 라벨 -->
    <text x="-20" y="80" text-anchor="middle" font-size="12" fill="#000000" transform="rotate(-90 -20 80)">행 (Height)</text>
    <text x="110" y="172" text-anchor="middle" font-size="12" fill="#000000">열 (Width)</text>
  </g>

  <!-- 화살표: 강조 픽셀에서 값 설명으로 -->
  <line x1="282" y1="170" x2="420" y2="170" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 픽셀 값 설명 박스 -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="220" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">픽셀 하나 = 채널 값 배열</text>
    <text x="110" y="45" text-anchor="middle" font-size="12" fill="#000000">img[1, 1] = [B, G, R]</text>
    <text x="110" y="65" text-anchor="middle" font-size="12" fill="#000000">예: [255, 0, 0] (파란색)</text>
    <text x="110" y="85" text-anchor="middle" font-size="11" fill="#000000">각 값은 0~255 (uint8, 1바이트)</text>
  </g>

  <!-- 하단 shape 설명 -->
  <g transform="translate(90,330)">
    <rect x="0" y="0" width="520" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="260" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">shape = (rows, cols, channels) = (높이, 너비, 채널 수)</text>
    <text x="260" y="42" text-anchor="middle" font-size="12" fill="#000000">예: img.shape == (480, 640, 3)  →  세로 480, 가로 640, 3채널(BGR)</text>
  </g>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

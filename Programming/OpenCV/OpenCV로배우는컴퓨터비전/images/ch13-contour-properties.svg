<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">하나의 컨투어에서 얻을 수 있는 네 가지 특성</text>

  <!-- 최소 외접원 (바깥쪽 점선 원) -->
  <circle cx="300" cy="215" r="130" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#000000">minEnclosingCircle (최소 외접원)</text>

  <!-- 경계 사각형 -->
  <rect x="190" y="120" width="220" height="190" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,4"/>
  <text x="410" y="130" text-anchor="start" font-size="12" fill="#000000">boundingRect</text>
  <text x="410" y="146" text-anchor="start" font-size="12" fill="#000000">(경계 사각형)</text>

  <!-- 별 모양 컨투어 (실선, 굵게) -->
  <polygon points="300,140 325,195 385,200 338,238 355,298 300,265 245,298 262,238 215,200 275,195"
           fill="#e0e0e0" stroke="#000000" stroke-width="2.5"/>

  <!-- 컨투어(둘레/면적) 라벨 -->
  <line x1="300" y1="215" x2="345" y2="215" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="212" text-anchor="middle" font-size="11" fill="#000000">면적</text>

  <g transform="translate(90,340)">
    <rect x="0" y="0" width="520" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="260" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">contourArea(면적) &lt; boundingRect의 넓이(w×h) &lt; minEnclosingCircle의 넓이</text>
    <text x="260" y="40" text-anchor="middle" font-size="11" fill="#000000">arcLength는 별 모양 실선 둘레의 실제 길이를 의미</text>
  </g>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

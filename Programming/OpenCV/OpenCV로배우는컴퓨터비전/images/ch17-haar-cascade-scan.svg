<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="430" fill="#ffffff" stroke="none"/>

  <!-- 제목 -->
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Haar Cascade의 슬라이딩 윈도우 + 스케일 피라미드 검색</text>

  <!-- ===== 왼쪽 패널: 같은 크기 윈도우가 슬라이딩 ===== -->
  <g transform="translate(30,55)">
    <rect x="0" y="0" width="300" height="300" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="150" y="-8" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">1. 같은 크기 윈도우를 이동시키며 검사</text>

    <!-- 얼굴(추상화된 실루엣) -->
    <circle cx="165" cy="170" r="55" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="148" cy="158" r="5" fill="#000000"/>
    <circle cx="182" cy="158" r="5" fill="#000000"/>
    <path d="M 142 190 Q 165 205 188 190" fill="none" stroke="#000000" stroke-width="2"/>

    <!-- 슬라이딩 윈도우: 배경을 지나가는 경로 -->
    <rect x="20" y="30" width="60" height="60" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="95" y="30" width="60" height="60" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="170" y="30" width="60" height="60" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- 얼굴 위에 온 윈도우: 매칭되어 실선으로 강조 -->
    <rect x="135" y="140" width="60" height="60" fill="none" stroke="#000000" stroke-width="2.5"/>
    <text x="165" y="132" text-anchor="middle" font-size="10" fill="#000000">일치</text>

    <!-- 이동 경로 화살표 -->
    <line x1="80" y1="60" x2="93" y2="60" stroke="#000000" stroke-width="1.2" marker-end="url(#arrowSmall)"/>
    <line x1="155" y1="60" x2="168" y2="60" stroke="#000000" stroke-width="1.2" marker-end="url(#arrowSmall)"/>
    <path d="M 230 90 C 260 110, 260 130, 195 145" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowSmall)"/>

    <text x="150" y="285" text-anchor="middle" font-size="11" fill="#000000">왼쪽 위 → 오른쪽 아래로 한 칸씩 이동</text>
  </g>

  <!-- ===== 오른쪽 패널: 여러 스케일로 반복 ===== -->
  <g transform="translate(370,55)">
    <rect x="0" y="0" width="300" height="300" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="150" y="-8" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">2. 여러 크기(스케일)로 반복 검사</text>

    <!-- 얼굴(추상화된 실루엣) -->
    <circle cx="150" cy="170" r="55" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="133" cy="158" r="5" fill="#000000"/>
    <circle cx="167" cy="158" r="5" fill="#000000"/>
    <path d="M 127 190 Q 150 205 173 190" fill="none" stroke="#000000" stroke-width="2"/>

    <!-- 서로 다른 크기의 윈도우 3개: 작음/중간/큼, 얼굴을 중심으로 -->
    <rect x="120" y="140" width="60" height="60" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="105" y="125" width="90" height="90" fill="none" stroke="#000000" stroke-width="2.5"/>
    <rect x="85" y="105" width="130" height="130" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3"/>

    <text x="150" y="270" text-anchor="middle" font-size="11" fill="#000000">scaleFactor 만큼 윈도우 크기를 키워가며 재검사</text>
    <text x="150" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">(굵은 사각형 = 얼굴 크기에 들어맞는 스케일)</text>
  </g>

  <!-- ===== 하단 결과 요약 바 ===== -->
  <g transform="translate(30,375)">
    <rect x="0" y="0" width="640" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="320" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">여러 위치·스케일에서 겹쳐서 나온 후보들을 minNeighbors 기준으로 묶어 최종 사각형만 채택</text>
    <text x="320" y="36" text-anchor="middle" font-size="11" fill="#000000">detectMultiScale() → [x, y, w, h] 목록</text>
  </g>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrowSmall" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

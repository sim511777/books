<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="white"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="bold">ImGui 프레임 루프</text>

  <!-- Top box: NewFrame -->
  <rect x="270" y="55" width="160" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="350" y="78" text-anchor="middle" font-size="12" font-weight="bold">NewFrame</text>
  <text x="350" y="94" text-anchor="middle" font-size="10">Impl_OpenGL3 / Impl_Glfw</text>
  <text x="350" y="106" text-anchor="middle" font-size="10">/ ImGui::NewFrame()</text>

  <!-- Right box: UI code -->
  <rect x="480" y="165" width="170" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="565" y="188" text-anchor="middle" font-size="12" font-weight="bold">UI 코드 작성</text>
  <text x="565" y="204" text-anchor="middle" font-size="10">Begin / Text / Button / End</text>

  <!-- Bottom box: Render -->
  <rect x="270" y="275" width="160" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="350" y="298" text-anchor="middle" font-size="12" font-weight="bold">Render</text>
  <text x="350" y="314" text-anchor="middle" font-size="10">ImGui::Render()</text>

  <!-- Left box: Display -->
  <rect x="50" y="165" width="170" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="135" y="188" text-anchor="middle" font-size="12" font-weight="bold">화면 출력</text>
  <text x="135" y="204" text-anchor="middle" font-size="10">RenderDrawData /</text>
  <text x="135" y="216" text-anchor="middle" font-size="10">SwapBuffers</text>

  <!-- Arrows forming a cycle: top -> right -> bottom -> left -> top -->
  <path d="M 430 90 C 500 100 500 140 500 165" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M 565 220 C 565 260 450 275 430 285" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M 270 300 C 200 290 135 260 135 220" fill="none" stroke="black" marker-end="url(#arrow2)"/>
  <path d="M 135 165 C 135 130 220 100 270 88" fill="none" stroke="black" marker-end="url(#arrow2)"/>

  <text x="350" y="365" text-anchor="middle" font-size="11">이 네 단계가 창이 닫힐 때까지 매 프레임 반복됩니다</text>
</svg>

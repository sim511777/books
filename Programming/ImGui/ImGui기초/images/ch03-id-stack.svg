<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="700" height="420" fill="white" stroke="none"/>

  <!-- 제목 -->
  <text x="350" y="28" font-size="16" text-anchor="middle" fill="black" font-weight="bold">for 루프 안에서 PushID / PopID로 ID를 구분하는 과정</text>

  <!-- 왼쪽: 반복문 코드 요약 박스 -->
  <rect x="20" y="55" width="230" height="150" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="30" y="75" font-size="12" fill="black" font-weight="bold">for (int i = 0; i &lt; 3; i++) {</text>
  <text x="40" y="95" font-size="12" fill="black">ImGui::PushID(i);</text>
  <text x="40" y="115" font-size="12" fill="black">if (ImGui::Button("삭제"))</text>
  <text x="52" y="133" font-size="12" fill="black">{ ... }</text>
  <text x="40" y="153" font-size="12" fill="black">ImGui::PopID();</text>
  <text x="30" y="173" font-size="12" fill="black">}</text>

  <!-- 화살표: 코드 -> ID 스택 -->
  <line x1="250" y1="130" x2="300" y2="130" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 가운데: ID 스택 3개 반복 표현 -->
  <!-- 반복 1 -->
  <g>
    <rect x="310" y="60" width="120" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="370" y="84" font-size="12" text-anchor="middle" fill="black">PushID(0)</text>
    <rect x="450" y="60" width="140" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="520" y="78" font-size="11" text-anchor="middle" fill="black">내부 ID =</text>
    <text x="520" y="93" font-size="11" text-anchor="middle" fill="black">hash("삭제", 0)</text>
  </g>

  <!-- 반복 2 -->
  <g>
    <rect x="310" y="115" width="120" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="370" y="139" font-size="12" text-anchor="middle" fill="black">PushID(1)</text>
    <rect x="450" y="115" width="140" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="520" y="133" font-size="11" text-anchor="middle" fill="black">내부 ID =</text>
    <text x="520" y="148" font-size="11" text-anchor="middle" fill="black">hash("삭제", 1)</text>
  </g>

  <!-- 반복 3 -->
  <g>
    <rect x="310" y="170" width="120" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="370" y="194" font-size="12" text-anchor="middle" fill="black">PushID(2)</text>
    <rect x="450" y="170" width="140" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="520" y="188" font-size="11" text-anchor="middle" fill="black">내부 ID =</text>
    <text x="520" y="203" font-size="11" text-anchor="middle" fill="black">hash("삭제", 2)</text>
  </g>

  <!-- 각 PushID -> 내부 ID 화살표 -->
  <line x1="430" y1="80" x2="450" y2="80" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="135" x2="450" y2="135" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="190" x2="450" y2="190" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 하단: 화면에는 같은 라벨의 버튼 3개가 표시됨 -->
  <text x="350" y="245" font-size="13" text-anchor="middle" fill="black" font-weight="bold">화면에 그려지는 결과 (라벨은 모두 "삭제"로 동일)</text>

  <rect x="230" y="265" width="90" height="34" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="275" y="287" font-size="12" text-anchor="middle" fill="black">삭제</text>

  <rect x="330" y="265" width="90" height="34" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="375" y="287" font-size="12" text-anchor="middle" fill="black">삭제</text>

  <rect x="430" y="265" width="90" height="34" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="475" y="287" font-size="12" text-anchor="middle" fill="black">삭제</text>

  <text x="275" y="315" font-size="10" text-anchor="middle" fill="black">ID: hash(0)</text>
  <text x="375" y="315" font-size="10" text-anchor="middle" fill="black">ID: hash(1)</text>
  <text x="475" y="315" font-size="10" text-anchor="middle" fill="black">ID: hash(2)</text>

  <!-- 연결선: 위 ID 박스 -> 아래 버튼 -->
  <line x1="520" y1="100" x2="275" y2="265" stroke="black" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="520" y1="155" x2="375" y2="265" stroke="black" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="520" y1="210" x2="475" y2="265" stroke="black" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- 설명 박스 -->
  <rect x="60" y="345" width="580" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="350" y="365" font-size="11" text-anchor="middle" fill="black">라벨 문자열("삭제")은 동일하지만, PushID(i)가 스택에 쌓은 정수 i가 라벨과 함께</text>
  <text x="350" y="382" font-size="11" text-anchor="middle" fill="black">해시되어 서로 다른 내부 ID를 만든다. 그 결과 각 버튼은 독립적으로 클릭/포커스 상태를 유지한다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>
</svg>

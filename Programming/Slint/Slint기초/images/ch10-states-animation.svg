<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- normal state box -->
  <rect x="60" y="110" width="200" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">normal 상태</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#000000">background: gray</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#000000">touch-area.pressed: false</text>

  <!-- pressed state box -->
  <rect x="440" y="110" width="200" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="540" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">pressed 상태</text>
  <text x="540" y="172" text-anchor="middle" font-size="12" fill="#000000">background: blue</text>
  <text x="540" y="190" text-anchor="middle" font-size="12" fill="#000000">touch-area.pressed: true</text>

  <!-- forward arrow (normal -> pressed) -->
  <line x1="260" y1="145" x2="435" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="130" text-anchor="middle" font-size="13" fill="#000000">when 조건이 참이 됨</text>

  <!-- backward arrow (pressed -> normal) -->
  <line x1="440" y1="180" x2="265" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="200" text-anchor="middle" font-size="13" fill="#000000">animate</text>

  <!-- animate label bracket over both arrows -->
  <text x="350" y="240" text-anchor="middle" font-size="13" font-style="italic" fill="#000000">두 상태 사이의 background 값 변화는 animate로 부드럽게 전환됩니다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- footer note -->
  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#000000">상태 전환은 조건식(when)에 따라 자동으로 일어나고, animate가 그 전환을 애니메이션으로 만듭니다</text>
</svg>

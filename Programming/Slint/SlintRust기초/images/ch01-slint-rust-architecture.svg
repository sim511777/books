<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Slint Core and Its Language Bindings</text>

  <!-- Rust binding: most direct -->
  <rect x="300" y="50" width="160" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="380" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Rust binding</text>
  <text x="380" y="93" text-anchor="middle" font-size="11" fill="#000000">direct - same language</text>

  <text x="380" y="126" text-anchor="middle" font-size="11" font-style="italic" fill="#000000">(covered in this book)</text>

  <!-- Arrow: core to Rust binding, thick, direct, no FFI box in between -->
  <line x1="380" y1="215" x2="380" y2="112" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="165" text-anchor="middle" font-size="10" fill="#000000">no FFI needed</text>

  <!-- Slint Core -->
  <rect x="280" y="215" width="200" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="380" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Slint Core</text>
  <text x="380" y="266" text-anchor="middle" font-size="12" fill="#000000">(written in Rust)</text>
  <text x="380" y="284" text-anchor="middle" font-size="11" fill="#000000">.slint compiler + renderer</text>

  <!-- Arrow: core down to FFI layer -->
  <line x1="380" y1="295" x2="380" y2="358" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FFI layer -->
  <rect x="230" y="358" width="300" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#000000">FFI / language bridge layer</text>

  <!-- C++ binding -->
  <rect x="40" y="450" width="160" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="120" y="482" text-anchor="middle" font-size="14" fill="#000000">C++ binding</text>

  <!-- JS binding -->
  <rect x="300" y="450" width="160" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="380" y="474" text-anchor="middle" font-size="14" fill="#000000">JavaScript</text>
  <text x="380" y="491" text-anchor="middle" font-size="11" fill="#000000">(Node.js) binding</text>

  <!-- Python binding -->
  <rect x="560" y="450" width="160" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="640" y="482" text-anchor="middle" font-size="14" fill="#000000">Python binding</text>

  <!-- arrows from FFI layer to each non-Rust binding -->
  <line x1="300" y1="400" x2="140" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="408" x2="380" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="400" x2="620" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>

  <text x="380" y="528" text-anchor="middle" font-size="11" fill="#000000">The Rust binding calls the core's Rust API directly; the other bindings cross an FFI boundary.</text>
</svg>

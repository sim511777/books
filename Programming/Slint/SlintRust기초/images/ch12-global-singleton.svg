<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Multiple components sharing one global singleton</text>

  <!-- Central global -->
  <rect x="265" y="170" width="170" height="80" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="350" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">global Theme</text>
  <text x="350" y="215" text-anchor="middle" font-size="11" fill="#2c3e50">dark-mode: bool</text>
  <text x="350" y="230" text-anchor="middle" font-size="11" fill="#2c3e50">callback toggle-dark-mode()</text>

  <!-- Screen A: Sidebar -->
  <rect x="40" y="40" width="170" height="80" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="125" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Sidebar</text>
  <text x="125" y="86" text-anchor="middle" font-size="11" fill="#2c3e50">reads Theme.dark-mode</text>
  <text x="125" y="102" text-anchor="middle" font-size="11" fill="#2c3e50">for background color</text>

  <!-- Screen B: ContentArea -->
  <rect x="490" y="40" width="170" height="80" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="575" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">ContentArea</text>
  <text x="575" y="86" text-anchor="middle" font-size="11" fill="#2c3e50">reads Theme.dark-mode</text>
  <text x="575" y="102" text-anchor="middle" font-size="11" fill="#2c3e50">for text color</text>

  <!-- Screen C: SettingsPanel -->
  <rect x="265" y="330" width="170" height="80" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="350" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SettingsPanel</text>
  <text x="350" y="376" text-anchor="middle" font-size="11" fill="#2c3e50">Switch calls</text>
  <text x="350" y="392" text-anchor="middle" font-size="11" fill="#2c3e50">Theme.toggle-dark-mode()</text>

  <!-- Arrows: bidirectional between each screen and global -->
  <line x1="185" y1="115" x2="300" y2="178" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow12)" marker-start="url(#arrow12start)"/>
  <line x1="515" y1="115" x2="400" y2="178" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow12)" marker-start="url(#arrow12start)"/>
  <line x1="350" y1="250" x2="350" y2="326" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow12)" marker-start="url(#arrow12start)"/>

  <!-- Rust side note -->
  <rect x="480" y="250" width="180" height="60" rx="8" fill="#f5f7fa" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="570" y="272" text-anchor="middle" font-size="11" fill="#2c3e50">Rust: ui.global::&lt;Theme&gt;()</text>
  <text x="570" y="288" text-anchor="middle" font-size="11" fill="#2c3e50">.get_dark_mode() / .set_dark_mode(v)</text>
  <text x="570" y="304" text-anchor="middle" font-size="11" fill="#2c3e50">.on_toggle_dark_mode(handler)</text>
  <line x1="480" y1="270" x2="435" y2="230" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow12)"/>

  <text x="350" y="415" text-anchor="middle" font-size="11" fill="#555555">Each screen reads Theme.dark-mode directly; no props are passed between screens.</text>

  <defs>
    <marker id="arrow12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow12start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Slint + Rust Build and Run Flow</text>

  <!-- Step 1: .slint file -->
  <rect x="15" y="70" width="115" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="72" y="95" text-anchor="middle" font-size="12" fill="#000000">app-window</text>
  <text x="72" y="112" text-anchor="middle" font-size="12" fill="#000000">.slint</text>

  <!-- Step 2: build.rs -->
  <rect x="150" y="70" width="120" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="210" y="92" text-anchor="middle" font-size="11" fill="#000000">build.rs</text>
  <text x="210" y="109" text-anchor="middle" font-size="10" fill="#000000">slint_build::compile()</text>

  <!-- Step 3: OUT_DIR generated code -->
  <rect x="295" y="70" width="130" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#000000">OUT_DIR</text>
  <text x="360" y="109" text-anchor="middle" font-size="10" fill="#000000">generated .rs code</text>

  <!-- Step 4: include_modules!() -->
  <rect x="450" y="70" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="525" y="92" text-anchor="middle" font-size="11" fill="#000000">include_modules!()</text>
  <text x="525" y="109" text-anchor="middle" font-size="10" fill="#000000">in src/main.rs</text>

  <!-- Step 5: new() -->
  <rect x="625" y="70" width="150" height="60" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" fill="#000000">AppWindow::new()</text>
  <text x="700" y="106" text-anchor="middle" font-size="10" fill="#000000">Result&lt;Self, PlatformError&gt;</text>
  <text x="700" y="121" text-anchor="middle" font-size="10" fill="#000000">(ComponentHandle)</text>

  <!-- Arrows row1 -->
  <line x1="130" y1="100" x2="146" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>
  <line x1="270" y1="100" x2="291" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>
  <line x1="425" y1="100" x2="446" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>
  <line x1="600" y1="100" x2="621" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <!-- down arrow to run() -->
  <line x1="700" y1="130" x2="700" y2="176" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <!-- Step 6: ui.run() -->
  <rect x="605" y="180" width="190" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="700" y="203" text-anchor="middle" font-size="12" fill="#000000">ui.run()</text>
  <text x="700" y="220" text-anchor="middle" font-size="10" fill="#000000">show window, start event loop</text>

  <!-- arrow left to event loop -->
  <line x1="605" y1="207" x2="394" y2="207" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <!-- Step 7: event loop (blocking) -->
  <rect x="160" y="175" width="230" height="65" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="275" y="197" text-anchor="middle" font-size="12" fill="#000000">event loop</text>
  <text x="275" y="213" text-anchor="middle" font-size="10" fill="#000000">handle user input, callbacks</text>
  <text x="275" y="228" text-anchor="middle" font-size="10" fill="#000000">(run() blocks here)</text>

  <!-- self loop arrow -->
  <path d="M160,190 C128,190 128,225 160,225" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <!-- arrow down to closed -->
  <line x1="275" y1="240" x2="275" y2="286" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <!-- Step 8: window closed -->
  <rect x="160" y="290" width="230" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="275" y="313" text-anchor="middle" font-size="12" fill="#000000">window closed</text>
  <text x="275" y="330" text-anchor="middle" font-size="10" fill="#000000">run() returns Ok(())</text>

  <!-- Step 9: cleanup -->
  <rect x="430" y="290" width="280" height="55" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="570" y="308" text-anchor="middle" font-size="12" fill="#000000">ui dropped, refcount decreases</text>
  <text x="570" y="325" text-anchor="middle" font-size="10" fill="#000000">main() exits</text>

  <line x1="390" y1="317" x2="426" y2="317" stroke="#000000" stroke-width="2" marker-end="url(#arrow7r)"/>

  <defs>
    <marker id="arrow7r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

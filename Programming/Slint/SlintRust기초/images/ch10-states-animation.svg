<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">states + animate: two ways to trigger the same transition</text>

  <!-- Divider -->
  <line x1="480" y1="55" x2="480" y2="430" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Left column label -->
  <text x="240" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a237e">UI-driven trigger (TouchArea)</text>

  <!-- normal state -->
  <rect x="150" y="95" width="180" height="70" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
  <text x="240" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">normal</text>
  <text x="240" y="140" text-anchor="middle" font-size="11" fill="#333333">background: #757575</text>
  <text x="240" y="155" text-anchor="middle" font-size="10" fill="#666666">has-hover: false, pressed: false</text>

  <!-- hover state -->
  <rect x="150" y="200" width="180" height="70" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="240" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">hover</text>
  <text x="240" y="245" text-anchor="middle" font-size="11" fill="#333333">background: #3949ab</text>
  <text x="240" y="260" text-anchor="middle" font-size="10" fill="#666666">when touch-area.has-hover</text>

  <!-- pressed state -->
  <rect x="150" y="305" width="180" height="70" rx="8" fill="#c5cae9" stroke="#1a237e" stroke-width="2"/>
  <text x="240" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">pressed</text>
  <text x="240" y="350" text-anchor="middle" font-size="11" fill="#333333">background: #1a237e</text>
  <text x="240" y="365" text-anchor="middle" font-size="10" fill="#666666">when touch-area.pressed</text>

  <!-- arrows normal <-> hover -->
  <line x1="240" y1="165" x2="240" y2="197" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="180" text-anchor="start" font-size="10" fill="#333333">in: 150ms ease-out</text>
  <line x1="220" y1="200" x2="220" y2="168" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="192" text-anchor="start" font-size="10" fill="#333333">out: 150ms ease-out</text>

  <!-- arrows hover <-> pressed -->
  <line x1="240" y1="270" x2="240" y2="302" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="285" text-anchor="start" font-size="10" fill="#333333">in: 80ms ease-in</text>
  <line x1="220" y1="305" x2="220" y2="273" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="297" text-anchor="start" font-size="10" fill="#333333">out: 200ms ease-out</text>

  <!-- Right column label -->
  <text x="720" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">Rust-driven trigger (property set)</text>

  <!-- Rust box -->
  <rect x="620" y="95" width="200" height="55" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="720" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Rust: main.rs</text>
  <text x="720" y="135" text-anchor="middle" font-size="11" fill="#333333">ui.set_has_alert(true)</text>

  <line x1="720" y1="150" x2="720" y2="180" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- property box -->
  <rect x="620" y="182" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
  <text x="720" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">in-out property has-alert</text>
  <text x="720" y="220" text-anchor="middle" font-size="10" fill="#666666">false -&gt; true</text>

  <line x1="720" y1="232" x2="720" y2="262" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- states box -->
  <rect x="620" y="264" width="200" height="55" rx="6" fill="#c5cae9" stroke="#1a237e" stroke-width="2"/>
  <text x="720" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">states: shown</text>
  <text x="720" y="303" text-anchor="middle" font-size="10" fill="#333333">when has-alert</text>

  <line x1="720" y1="319" x2="720" y2="349" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- animate box -->
  <rect x="620" y="351" width="200" height="55" rx="6" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="720" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">animate opacity</text>
  <text x="720" y="390" text-anchor="middle" font-size="10" fill="#333333">duration: 300ms, ease-out-back</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="480" y="445" text-anchor="middle" font-size="12" fill="#333333">Either trigger only decides WHEN a condition becomes true; states + animate decide HOW the value moves.</text>
</svg>

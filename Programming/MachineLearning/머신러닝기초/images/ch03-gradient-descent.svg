<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
<title>Gradient descent walking down a loss curve</title>
<desc>A U-shaped loss curve. Starting from a high point on the left, gradient descent takes steps toward the minimum. Steps get shorter as the slope flattens.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
<text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Gradient descent: walking down the loss curve</text>
<line x1="70" y1="330" x2="610" y2="330" stroke="#374151" stroke-width="1.5"/>
<line x1="70" y1="330" x2="70" y2="46" stroke="#374151" stroke-width="1.5"/>
<text x="340" y="372" text-anchor="middle" font-size="14" fill="#374151">w (model parameter)</text>
<text x="22" y="190" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 22 190)">Loss (MSE)</text>
<line x1="334.0" y1="330.0" x2="334.0" y2="213.0" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="334.0" y="350" text-anchor="middle" font-size="13" fill="#15803d">best w (minimum)</text>

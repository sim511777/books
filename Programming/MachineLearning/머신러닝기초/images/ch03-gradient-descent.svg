<text x="115.0" y="103.5" font-size="13" font-weight="bold" fill="#9a3412">start (w0)</text>
<text x="182.3" y="213.0" font-size="13" fill="#9a3412">w1</text>
<text x="230.8" y="268.1" font-size="13" fill="#9a3412">w2</text>
<text x="264.8" y="295.1" font-size="13" fill="#9a3412">w3</text>
<text x="289.8" y="191.9" text-anchor="middle" font-size="12" fill="#4b5563">near the minimum:</text>
<text x="289.8" y="206.9" text-anchor="middle" font-size="12" fill="#4b5563">slope ~ 0, tiny steps</text>
<line x1="306.8" y1="216.9" x2="306.8" y2="312.9" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="215" y="62" width="250" height="52" rx="6" fill="#fff7ed" stroke="#fdba74"/>
<text x="340" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">w_new = w - lr x slope</text>
<text x="340" y="104" text-anchor="middle" font-size="12" fill="#7c2d12">(lr = learning rate, slope = gradient)</text>
</svg>

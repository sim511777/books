<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">Types of Machine Learning</text>

  <!-- root -->
  <rect x="380" y="52" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="480" y="80" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Machine Learning</text>

  <!-- connectors: root -> categories -->
  <g fill="none" stroke="#6b7280" stroke-width="2">
    <path d="M480 96 V122 H165 V148"/>
    <path d="M480 96 V148"/>
    <path d="M480 96 V122 H795 V148"/>
  </g>

  <!-- category boxes -->
  <rect x="30" y="148" width="270" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Supervised Learning</text>
  <text x="165" y="196" font-size="13" text-anchor="middle" fill="#111827">learns from labeled data</text>
  <text x="165" y="213" font-size="13" text-anchor="middle" fill="#111827">input X + answer y</text>

  <rect x="345" y="148" width="270" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Unsupervised Learning</text>
  <text x="480" y="196" font-size="13" text-anchor="middle" fill="#111827">finds structure in unlabeled data</text>
  <text x="480" y="213" font-size="13" text-anchor="middle" fill="#111827">input X only</text>

  <rect x="660" y="148" width="270" height="76" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="795" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Reinforcement Learning</text>
  <text x="795" y="196" font-size="13" text-anchor="middle" fill="#111827">learns by trial and error</text>
  <text x="795" y="213" font-size="13" text-anchor="middle" fill="#111827">feedback comes as rewards</text>

  <!-- connectors: categories -> tasks -->
  <g fill="none" stroke="#6b7280" stroke-width="2">
    <path d="M165 224 V246 H92 V270"/>
    <path d="M165 224 V246 H238 V270"/>
    <path d="M480 224 V246 H407 V270"/>
    <path d="M480 224 V246 H553 V270"/>
    <path d="M795 224 V246 H722 V270"/>
    <path d="M795 224 V246 H868 V270"/>
  </g>

  <!-- supervised tasks -->
  <rect x="26" y="270" width="132" height="112" rx="8" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <text x="92" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Classification</text>
  <text x="92" y="320" font-size="12" text-anchor="middle" fill="#111827">predicts a category</text>
  <text x="92" y="344" font-size="12" text-anchor="middle" fill="#374151">e.g. spam or not,</text>
  <text x="92" y="361" font-size="12" text-anchor="middle" fill="#374151">iris species</text>

  <rect x="172" y="270" width="132" height="112" rx="8" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <text x="238" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Regression</text>
  <text x="238" y="320" font-size="12" text-anchor="middle" fill="#111827">predicts a number</text>
  <text x="238" y="344" font-size="12" text-anchor="middle" fill="#374151">e.g. house price,</text>
  <text x="238" y="361" font-size="12" text-anchor="middle" fill="#374151">temperature</text>

  <!-- unsupervised tasks -->
  <rect x="341" y="270" width="132" height="112" rx="8" fill="white" stroke="#15803d" stroke-width="2"/>
  <text x="407" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Clustering</text>
  <text x="407" y="320" font-size="12" text-anchor="middle" fill="#111827">groups similar data</text>
  <text x="407" y="344" font-size="12" text-anchor="middle" fill="#374151">e.g. customer</text>
  <text x="407" y="361" font-size="12" text-anchor="middle" fill="#374151">segmentation</text>

  <rect x="487" y="270" width="132" height="112" rx="8" fill="white" stroke="#15803d" stroke-width="2"/>
  <text x="553" y="292" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Dimensionality</text>
  <text x="553" y="309" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Reduction</text>
  <text x="553" y="331" font-size="12" text-anchor="middle" fill="#111827">compresses features</text>
  <text x="553" y="355" font-size="12" text-anchor="middle" fill="#374151">e.g. 4D to 2D</text>
  <text x="553" y="372" font-size="12" text-anchor="middle" fill="#374151">for plotting</text>

  <!-- reinforcement parts -->
  <rect x="656" y="270" width="132" height="112" rx="8" fill="white" stroke="#c2410c" stroke-width="2"/>
  <text x="722" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Agent</text>
  <text x="722" y="320" font-size="12" text-anchor="middle" fill="#111827">chooses actions</text>
  <text x="722" y="344" font-size="12" text-anchor="middle" fill="#374151">e.g. game player,</text>
  <text x="722" y="361" font-size="12" text-anchor="middle" fill="#374151">robot controller</text>

  <rect x="802" y="270" width="132" height="112" rx="8" fill="white" stroke="#c2410c" stroke-width="2"/>
  <text x="868" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">Reward</text>
  <text x="868" y="320" font-size="12" text-anchor="middle" fill="#111827">feedback signal</text>
  <text x="868" y="344" font-size="12" text-anchor="middle" fill="#374151">goal: maximize the</text>
  <text x="868" y="361" font-size="12" text-anchor="middle" fill="#374151">total reward</text>

  <!-- footer note -->
  <rect x="30" y="408" width="900" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="480" y="435" font-size="14" text-anchor="middle" fill="#111827">This book focuses on supervised and unsupervised learning. Reinforcement learning is covered as a concept only.</text>
</svg>

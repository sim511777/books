<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">Fully connected neural network: forward and backward pass</title>
<desc id="d">Input layer with 3 nodes, hidden layer with 4 nodes and output layer with 2 nodes, fully connected. A blue arrow shows the forward pass from left to right and an orange arrow shows the backward pass from right to left.</desc>
<defs>
<marker id="fw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"/></marker>
<marker id="bw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9731a"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#222}
.s{font-size:13px;fill:#555}
.m{font-size:15px;font-weight:bold}
.n{font-size:14px;text-anchor:middle}
.c{text-anchor:middle}
</style>
<rect width="900" height="500" fill="#ffffff"/>
<text x="450" y="30" class="c" style="font-size:18px;font-weight:bold">Two-layer fully connected network</text>
<line x1="150" y1="170" x2="420" y2="130" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="170" x2="420" y2="210" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="170" x2="420" y2="290" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="170" x2="420" y2="370" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="250" x2="420" y2="130" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="250" x2="420" y2="210" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="250" x2="420" y2="290" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="250" x2="420" y2="370" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="330" x2="420" y2="130" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="330" x2="420" y2="210" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="330" x2="420" y2="290" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="150" y1="330" x2="420" y2="370" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="130" x2="690" y2="190" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="130" x2="690" y2="310" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="210" x2="690" y2="190" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="210" x2="690" y2="310" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="290" x2="690" y2="190" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="290" x2="690" y2="310" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="370" x2="690" y2="190" stroke="#b9c3cf" stroke-width="1.2"/>
<line x1="420" y1="370" x2="690" y2="310" stroke="#b9c3cf" stroke-width="1.2"/>
<circle cx="150" cy="170" r="24" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="2"/>
<text x="150" y="175" class="n">x1</text>
<circle cx="150" cy="250" r="24" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="2"/>
<text x="150" y="255" class="n">x2</text>
<circle cx="150" cy="330" r="24" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="2"/>
<text x="150" y="335" class="n">x3</text>
<circle cx="420" cy="130" r="24" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="420" y="135" class="n">h1</text>
<circle cx="420" cy="210" r="24" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="420" y="215" class="n">h2</text>
<circle cx="420" cy="290" r="24" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="420" y="295" class="n">h3</text>
<circle cx="420" cy="370" r="24" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="420" y="375" class="n">h4</text>
<circle cx="690" cy="190" r="24" fill="#fdf0e3" stroke="#d9731a" stroke-width="2"/>
<text x="690" y="195" class="n">y1</text>
<circle cx="690" cy="310" r="24" fill="#fdf0e3" stroke="#d9731a" stroke-width="2"/>
<text x="690" y="315" class="n">y2</text>
<text x="150" y="68" class="m c">Input layer</text>
<text x="150" y="86" class="s c">3 features</text>
<text x="420" y="68" class="m c">Hidden layer</text>
<text x="420" y="86" class="s c">a = f(z)</text>
<text x="690" y="68" class="m c">Output layer</text>
<text x="690" y="86" class="s c">sigmoid / softmax</text>
<text x="285" y="402" class="s c">weights W1, bias b1</text>
<text x="555" y="402" class="s c">weights W2, bias b2</text>
<rect x="786" y="220" width="96" height="60" rx="8" fill="#f6eefb" stroke="#8a4fb0" stroke-width="2"/>
<text x="834" y="246" class="n" style="font-weight:bold">Loss L</text>
<text x="834" y="265" class="s c">vs. target t</text>
<line x1="714" y1="190" x2="784" y2="240" stroke="#8a4fb0" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="714" y1="310" x2="784" y2="260" stroke="#8a4fb0" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="450" y="428" class="m c" style="fill:#1d6fb8">Forward pass (left to right): inputs to prediction and loss</text>
<line x1="100" y1="440" x2="800" y2="440" stroke="#1d6fb8" stroke-width="3" marker-end="url(#fw)"/>
<text x="450" y="472" class="m c" style="fill:#d9731a">Backward pass (right to left): gradients of the loss</text>
<line x1="800" y1="484" x2="100" y2="484" stroke="#d9731a" stroke-width="3" marker-end="url(#bw)"/>
</svg>

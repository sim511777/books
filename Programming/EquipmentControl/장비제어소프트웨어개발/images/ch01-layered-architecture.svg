<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Layer 5: Presentation Layer (top) -->
  <rect x="80" y="20" width="540" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Presentation Layer</text>
  <text x="350" y="62" text-anchor="middle" font-size="11" fill="#333333">WPF/MVVM HMI, 화면 바인딩, 사용자 조작</text>

  <!-- arrow down between 5 and 4 -->
  <line x1="350" y1="75" x2="350" y2="90" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="90" x2="330" y2="75" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Application/Service Layer -->
  <rect x="80" y="90" width="540" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Application / Service Layer</text>
  <text x="350" y="132" text-anchor="middle" font-size="11" fill="#333333">알람, 레시피, 로깅, 상위 시스템 통신(TCP/SECS)</text>

  <line x1="350" y1="145" x2="350" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="160" x2="330" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Sequence/FSM Layer -->
  <rect x="80" y="160" width="540" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Sequence / FSM Layer</text>
  <text x="350" y="202" text-anchor="middle" font-size="11" fill="#333333">공정 시퀀스, 상태 머신, 인터록</text>

  <line x1="350" y1="215" x2="350" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="230" x2="330" y2="215" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Device/Axis Layer -->
  <rect x="80" y="230" width="540" height="55" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Device / Axis Layer</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#333333">모터, 실린더, 센서 등 논리적 장치 추상화</text>

  <line x1="350" y1="285" x2="350" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="300" x2="330" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: HAL -->
  <rect x="80" y="300" width="540" height="55" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="350" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">HAL (Hardware Abstraction Layer)</text>
  <text x="350" y="342" text-anchor="middle" font-size="11" fill="#333333">보드/드라이버 SDK 래핑 (모션 카드, DAQ, EtherCAT 마스터)</text>

  <!-- Physical hardware below -->
  <line x1="350" y1="355" x2="350" y2="370" stroke="#000000" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="350" y="388" text-anchor="middle" font-size="11" fill="#555555">물리 하드웨어 (모터, I/O 보드, 센서)</text>

  <!-- Side annotation: interface separation -->
  <text x="40" y="180" text-anchor="middle" font-size="10" fill="#555555" transform="rotate(-90 40 180)">인터페이스 경계 (교체·시뮬레이션 용이)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

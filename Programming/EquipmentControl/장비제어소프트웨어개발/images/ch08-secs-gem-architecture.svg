<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Equipment side -->
  <rect x="10" y="60" width="190" height="130" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="105" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">장비 (Equipment)</text>
  <text x="105" y="104" text-anchor="middle" font-size="10" fill="#333333">C# 제어 SW</text>

  <rect x="25" y="114" width="160" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="105" y="133" text-anchor="middle" font-size="10" fill="#000000">FSM (Init/Ready/Running…)</text>

  <rect x="25" y="150" width="160" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="105" y="169" text-anchor="middle" font-size="10" fill="#000000">Secs4Net (GEM Client)</text>

  <!-- HSMS link -->
  <line x1="200" y1="140" x2="255" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="255" y1="160" x2="200" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="255" y="105" width="190" height="90" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="350" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">HSMS (SEMI E37)</text>
  <text x="350" y="146" text-anchor="middle" font-size="10" fill="#333333">TCP/IP 전송 계층</text>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="#555555">Select · Linktest · Separate</text>
  <text x="350" y="180" text-anchor="middle" font-size="10" fill="#555555">Active/Passive 모드</text>

  <!-- SECS-II message -->
  <line x1="445" y1="140" x2="500" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="445" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="60" width="190" height="130" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="595" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">호스트 (MES/상위)</text>
  <text x="595" y="104" text-anchor="middle" font-size="10" fill="#333333">공장 자동화 시스템</text>

  <rect x="515" y="114" width="160" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="595" y="133" text-anchor="middle" font-size="10" fill="#000000">이벤트 리포트 수신</text>

  <rect x="515" y="150" width="160" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="595" y="169" text-anchor="middle" font-size="10" fill="#000000">원격 명령 전송</text>

  <!-- SECS-II message box below -->
  <rect x="255" y="230" width="190" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">SECS-II (SEMI E5)</text>
  <text x="350" y="271" text-anchor="middle" font-size="10" fill="#555555">Stream/Function 메시지</text>
  <text x="350" y="288" text-anchor="middle" font-size="10" fill="#555555">예: S1F1 → S1F2</text>
  <text x="350" y="303" text-anchor="middle" font-size="9" fill="#777777">(Are You There / On Line Data)</text>

  <line x1="350" y1="195" x2="350" y2="228" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="365" y="212" font-size="9" fill="#777777">HSMS 위에 실림</text>

  <!-- GEM overlay -->
  <rect x="30" y="330" width="640" height="55" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="350" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">GEM (SEMI E30)</text>
  <text x="350" y="370" text-anchor="middle" font-size="10" fill="#555555">SECS-II 위에서 정의되는 표준 장비 동작 모델 — 상태 모델 · 이벤트 리포트 · 알람 · 원격 명령 · 레시피 관리</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

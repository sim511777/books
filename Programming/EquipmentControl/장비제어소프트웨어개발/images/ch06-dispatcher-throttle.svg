<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- Background polling thread -->
  <rect x="20" y="40" width="170" height="90" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="105" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">폴링/수신 스레드</text>
  <text x="105" y="83" text-anchor="middle" font-size="9" fill="#555555">1ms 주기 축 위치 읽기</text>
  <text x="105" y="99" text-anchor="middle" font-size="9" fill="#555555">백그라운드 Thread/Task</text>
  <text x="105" y="115" text-anchor="middle" font-size="9" fill="#555555">UI 스레드 아님</text>

  <line x1="105" y1="130" x2="105" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="153" text-anchor="middle" font-size="9" fill="#555555">매 tick 기록</text>

  <!-- Shared buffer -->
  <rect x="20" y="170" width="170" height="80" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="105" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">공유 버퍼</text>
  <text x="105" y="213" text-anchor="middle" font-size="9" fill="#555555">ConcurrentDictionary</text>
  <text x="105" y="229" text-anchor="middle" font-size="9" fill="#555555">최신 값만 덮어쓰기</text>
  <text x="105" y="243" text-anchor="middle" font-size="9" fill="#555555">(스레드 안전)</text>

  <line x1="190" y1="210" x2="260" y2="210" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="198" text-anchor="middle" font-size="9" fill="#555555">100~200ms</text>
  <text x="225" y="228" text-anchor="middle" font-size="9" fill="#555555">주기 Tick</text>

  <!-- DispatcherTimer -->
  <rect x="260" y="170" width="170" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="345" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">DispatcherTimer</text>
  <text x="345" y="213" text-anchor="middle" font-size="9" fill="#555555">UI 스레드에서 실행</text>
  <text x="345" y="229" text-anchor="middle" font-size="9" fill="#555555">버퍼를 한번에 flush</text>
  <text x="345" y="243" text-anchor="middle" font-size="9" fill="#555555">(스로틀링/배치)</text>

  <line x1="430" y1="210" x2="500" y2="210" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ViewModel -->
  <rect x="500" y="170" width="180" height="80" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="590" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ViewModel 프로퍼티</text>
  <text x="590" y="213" text-anchor="middle" font-size="9" fill="#555555">PositionX = value;</text>
  <text x="590" y="229" text-anchor="middle" font-size="9" fill="#555555">OnPropertyChanged</text>
  <text x="590" y="243" text-anchor="middle" font-size="9" fill="#555555">호출</text>

  <line x1="590" y1="250" x2="590" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="290" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="590" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">View 재렌더링</text>
  <text x="590" y="333" text-anchor="middle" font-size="9" fill="#555555">바인딩 엔진이 갱신</text>

  <!-- alternative direct path (crossed out) -->
  <line x1="190" y1="85" x2="500" y2="85" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="330" y1="70" x2="360" y2="100" stroke="#000000" stroke-width="2"/>
  <line x1="360" y1="70" x2="330" y2="100" stroke="#000000" stroke-width="2"/>
  <text x="345" y="55" text-anchor="middle" font-size="9" fill="#555555">직접 UI 갱신 시도 → InvalidOperationException</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="820" height="560" fill="#ffffff" />

  <!-- 제목 -->
  <text x="410" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">입력 크기에 따른 복잡도 클래스별 연산 횟수 비교</text>
  <text x="410" y="48" font-size="12" text-anchor="middle" fill="#000000">(y축은 로그 스케일 — 값이 커질수록 한 칸의 실제 차이가 매우 커집니다)</text>

  <!-- 축 -->
  <line x1="70" y1="40" x2="70" y2="440" stroke="#000000" stroke-width="1.5" />
  <line x1="70" y1="440" x2="760" y2="440" stroke="#000000" stroke-width="1.5" />

  <!-- y축 격자선 및 눈금 (연산 횟수: 1, 10, 100, 1000) -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="70" y1="402.4" x2="760" y2="402.4" />
    <line x1="70" y1="309.9" x2="760" y2="309.9" />
    <line x1="70" y1="189.5" x2="760" y2="189.5" />
    <line x1="70" y1="64.9" x2="760" y2="64.9" />
  </g>
  <g font-size="12" fill="#000000" text-anchor="end">
    <text x="62" y="406.4">1</text>
    <text x="62" y="313.9">10</text>
    <text x="62" y="193.5">100</text>
    <text x="62" y="68.9">1,000</text>
  </g>

  <!-- x축 눈금 (n = 1..10) -->
  <g font-size="12" fill="#000000" text-anchor="middle">
    <text x="70" y="458">1</text>
    <text x="146.7" y="458">2</text>
    <text x="223.3" y="458">3</text>
    <text x="300" y="458">4</text>
    <text x="376.7" y="458">5</text>
    <text x="453.3" y="458">6</text>
    <text x="530" y="458">7</text>
    <text x="606.7" y="458">8</text>
    <text x="683.3" y="458">9</text>
    <text x="760" y="458">10</text>
  </g>

  <!-- 축 라벨 -->
  <text x="415" y="490" font-size="14" text-anchor="middle" fill="#000000">입력 크기 n</text>
  <text x="-260" y="24" font-size="14" text-anchor="middle" fill="#000000" transform="rotate(-90)">연산 횟수 (로그 스케일)</text>

  <!-- O(1) : 실선, 굵기 2 -->
  <polyline fill="none" stroke="#000000" stroke-width="2"
    points="70,402.4 146.7,402.4 223.3,402.4 300,402.4 376.7,402.4 453.3,402.4 530,402.4 606.7,402.4 683.3,402.4 760,402.4" />
  <text x="765" y="402.4" font-size="13" fill="#000000">O(1)</text>

  <!-- O(log n) : 짧은 점선 -->
  <polyline fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="3,3"
    points="70,440 146.7,402.4 223.3,388.4 300,380.4 376.7,374.9 453.3,370.8 530,367.4 606.7,364.8 683.3,362.5 760,360.6" />
  <text x="765" y="360.6" font-size="13" fill="#000000">O(log n)</text>

  <!-- O(n) : 긴 파선 -->
  <polyline fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,3"
    points="70,402.4 146.7,380.4 223.3,364.8 300,352.6 376.7,342.8 453.3,334.4 530,327.1 606.7,320.8 683.3,315 760,309.9" />
  <text x="765" y="309.9" font-size="13" fill="#000000">O(n)</text>

  <!-- O(n log n) : 파선-점 -->
  <polyline fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,3,2,3"
    points="70,440 146.7,380.4 223.3,345 300,320.8 376.7,302.5 453.3,287.9 530,275.6 606.7,265.3 683.3,256.3 760,248.3" />
  <text x="765" y="248.3" font-size="13" fill="#000000">O(n log n)</text>

  <!-- O(n^2) : 촘촘한 점선, 굵게 -->
  <polyline fill="none" stroke="#000000" stroke-width="2.4" stroke-dasharray="2,2"
    points="70,402.4 146.7,352.6 223.3,315 300,286.3 376.7,263.1 453.3,244 530,227.6 606.7,213.4 683.3,200.8 760,189.5" />
  <text x="765" y="189.5" font-size="13" fill="#000000">O(n²)</text>

  <!-- O(2^n) : 굵은 실선 -->
  <polyline fill="none" stroke="#000000" stroke-width="3"
    points="70,380.4 146.7,352.6 223.3,320.8 300,286.3 376.7,250.1 453.3,213.4 530,176.1 606.7,138.8 683.3,101.3 760,63.6" />
  <text x="765" y="63.6" font-size="13" fill="#000000">O(2ⁿ)</text>

</svg>

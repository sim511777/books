<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="white"/>

  <!-- 왼쪽: Push 연산 -->
  <text x="150" y="30" font-size="20" text-anchor="middle" fill="black" font-weight="bold">Push 연산</text>

  <!-- Push 이전 스택 -->
  <text x="90" y="60" font-size="14" text-anchor="middle" fill="black">이전</text>
  <rect x="40" y="260" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="90" y="290" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="40" y="210" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="90" y="240" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="40" y="160" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="90" y="190" font-size="16" text-anchor="middle" fill="black">30</text>
  <text x="150" y="190" font-size="12" text-anchor="start" fill="black">← Top</text>

  <!-- 화살표 -->
  <line x1="200" y1="200" x2="260" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="185" font-size="13" text-anchor="middle" fill="black">Push(40)</text>

  <!-- Push 이후 스택 -->
  <text x="310" y="60" font-size="14" text-anchor="middle" fill="black">이후</text>
  <rect x="260" y="260" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="310" y="290" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="260" y="210" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="310" y="240" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="260" y="160" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="310" y="190" font-size="16" text-anchor="middle" fill="black">30</text>
  <rect x="260" y="110" width="100" height="50" fill="white" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="310" y="140" font-size="16" text-anchor="middle" fill="black">40</text>
  <text x="370" y="140" font-size="12" text-anchor="start" fill="black">← Top</text>

  <!-- 구분선 -->
  <line x1="450" y1="20" x2="450" y2="400" stroke="black" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 오른쪽: Pop 연산 -->
  <text x="670" y="30" font-size="20" text-anchor="middle" fill="black" font-weight="bold">Pop 연산</text>

  <!-- Pop 이전 스택 -->
  <text x="530" y="60" font-size="14" text-anchor="middle" fill="black">이전</text>
  <rect x="480" y="260" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="530" y="290" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="480" y="210" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="530" y="240" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="480" y="160" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="530" y="190" font-size="16" text-anchor="middle" fill="black">30</text>
  <rect x="480" y="110" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="530" y="140" font-size="16" text-anchor="middle" fill="black">40</text>
  <text x="590" y="140" font-size="12" text-anchor="start" fill="black">← Top</text>

  <!-- 화살표 -->
  <line x1="640" y1="130" x2="700" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="115" font-size="13" text-anchor="middle" fill="black">Pop() → 40</text>

  <!-- Pop 이후 스택 -->
  <text x="750" y="60" font-size="14" text-anchor="middle" fill="black">이후</text>
  <rect x="700" y="260" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="290" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="700" y="210" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="240" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="700" y="160" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="190" font-size="16" text-anchor="middle" fill="black">30</text>
  <text x="810" y="190" font-size="12" text-anchor="start" fill="black">← Top</text>

  <!-- 바닥선 표시 -->
  <text x="90" y="335" font-size="12" text-anchor="middle" fill="black">(바닥)</text>
  <text x="310" y="335" font-size="12" text-anchor="middle" fill="black">(바닥)</text>
  <text x="530" y="335" font-size="12" text-anchor="middle" fill="black">(바닥)</text>
  <text x="750" y="335" font-size="12" text-anchor="middle" fill="black">(바닥)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
</svg>

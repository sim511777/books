<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="white"/>

  <text x="450" y="30" font-size="20" text-anchor="middle" fill="black" font-weight="bold">BFS 탐색 순서: 큐를 이용해 가까운 정점부터 방문</text>

  <!-- 그래프: A는 출발점, 거리별로 배치 -->
  <!-- 거리 0 -->
  <circle cx="120" cy="230" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="236" font-size="18" text-anchor="middle" fill="black">A</text>
  <text x="120" y="280" font-size="12" text-anchor="middle" fill="black">거리 0</text>

  <!-- 거리 1: B, C -->
  <circle cx="320" cy="140" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="320" y="146" font-size="18" text-anchor="middle" fill="black">B</text>

  <circle cx="320" cy="320" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="320" y="326" font-size="18" text-anchor="middle" fill="black">C</text>
  <text x="320" y="390" font-size="12" text-anchor="middle" fill="black">거리 1</text>

  <!-- 거리 2: D, E, F -->
  <circle cx="560" cy="70" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="560" y="76" font-size="18" text-anchor="middle" fill="black">D</text>

  <circle cx="560" cy="230" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="560" y="236" font-size="18" text-anchor="middle" fill="black">E</text>

  <circle cx="560" cy="390" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="560" y="396" font-size="18" text-anchor="middle" fill="black">F</text>
  <text x="560" y="440" font-size="12" text-anchor="middle" fill="black">거리 2</text>

  <!-- 거리 3: G -->
  <circle cx="780" cy="230" r="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="780" y="236" font-size="18" text-anchor="middle" fill="black">G</text>
  <text x="780" y="280" font-size="12" text-anchor="middle" fill="black">거리 3</text>

  <!-- 간선 -->
  <line x1="145" y1="216" x2="295" y2="153" stroke="black" stroke-width="2"/>
  <line x1="145" y1="245" x2="295" y2="307" stroke="black" stroke-width="2"/>
  <line x1="345" y1="128" x2="535" y2="80" stroke="black" stroke-width="2"/>
  <line x1="345" y1="150" x2="535" y2="220" stroke="black" stroke-width="2"/>
  <line x1="345" y1="310" x2="535" y2="240" stroke="black" stroke-width="2"/>
  <line x1="345" y1="330" x2="535" y2="380" stroke="black" stroke-width="2"/>
  <line x1="585" y1="238" x2="755" y2="230" stroke="black" stroke-width="2"/>

  <!-- 방문 순서 번호 -->
  <text x="120" y="200" font-size="14" text-anchor="middle" fill="black" font-weight="bold">①</text>
  <text x="320" y="110" font-size="14" text-anchor="middle" fill="black" font-weight="bold">②</text>
  <text x="320" y="360" font-size="14" text-anchor="middle" fill="black" font-weight="bold">③</text>
  <text x="560" y="40" font-size="14" text-anchor="middle" fill="black" font-weight="bold">④</text>
  <text x="560" y="200" font-size="14" text-anchor="middle" fill="black" font-weight="bold">⑤</text>
  <text x="560" y="430" font-size="14" text-anchor="middle" fill="black" font-weight="bold">⑥</text>
  <text x="780" y="200" font-size="14" text-anchor="middle" fill="black" font-weight="bold">⑦</text>

  <!-- 큐 상태 변화 -->
  <line x1="0" y1="470" x2="900" y2="470" stroke="black" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="450" y="495" font-size="15" text-anchor="middle" fill="black" font-weight="bold">큐(Queue)의 변화: 앞에서 꺼내고(Dequeue) 뒤에 이웃을 넣는다(Enqueue)</text>

  <text x="30" y="530" font-size="13" text-anchor="start" fill="black">[A] 꺼냄 → 이웃 B,C 넣음</text>
  <text x="260" y="530" font-size="13" text-anchor="start" fill="black">[B,C] → B 꺼냄 → D,E 넣음</text>
  <text x="530" y="530" font-size="13" text-anchor="start" fill="black">[C,D,E] → C 꺼냄 → F 넣음</text>

  <text x="30" y="552" font-size="13" text-anchor="start" fill="black">방문 순서: A → B → C → D → E → F → G</text>
</svg>

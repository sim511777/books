<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" fill="white" />

  <text x="500" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="black">해시 테이블: 해시 함수와 체이닝</text>

  <!-- 키 박스 4개 -->
  <rect x="15" y="30" width="140" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="85" y="55" text-anchor="middle" font-size="14" fill="black">김민수</text>

  <rect x="15" y="100" width="140" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="85" y="125" text-anchor="middle" font-size="14" fill="black">박서준</text>

  <rect x="15" y="170" width="140" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="85" y="195" text-anchor="middle" font-size="14" fill="black">이지은</text>

  <rect x="15" y="240" width="140" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="85" y="265" text-anchor="middle" font-size="14" fill="black">최유진</text>

  <!-- 해시 함수 박스 -->
  <rect x="215" y="105" width="150" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="290" y="135" text-anchor="middle" font-size="13" fill="black">해시 함수</text>
  <text x="290" y="155" text-anchor="middle" font-size="13" fill="black">h(key)</text>

  <!-- 키 -> 해시함수 화살표 -->
  <line x1="155" y1="50" x2="213" y2="120" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="155" y1="120" x2="213" y2="130" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="155" y1="190" x2="213" y2="150" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="155" y1="260" x2="213" y2="160" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- 버킷 배열 (인덱스 0~4) -->
  <rect x="420" y="10" width="110" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="475" y="30" text-anchor="middle" font-size="12" fill="black">버킷 0</text>
  <text x="475" y="60" text-anchor="middle" font-size="11" fill="black">(index 0)</text>

  <rect x="420" y="90" width="110" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="475" y="110" text-anchor="middle" font-size="12" fill="black">버킷 1</text>
  <text x="475" y="140" text-anchor="middle" font-size="11" fill="black">null (비어 있음)</text>

  <rect x="420" y="170" width="110" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="475" y="190" text-anchor="middle" font-size="12" fill="black">버킷 2</text>
  <text x="475" y="220" text-anchor="middle" font-size="11" fill="black">(index 2, 충돌)</text>

  <rect x="420" y="250" width="110" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="475" y="270" text-anchor="middle" font-size="12" fill="black">버킷 3</text>
  <text x="475" y="300" text-anchor="middle" font-size="11" fill="black">null (비어 있음)</text>

  <rect x="420" y="330" width="110" height="70" fill="white" stroke="black" stroke-width="1.5" />
  <text x="475" y="350" text-anchor="middle" font-size="12" fill="black">버킷 4</text>
  <text x="475" y="380" text-anchor="middle" font-size="11" fill="black">(index 4)</text>

  <!-- 해시함수 -> 버킷 화살표 -->
  <line x1="365" y1="120" x2="418" y2="45" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="380" y="80" font-size="11" fill="black">h(최유진)=0</text>

  <line x1="365" y1="130" x2="418" y2="198" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="368" y="150" font-size="11" fill="black">h(김민수)=2</text>

  <line x1="365" y1="150" x2="418" y2="212" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="368" y="245" font-size="11" fill="black">h(박서준)=2</text>

  <line x1="365" y1="160" x2="418" y2="360" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="380" y="290" font-size="11" fill="black">h(이지은)=4</text>

  <!-- 버킷 0 체인 -->
  <line x1="530" y1="45" x2="578" y2="45" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="580" y="25" width="120" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="640" y="50" text-anchor="middle" font-size="12" fill="black">최유진 : 값</text>
  <line x1="700" y1="45" x2="748" y2="45" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="750" y="25" width="70" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="785" y="50" text-anchor="middle" font-size="12" fill="black">null</text>

  <!-- 버킷 2 체인 (충돌: 두 키가 연결 리스트로 이어짐) -->
  <line x1="530" y1="205" x2="578" y2="205" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="580" y="185" width="120" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="640" y="210" text-anchor="middle" font-size="12" fill="black">김민수 : 값</text>
  <line x1="700" y1="205" x2="748" y2="205" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="750" y="185" width="120" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="810" y="210" text-anchor="middle" font-size="12" fill="black">박서준 : 값</text>
  <line x1="870" y1="205" x2="918" y2="205" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="920" y="185" width="65" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="952" y="210" text-anchor="middle" font-size="12" fill="black">null</text>

  <!-- 버킷 4 체인 -->
  <line x1="530" y1="365" x2="578" y2="365" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="580" y="345" width="120" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="640" y="370" text-anchor="middle" font-size="12" fill="black">이지은 : 값</text>
  <line x1="700" y1="365" x2="748" y2="365" stroke="black" stroke-width="1.3" marker-end="url(#arrow)" />
  <rect x="750" y="345" width="70" height="40" fill="white" stroke="black" stroke-width="1.5" />
  <text x="785" y="370" text-anchor="middle" font-size="12" fill="black">null</text>

  <text x="500" y="410" text-anchor="middle" font-size="12" fill="black">같은 버킷(인덱스 2)으로 계산된 "김민수"와 "박서준"이 연결 리스트로 이어져 충돌을 해결한다</text>
</svg>

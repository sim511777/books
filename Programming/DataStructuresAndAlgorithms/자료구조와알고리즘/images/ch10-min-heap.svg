<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="white"/>

  <!-- 제목 -->
  <text x="180" y="30" font-size="18" fill="black" text-anchor="middle" font-weight="bold">트리 형태</text>
  <text x="580" y="30" font-size="18" fill="black" text-anchor="middle" font-weight="bold">배열 형태</text>

  <!-- 트리 간선 -->
  <g stroke="black" stroke-width="1.5">
    <line x1="180" y1="70" x2="100" y2="140"/>
    <line x1="180" y1="70" x2="260" y2="140"/>
    <line x1="100" y1="140" x2="60" y2="210"/>
    <line x1="100" y1="140" x2="140" y2="210"/>
    <line x1="260" y1="140" x2="220" y2="210"/>
    <line x1="260" y1="140" x2="300" y2="210"/>
  </g>

  <!-- 트리 노드: 인덱스 0 (루트) -->
  <circle cx="180" cy="70" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="180" y="76" font-size="16" fill="black" text-anchor="middle">1</text>
  <text x="180" y="45" font-size="11" fill="black" text-anchor="middle">idx 0</text>

  <!-- 트리 노드: 인덱스 1, 2 -->
  <circle cx="100" cy="140" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="100" y="146" font-size="16" fill="black" text-anchor="middle">3</text>
  <text x="100" y="115" font-size="11" fill="black" text-anchor="middle">idx 1</text>

  <circle cx="260" cy="140" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="260" y="146" font-size="16" fill="black" text-anchor="middle">2</text>
  <text x="260" y="115" font-size="11" fill="black" text-anchor="middle">idx 2</text>

  <!-- 트리 노드: 인덱스 3, 4, 5, 6 -->
  <circle cx="60" cy="210" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="60" y="216" font-size="16" fill="black" text-anchor="middle">7</text>
  <text x="60" y="250" font-size="11" fill="black" text-anchor="middle">idx 3</text>

  <circle cx="140" cy="210" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="140" y="216" font-size="16" fill="black" text-anchor="middle">5</text>
  <text x="140" y="250" font-size="11" fill="black" text-anchor="middle">idx 4</text>

  <circle cx="220" cy="210" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="220" y="216" font-size="16" fill="black" text-anchor="middle">4</text>
  <text x="220" y="250" font-size="11" fill="black" text-anchor="middle">idx 5</text>

  <circle cx="300" cy="210" r="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="300" y="216" font-size="16" fill="black" text-anchor="middle">8</text>
  <text x="300" y="250" font-size="11" fill="black" text-anchor="middle">idx 6</text>

  <!-- 루트 표시 -->
  <text x="180" y="300" font-size="12" fill="black" text-anchor="middle">루트가 항상 최솟값(1)을 가진다</text>

  <!-- 배열 형태 -->
  <g font-size="13" fill="black">
    <!-- 인덱스 라벨 -->
    <text x="450" y="90" text-anchor="middle">0</text>
    <text x="500" y="90" text-anchor="middle">1</text>
    <text x="550" y="90" text-anchor="middle">2</text>
    <text x="600" y="90" text-anchor="middle">3</text>
    <text x="650" y="90" text-anchor="middle">4</text>
    <text x="700" y="90" text-anchor="middle">5</text>
    <text x="750" y="90" text-anchor="middle">6</text>
  </g>

  <!-- 배열 박스 -->
  <g stroke="black" stroke-width="1.5" fill="white">
    <rect x="425" y="100" width="50" height="50"/>
    <rect x="475" y="100" width="50" height="50"/>
    <rect x="525" y="100" width="50" height="50"/>
    <rect x="575" y="100" width="50" height="50"/>
    <rect x="625" y="100" width="50" height="50"/>
    <rect x="675" y="100" width="50" height="50"/>
    <rect x="725" y="100" width="50" height="50"/>
  </g>
  <g font-size="18" fill="black" text-anchor="middle">
    <text x="450" y="132">1</text>
    <text x="500" y="132">3</text>
    <text x="550" y="132">2</text>
    <text x="600" y="132">7</text>
    <text x="650" y="132">5</text>
    <text x="700" y="132">4</text>
    <text x="750" y="132">8</text>
  </g>

  <!-- 부모-자식 인덱스 관계 설명 -->
  <g font-size="12" fill="black">
    <text x="580" y="200">부모 인덱스 i의 자식 인덱스:</text>
    <text x="580" y="222">왼쪽 자식 = 2i + 1</text>
    <text x="580" y="244">오른쪽 자식 = 2i + 2</text>
    <text x="580" y="266">(반대로) 자식 j의 부모 = (j - 1) / 2</text>
  </g>

  <!-- 예시 화살표: idx 1의 자식이 idx 3, idx 4 임을 표시 -->
  <g stroke="black" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <path d="M 500 150 C 500 180, 600 170, 600 200" />
    <path d="M 500 150 C 500 190, 650 180, 650 200" />
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>
  <text x="500" y="320" font-size="11" fill="black" text-anchor="middle">idx 1(값 3)의 자식은</text>
  <text x="500" y="336" font-size="11" fill="black" text-anchor="middle">idx 3(값 7), idx 4(값 5)</text>

  <text x="580" y="400" font-size="12" fill="black">완전 이진 트리이기 때문에</text>
  <text x="580" y="418" font-size="12" fill="black">포인터 없이 배열 인덱스 계산만으로</text>
  <text x="580" y="436" font-size="12" fill="black">부모-자식 관계를 표현할 수 있다.</text>
</svg>

<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="white"/>

  <text x="450" y="30" font-size="20" text-anchor="middle" fill="black" font-weight="bold">큐(Queue)의 Enqueue / Dequeue</text>

  <!-- 초기 상태 -->
  <text x="90" y="70" font-size="14" text-anchor="middle" fill="black">초기 상태</text>
  <rect x="40" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="90" y="120" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="140" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="190" y="120" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="240" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="290" y="120" font-size="16" text-anchor="middle" fill="black">30</text>
  <text x="90" y="160" font-size="12" text-anchor="middle" fill="black">Front</text>
  <text x="290" y="160" font-size="12" text-anchor="middle" fill="black">Rear</text>

  <!-- Enqueue 화살표 -->
  <line x1="340" y1="115" x2="400" y2="115" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="370" y="100" font-size="13" text-anchor="middle" fill="black">Enqueue(40)</text>

  <!-- Enqueue 이후 -->
  <text x="500" y="70" font-size="14" text-anchor="middle" fill="black">Enqueue(40) 이후</text>
  <rect x="410" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="460" y="120" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="510" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="560" y="120" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="610" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="660" y="120" font-size="16" text-anchor="middle" fill="black">30</text>
  <rect x="710" y="90" width="100" height="50" fill="white" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="760" y="120" font-size="16" text-anchor="middle" fill="black">40</text>
  <text x="460" y="160" font-size="12" text-anchor="middle" fill="black">Front</text>
  <text x="760" y="160" font-size="12" text-anchor="middle" fill="black">Rear</text>

  <!-- 아래 줄: Dequeue -->
  <text x="90" y="220" font-size="14" text-anchor="middle" fill="black">Dequeue() 실행</text>
  <rect x="40" y="240" width="100" height="50" fill="white" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="90" y="270" font-size="16" text-anchor="middle" fill="black">10</text>
  <rect x="140" y="240" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="190" y="270" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="240" y="240" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="290" y="270" font-size="16" text-anchor="middle" fill="black">30</text>
  <text x="90" y="310" font-size="12" text-anchor="middle" fill="black">← 제거되어 반환됨</text>

  <line x1="340" y1="265" x2="400" y2="265" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="370" y="250" font-size="13" text-anchor="middle" fill="black">Dequeue() → 10</text>

  <text x="460" y="220" font-size="14" text-anchor="middle" fill="black">Dequeue() 이후</text>
  <rect x="410" y="240" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="460" y="270" font-size="16" text-anchor="middle" fill="black">20</text>
  <rect x="510" y="240" width="100" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="560" y="270" font-size="16" text-anchor="middle" fill="black">30</text>
  <text x="460" y="310" font-size="12" text-anchor="middle" fill="black">Front</text>
  <text x="560" y="310" font-size="12" text-anchor="middle" fill="black">Rear</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
</svg>

<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="white"/>

  <text x="360" y="30" font-size="18" text-anchor="middle" fill="black" font-weight="bold">단일 연결 리스트(Singly Linked List) 구조</text>

  <!-- head 라벨 -->
  <text x="60" y="70" font-size="13" text-anchor="middle" fill="black">head</text>
  <line x1="60" y1="78" x2="60" y2="98" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 노드 1 -->
  <g transform="translate(30,100)">
    <rect x="0" y="0" width="90" height="50" fill="none" stroke="black" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="50" stroke="black" stroke-width="1.5"/>
    <text x="30" y="30" font-size="16" text-anchor="middle" fill="black">10</text>
    <text x="75" y="30" font-size="12" text-anchor="middle" fill="black">•</text>
  </g>

  <!-- 화살표 노드1 -> 노드2 -->
  <line x1="150" y1="125" x2="200" y2="125" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 노드 2 -->
  <g transform="translate(200,100)">
    <rect x="0" y="0" width="90" height="50" fill="none" stroke="black" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="50" stroke="black" stroke-width="1.5"/>
    <text x="30" y="30" font-size="16" text-anchor="middle" fill="black">20</text>
    <text x="75" y="30" font-size="12" text-anchor="middle" fill="black">•</text>
  </g>

  <!-- 화살표 노드2 -> 노드3 -->
  <line x1="320" y1="125" x2="370" y2="125" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 노드 3 -->
  <g transform="translate(370,100)">
    <rect x="0" y="0" width="90" height="50" fill="none" stroke="black" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="50" stroke="black" stroke-width="1.5"/>
    <text x="30" y="30" font-size="16" text-anchor="middle" fill="black">30</text>
    <text x="75" y="30" font-size="12" text-anchor="middle" fill="black">•</text>
  </g>

  <!-- 화살표 노드3 -> null -->
  <line x1="490" y1="125" x2="540" y2="125" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="565" y="130" font-size="14" fill="black">null</text>

  <!-- tail 라벨 -->
  <text x="415" y="70" font-size="13" text-anchor="middle" fill="black">tail</text>
  <line x1="415" y1="78" x2="415" y2="98" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 노드 구성 설명 -->
  <text x="30" y="195" font-size="13" fill="black">각 노드 = [ Value(데이터) | Next(다음 노드 참조) ]</text>
  <text x="30" y="220" font-size="13" fill="black">노드들은 메모리 여기저기 흩어져 있어도 Next 참조를 따라가며 순회할 수 있다.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
    </marker>
  </defs>
</svg>

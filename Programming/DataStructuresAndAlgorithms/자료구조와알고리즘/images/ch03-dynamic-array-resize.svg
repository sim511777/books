<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="white"/>

  <!-- 제목 -->
  <text x="360" y="30" font-size="18" text-anchor="middle" fill="black" font-weight="bold">동적 배열의 재할당(Resize) 과정</text>

  <!-- 기존 배열 (가득 찬 상태) -->
  <text x="40" y="80" font-size="14" fill="black">1. 기존 배열 (Capacity = 4, 가득 참)</text>
  <g transform="translate(40,95)">
    <rect x="0"   y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="60"  y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="120" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="180" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <text x="30"  y="30" font-size="16" text-anchor="middle" fill="black">10</text>
    <text x="90"  y="30" font-size="16" text-anchor="middle" fill="black">20</text>
    <text x="150" y="30" font-size="16" text-anchor="middle" fill="black">30</text>
    <text x="210" y="30" font-size="16" text-anchor="middle" fill="black">40</text>
    <text x="30"  y="68" font-size="12" text-anchor="middle" fill="black">[0]</text>
    <text x="90"  y="68" font-size="12" text-anchor="middle" fill="black">[1]</text>
    <text x="150" y="68" font-size="12" text-anchor="middle" fill="black">[2]</text>
    <text x="210" y="68" font-size="12" text-anchor="middle" fill="black">[3]</text>
  </g>

  <!-- 새 원소 추가 시도 -->
  <text x="320" y="120" font-size="14" fill="black">Add(50) 호출</text>
  <text x="320" y="140" font-size="13" fill="black">→ 공간이 없어 재할당 필요</text>

  <!-- 화살표: 아래로 -->
  <line x1="140" y1="175" x2="140" y2="215" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 새 배열 (2배 크기, 복사 완료 + 새 원소) -->
  <text x="40" y="245" font-size="14" fill="black">2. 새 배열 (Capacity = 8) 로 기존 원소 복사 후 추가</text>
  <g transform="translate(40,260)">
    <rect x="0"   y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="60"  y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="120" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="180" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="240" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="300" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="360" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>
    <rect x="420" y="0" width="60" height="50" fill="none" stroke="black" stroke-width="2"/>

    <text x="30"  y="30" font-size="16" text-anchor="middle" fill="black">10</text>
    <text x="90"  y="30" font-size="16" text-anchor="middle" fill="black">20</text>
    <text x="150" y="30" font-size="16" text-anchor="middle" fill="black">30</text>
    <text x="210" y="30" font-size="16" text-anchor="middle" fill="black">40</text>
    <text x="270" y="30" font-size="16" text-anchor="middle" fill="black">50</text>

    <text x="30"  y="68" font-size="12" text-anchor="middle" fill="black">[0]</text>
    <text x="90"  y="68" font-size="12" text-anchor="middle" fill="black">[1]</text>
    <text x="150" y="68" font-size="12" text-anchor="middle" fill="black">[2]</text>
    <text x="210" y="68" font-size="12" text-anchor="middle" fill="black">[3]</text>
    <text x="270" y="68" font-size="12" text-anchor="middle" fill="black">[4] (새 원소)</text>
    <text x="330" y="68" font-size="12" text-anchor="middle" fill="black">[5]</text>
    <text x="390" y="68" font-size="12" text-anchor="middle" fill="black">[6]</text>
    <text x="450" y="68" font-size="12" text-anchor="middle" fill="black">[7]</text>
  </g>

  <text x="40" y="360" font-size="13" fill="black">- 기존 원소 4개를 새 배열로 복사: O(n)</text>
  <text x="40" y="382" font-size="13" fill="black">- 새 원소 50을 [4]에 추가</text>
  <text x="40" y="404" font-size="13" fill="black">- 이후 다시 채워질 때까지는 Add가 O(1)로 동작 (Capacity 8, Count 5)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
    </marker>
  </defs>
</svg>

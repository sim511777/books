<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- Waiting -->
  <rect x="30" y="150" width="140" height="70" rx="35" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="180" text-anchor="middle" font-size="15" font-weight="bold">대기</text>
  <text x="100" y="198" text-anchor="middle" font-size="10">WaitingState</text>

  <!-- Paid -->
  <rect x="240" y="150" width="140" height="70" rx="35" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="310" y="180" text-anchor="middle" font-size="15" font-weight="bold">결제완료</text>
  <text x="310" y="198" text-anchor="middle" font-size="10">PaidState</text>

  <!-- Shipping -->
  <rect x="450" y="150" width="140" height="70" rx="35" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="520" y="180" text-anchor="middle" font-size="15" font-weight="bold">배송중</text>
  <text x="520" y="198" text-anchor="middle" font-size="10">ShippingState</text>

  <!-- Delivered -->
  <rect x="630" y="150" width="140" height="70" rx="35" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="700" y="180" text-anchor="middle" font-size="15" font-weight="bold">배송완료</text>
  <text x="700" y="198" text-anchor="middle" font-size="10">DeliveredState</text>

  <!-- Cancelled -->
  <rect x="240" y="320" width="140" height="70" rx="35" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="310" y="350" text-anchor="middle" font-size="15" font-weight="bold">취소</text>
  <text x="310" y="368" text-anchor="middle" font-size="10">CancelledState</text>

  <!-- Waiting -> Paid -->
  <line x1="170" y1="185" x2="238" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="204" y="175" text-anchor="middle" font-size="11">결제(Pay)</text>

  <!-- Paid -> Shipping -->
  <line x1="380" y1="185" x2="448" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="414" y="175" text-anchor="middle" font-size="11">배송시작(Ship)</text>

  <!-- Shipping -> Delivered -->
  <line x1="590" y1="185" x2="628" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="609" y="175" text-anchor="middle" font-size="11">배송완료(Deliver)</text>

  <!-- Waiting -> Cancelled -->
  <line x1="100" y1="220" x2="255" y2="322" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="150" y="280" text-anchor="middle" font-size="11">취소(Cancel)</text>

  <!-- Paid -> Cancelled -->
  <line x1="310" y1="220" x2="310" y2="318" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="345" y="275" text-anchor="middle" font-size="11">취소(Cancel)</text>

  <!-- Shipping/Delivered -> Cancel blocked marks -->
  <text x="520" y="260" text-anchor="middle" font-size="11">취소(Cancel) → 거부</text>
  <text x="700" y="260" text-anchor="middle" font-size="11">모든 동작 → 거부</text>

  <!-- Legend -->
  <rect x="30" y="20" width="740" height="70" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="45" y="42" font-size="12" font-weight="bold">그림 설명</text>
  <text x="45" y="62" font-size="11">각 원은 상태 클래스 하나를 나타내며, 화살표는 해당 동작이 호출되었을 때 상태 객체 스스로가 결정하는 다음 상태를 가리킨다.</text>
  <text x="45" y="80" font-size="11">배송중과 배송완료 상태에서는 취소가 허용되지 않으며, 이 규칙은 각 상태 클래스의 Cancel() 메서드 안에 있다.</text>

  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

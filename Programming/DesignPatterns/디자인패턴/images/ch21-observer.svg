<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <!-- IAirQualitySubject interface -->
  <rect x="40" y="30" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="150" y="52" text-anchor="middle" font-size="12" font-style="italic">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="75" text-anchor="middle" font-size="15" font-weight="bold">IAirQualitySubject</text>
  <text x="150" y="93" text-anchor="middle" font-size="11">+ Attach / Detach</text>

  <!-- AirQualityStation (ConcreteSubject) -->
  <rect x="40" y="150" width="220" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-size="16" font-weight="bold">AirQualityStation</text>
  <text x="150" y="197" text-anchor="middle" font-size="12">- _observers: List&lt;IObserver&gt;</text>
  <text x="150" y="216" text-anchor="middle" font-size="12">- _pm25</text>
  <text x="150" y="235" text-anchor="middle" font-size="12">+ UpdatePm25(value)</text>
  <text x="150" y="252" text-anchor="middle" font-size="11">(값이 바뀌면 Notify 호출)</text>

  <!-- AirQualityStation ..> IAirQualitySubject -->
  <line x1="150" y1="150" x2="150" y2="105" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHollow)"/>

  <!-- IAirQualityObserver interface -->
  <rect x="480" y="30" width="240" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="12" font-style="italic">&lt;&lt;interface&gt;&gt;</text>
  <text x="600" y="75" text-anchor="middle" font-size="15" font-weight="bold">IAirQualityObserver</text>
  <text x="600" y="93" text-anchor="middle" font-size="11">+ OnPm25Changed(pm25)</text>

  <!-- Three concrete observers -->
  <rect x="420" y="160" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="510" y="185" text-anchor="middle" font-size="14" font-weight="bold">ElectronicBillboard</text>
  <text x="510" y="205" text-anchor="middle" font-size="11">+ OnPm25Changed()</text>
  <text x="510" y="223" text-anchor="middle" font-size="10">농도/등급 표시</text>

  <rect x="420" y="270" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="510" y="295" text-anchor="middle" font-size="14" font-weight="bold">MobileAlertService</text>
  <text x="510" y="315" text-anchor="middle" font-size="11">+ OnPm25Changed()</text>
  <text x="510" y="333" text-anchor="middle" font-size="10">기준치 초과 시 푸시 알림</text>

  <rect x="420" y="380" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="510" y="405" text-anchor="middle" font-size="14" font-weight="bold">VentilationController</text>
  <text x="510" y="425" text-anchor="middle" font-size="11">+ OnPm25Changed()</text>
  <text x="510" y="443" text-anchor="middle" font-size="10">송풍 단계 자동 조절</text>

  <!-- Observers ..> IAirQualityObserver realization -->
  <line x1="510" y1="160" x2="580" y2="105" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHollow)"/>
  <line x1="520" y1="270" x2="600" y2="102" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHollow)"/>
  <line x1="530" y1="380" x2="618" y2="100" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHollow)"/>

  <!-- Station -> observers : notify arrows (solid) -->
  <line x1="260" y1="195" x2="418" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="260" y1="220" x2="418" y2="305" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="260" y1="240" x2="418" y2="415" stroke="#000000" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <text x="345" y="185" text-anchor="middle" font-size="11">통지①</text>
  <text x="345" y="270" text-anchor="middle" font-size="11">통지②</text>
  <text x="345" y="380" text-anchor="middle" font-size="11">통지③</text>

  <!-- Legend -->
  <rect x="40" y="480" width="700" height="60" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="55" y="503" font-size="12" font-weight="bold">그림 설명</text>
  <text x="55" y="524" font-size="11">AirQualityStation은 등록된 IAirQualityObserver 목록만 알고 있으며, 값이 바뀌면 Notify를 통해 목록의 모든 대상에게 동시에 통지한다. 새 화면이 추가되어도 Station 코드는 바뀌지 않는다.</text>

  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
    <marker id="arrowHollow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>
</svg>

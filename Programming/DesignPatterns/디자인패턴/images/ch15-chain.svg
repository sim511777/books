<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="320" fill="#ffffff" />

  <!-- 제목 -->
  <text x="450" y="30" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">체인 오브 리스판서빌리티 구조</text>

  <!-- 클라이언트 -->
  <rect x="20" y="140" width="110" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="75" y="165" font-size="13" text-anchor="middle" fill="#000000">클라이언트</text>
  <text x="75" y="182" font-size="11" text-anchor="middle" fill="#000000">(지출 결의서 제출)</text>

  <!-- 화살표: 클라이언트 -> 팀장 -->
  <line x1="130" y1="170" x2="185" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="157" y="160" font-size="10" text-anchor="middle" fill="#000000">요청</text>

  <!-- 핸들러 1: 팀장 -->
  <rect x="190" y="130" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="265" y="155" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">TeamLeadHandler</text>
  <text x="265" y="175" font-size="11" text-anchor="middle" fill="#000000">500만원 이하</text>
  <text x="265" y="192" font-size="11" text-anchor="middle" fill="#000000">처리 가능?</text>

  <!-- 화살표: 팀장 -> 부서장 -->
  <line x1="340" y1="170" x2="415" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="377" y="160" font-size="10" text-anchor="middle" fill="#000000">처리 불가 시 전달</text>

  <!-- 핸들러 2: 부서장 -->
  <rect x="420" y="130" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="495" y="155" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">DepartmentHead</text>
  <text x="495" y="175" font-size="11" text-anchor="middle" fill="#000000">2000만원 이하</text>
  <text x="495" y="192" font-size="11" text-anchor="middle" fill="#000000">처리 가능?</text>

  <!-- 화살표: 부서장 -> 대표 -->
  <line x1="570" y1="170" x2="645" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="607" y="160" font-size="10" text-anchor="middle" fill="#000000">처리 불가 시 전달</text>

  <!-- 핸들러 3: 대표 -->
  <rect x="650" y="130" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="725" y="155" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">CeoHandler</text>
  <text x="725" y="175" font-size="11" text-anchor="middle" fill="#000000">한도 없음</text>
  <text x="725" y="192" font-size="11" text-anchor="middle" fill="#000000">항상 처리</text>

  <!-- 처리 완료 표시선 (각 핸들러 아래) -->
  <line x1="265" y1="210" x2="265" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="265" y="265" font-size="11" text-anchor="middle" fill="#000000">여기서 처리되면</text>
  <text x="265" y="280" font-size="11" text-anchor="middle" fill="#000000">사슬 진행 중단</text>

  <line x1="495" y1="210" x2="495" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="495" y="265" font-size="11" text-anchor="middle" fill="#000000">여기서 처리되면</text>
  <text x="495" y="280" font-size="11" text-anchor="middle" fill="#000000">사슬 진행 중단</text>

  <line x1="725" y1="210" x2="725" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="725" y="265" font-size="11" text-anchor="middle" fill="#000000">마지막 처리자</text>
  <text x="725" y="280" font-size="11" text-anchor="middle" fill="#000000">(항상 처리)</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000" />
    </marker>
  </defs>
</svg>

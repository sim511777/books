<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', sans-serif">
  <defs>
    <marker id="triangle" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
    <marker id="triangleSolid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="520" fill="white"/>

  <!-- Creator (abstract) -->
  <rect x="60" y="30" width="260" height="110" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="190" y="50" font-size="15" text-anchor="middle" font-style="italic">NotificationSender</text>
  <text x="190" y="65" font-size="12" text-anchor="middle">(Creator, abstract)</text>
  <line x1="60" y1="72" x2="320" y2="72" stroke="black" stroke-width="1"/>
  <text x="72" y="90" font-size="12">+ Notify(수신자, 메시지)</text>
  <text x="72" y="108" font-size="12" font-style="italic">+ CreateNotification() : INotification</text>
  <text x="72" y="126" font-size="11" fill="#444">↳ 팩토리 메서드 (서브클래스가 재정의)</text>

  <!-- ConcreteCreators -->
  <rect x="20" y="220" width="180" height="70" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="110" y="242" font-size="14" text-anchor="middle">EmailNotificationSender</text>
  <text x="110" y="262" font-size="11" text-anchor="middle">(ConcreteCreator)</text>
  <text x="110" y="278" font-size="11" text-anchor="middle" font-style="italic">CreateNotification()</text>

  <rect x="220" y="220" width="180" height="70" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="310" y="242" font-size="14" text-anchor="middle">SmsNotificationSender</text>
  <text x="310" y="262" font-size="11" text-anchor="middle">(ConcreteCreator)</text>
  <text x="310" y="278" font-size="11" text-anchor="middle" font-style="italic">CreateNotification()</text>

  <!-- inheritance arrows from ConcreteCreators to Creator -->
  <line x1="110" y1="220" x2="180" y2="140" stroke="black" stroke-width="1" marker-end="url(#triangle)"/>
  <line x1="310" y1="220" x2="210" y2="140" stroke="black" stroke-width="1" marker-end="url(#triangle)"/>

  <!-- Product interface -->
  <rect x="480" y="30" width="240" height="90" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="600" y="50" font-size="15" text-anchor="middle" font-style="italic">&lt;&lt;interface&gt;&gt;</text>
  <text x="600" y="68" font-size="15" text-anchor="middle" font-style="italic">INotification</text>
  <line x1="480" y1="78" x2="720" y2="78" stroke="black" stroke-width="1"/>
  <text x="492" y="98" font-size="12">+ Send(수신자, 메시지)</text>

  <!-- ConcreteProducts -->
  <rect x="440" y="220" width="180" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="530" y="245" font-size="14" text-anchor="middle">EmailNotification</text>
  <text x="530" y="263" font-size="11" text-anchor="middle">(ConcreteProduct)</text>

  <rect x="640" y="220" width="180" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="730" y="245" font-size="14" text-anchor="middle">SmsNotification</text>
  <text x="730" y="263" font-size="11" text-anchor="middle">(ConcreteProduct)</text>

  <!-- realization arrows (dashed) -->
  <line x1="530" y1="220" x2="580" y2="120" stroke="black" stroke-width="1" stroke-dasharray="6,4" marker-end="url(#triangle)"/>
  <line x1="730" y1="220" x2="630" y2="120" stroke="black" stroke-width="1" stroke-dasharray="6,4" marker-end="url(#triangle)"/>

  <!-- dependency arrow Creator -> Product (creates) -->
  <line x1="320" y1="90" x2="480" y2="75" stroke="black" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#triangleSolid)"/>
  <text x="330" y="80" font-size="12" fill="#444">생성(creates)</text>

  <!-- dependency arrows from ConcreteCreators to matching ConcreteProduct -->
  <line x1="180" y1="255" x2="440" y2="248" stroke="black" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#triangleSolid)"/>
  <text x="215" y="240" font-size="11" fill="#444">생성</text>

  <line x1="400" y1="260" x2="640" y2="255" stroke="black" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#triangleSolid)"/>
  <text x="490" y="248" font-size="11" fill="#444">생성</text>

  <!-- caption box -->
  <rect x="60" y="360" width="660" height="130" fill="white" stroke="black" stroke-width="1"/>
  <text x="80" y="385" font-size="13" font-weight="bold">구조 설명</text>
  <text x="80" y="410" font-size="12">- Creator는 공통 흐름(Notify)과 팩토리 메서드(CreateNotification)를 정의한다.</text>
  <text x="80" y="432" font-size="12">- ConcreteCreator는 팩토리 메서드를 재정의해 특정 ConcreteProduct를 생성한다.</text>
  <text x="80" y="454" font-size="12">- 클라이언트는 Creator와 INotification(Product)에만 의존하므로,</text>
  <text x="80" y="474" font-size="12">  새로운 알림 종류를 추가할 때 기존 코드를 수정할 필요가 없다.</text>
</svg>

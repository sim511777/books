<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff" stroke="none"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">데코레이터가 객체를 겹겹이 감싸는 구조</text>

  <!-- Outer layer: WhippedCreamDecorator -->
  <rect x="60" y="60" width="520" height="360" rx="12" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="80" y="90" font-size="15" fill="#000000">WhippedCreamDecorator (+ 휘핑크림, +600원)</text>

  <!-- Layer 2: OatMilkDecorator -->
  <rect x="100" y="110" width="440" height="280" rx="12" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="120" y="140" font-size="15" fill="#000000">OatMilkDecorator (+ 오트밀크, +700원)</text>

  <!-- Layer 3: ExtraShotDecorator -->
  <rect x="140" y="160" width="360" height="200" rx="12" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="160" y="190" font-size="15" fill="#000000">ExtraShotDecorator (+ 샷추가, +500원)</text>

  <!-- Core: Latte -->
  <rect x="220" y="220" width="200" height="100" rx="10" fill="#f2f2f2" stroke="#000000" stroke-width="2"/>
  <text x="320" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Latte</text>
  <text x="320" y="290" text-anchor="middle" font-size="13" fill="#000000">(원본 객체, 4000원)</text>

  <!-- Arrow indicating GetCost() call direction inward -->
  <text x="320" y="410" text-anchor="middle" font-size="13" fill="#000000">GetCost() 호출은 바깥 → 안쪽으로 위임되고, 결과는 안 → 바깥 순서로 누적된다</text>

  <!-- small arrow -->
  <line x1="320" y1="330" x2="320" y2="360" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460">
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <!-- Client -->
  <rect x="30" y="190" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="230" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">Client</text>

  <!-- Arrow Client -> ITarget -->
  <line x1="170" y1="225" x2="260" y2="225" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="215" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">사용</text>

  <!-- ITarget interface -->
  <rect x="260" y="150" width="220" height="90" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="370" y="175" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000" font-style="italic">&#171;interface&#187;</text>
  <text x="370" y="196" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">IPaymentProcessor</text>
  <text x="370" y="220" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">+ Pay(amount, currency)</text>

  <!-- Arrow Adapter -> ITarget (implements) -->
  <line x1="370" y1="330" x2="370" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#arrowOpen)" stroke-dasharray="4,3"/>
  <text x="470" y="300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">구현(implements)</text>

  <!-- Adapter -->
  <rect x="260" y="330" width="220" height="90" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="370" y="355" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">GlobalGatewayAdapter</text>
  <text x="370" y="378" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">+ Pay(amount, currency)</text>
  <text x="370" y="398" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">- _adaptee : GlobalGateway</text>

  <!-- Arrow Adapter -> Adaptee (composition, has-a) -->
  <line x1="480" y1="375" x2="600" y2="375" stroke="#000000" stroke-width="2" marker-end="url(#diamond)"/>
  <text x="540" y="365" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">합성(has-a)</text>

  <!-- Adaptee -->
  <rect x="600" y="330" width="190" height="90" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="695" y="350" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000" font-style="italic">(기존 레거시 클래스)</text>
  <text x="695" y="373" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">GlobalGateway</text>
  <text x="695" y="396" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">+ Charge(cents, isoCode)</text>

  <!-- explanation text -->
  <text x="410" y="60" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">어댑터가 Adaptee를 감싸 Target 인터페이스로 노출한다</text>
  <text x="410" y="90" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#000000">Client는 IPaymentProcessor만 알고, Adapter 내부에서 GlobalGateway의 형식으로 변환해 호출한다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12" fill="none" stroke="#000000" stroke-width="2"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,6 L6,0 L12,6 L6,12 z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    </marker>
  </defs>
</svg>

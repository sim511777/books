<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', sans-serif">
  <!-- 배경 -->
  <rect x="0" y="0" width="640" height="420" fill="white"/>

  <!-- 제목 -->
  <text x="320" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="black">의존성 역전 원칙 (DIP)</text>

  <!-- 위쪽: 나쁜 예 -->
  <text x="120" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="black">DIP 적용 전</text>

  <rect x="30" y="80" width="180" height="55" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="120" y="112" font-size="13" text-anchor="middle" fill="black">고수준 모듈</text>
  <text x="120" y="128" font-size="11" text-anchor="middle" fill="black">(OrderService)</text>

  <line x1="120" y1="135" x2="120" y2="175" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="158" font-size="11" fill="black">직접 의존</text>

  <rect x="30" y="180" width="180" height="55" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="120" y="212" font-size="13" text-anchor="middle" fill="black">저수준 모듈</text>
  <text x="120" y="228" font-size="11" text-anchor="middle" fill="black">(MySqlOrderRepository)</text>

  <text x="120" y="270" font-size="11" text-anchor="middle" fill="black">→ 구현이 바뀌면 고수준 모듈도 같이 바뀐다</text>

  <!-- 구분선 -->
  <line x1="320" y1="55" x2="320" y2="330" stroke="black" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 아래쪽: 좋은 예 -->
  <text x="480" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="black">DIP 적용 후</text>

  <rect x="390" y="80" width="180" height="55" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="480" y="112" font-size="13" text-anchor="middle" fill="black">고수준 모듈</text>
  <text x="480" y="128" font-size="11" text-anchor="middle" fill="black">(OrderService)</text>

  <line x1="480" y1="135" x2="480" y2="175" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="158" font-size="11" fill="black">의존</text>

  <rect x="390" y="180" width="180" height="45" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="480" y="207" font-size="13" text-anchor="middle" fill="black">«interface»</text>
  <text x="480" y="222" font-size="12" text-anchor="middle" fill="black">IOrderRepository</text>

  <line x1="480" y1="270" x2="480" y2="230" stroke="black" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#hollowArrow)"/>
  <text x="540" y="255" font-size="11" fill="black">구현</text>

  <rect x="390" y="275" width="180" height="55" rx="6" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="480" y="300" font-size="13" text-anchor="middle" fill="black">저수준 모듈</text>
  <text x="480" y="316" font-size="11" text-anchor="middle" fill="black">(MySqlOrderRepository)</text>

  <text x="480" y="365" font-size="11" text-anchor="middle" fill="black">→ 양쪽 모두 인터페이스에 의존한다</text>
  <text x="480" y="382" font-size="11" text-anchor="middle" fill="black">→ 구현을 교체해도 고수준 모듈은 그대로</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
    <marker id="hollowArrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
  </defs>
</svg>

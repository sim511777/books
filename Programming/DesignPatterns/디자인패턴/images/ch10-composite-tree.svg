<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">컴포지트 패턴: Leaf와 Composite로 이루어진 트리</text>

  <!-- Interface note -->
  <rect x="330" y="50" width="240" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="70" font-size="13" text-anchor="middle" fill="#000000">&lt;&lt;interface&gt;&gt; IOrgUnit</text>
  <text x="450" y="87" font-size="11" text-anchor="middle" fill="#000000">GetTotalSalary(), GetHeadCount()</text>

  <!-- Root: 기술그룹 (Composite) -->
  <rect x="380" y="140" width="140" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="163" font-size="13" text-anchor="middle" fill="#000000">기술그룹</text>
  <text x="450" y="178" font-size="10" text-anchor="middle" fill="#000000">(Composite)</text>

  <line x1="450" y1="95" x2="450" y2="140" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Level 2: 개발본부 (Composite) -->
  <rect x="380" y="230" width="140" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="253" font-size="13" text-anchor="middle" fill="#000000">개발본부</text>
  <text x="450" y="268" font-size="10" text-anchor="middle" fill="#000000">(Composite)</text>
  <line x1="450" y1="185" x2="450" y2="230" stroke="#000000" stroke-width="1.5"/>

  <!-- 최민재 leaf under devDivision -->
  <rect x="580" y="230" width="140" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="650" y="253" font-size="13" text-anchor="middle" fill="#000000">최민재</text>
  <text x="650" y="268" font-size="10" text-anchor="middle" fill="#000000">(Leaf)</text>
  <line x1="520" y1="252" x2="580" y2="252" stroke="#000000" stroke-width="1.5"/>

  <!-- Level 3: 백엔드팀, 프론트엔드팀 (Composite) -->
  <rect x="150" y="330" width="140" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="220" y="353" font-size="13" text-anchor="middle" fill="#000000">백엔드팀</text>
  <text x="220" y="368" font-size="10" text-anchor="middle" fill="#000000">(Composite)</text>

  <rect x="330" y="330" width="140" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="353" font-size="13" text-anchor="middle" fill="#000000">프론트엔드팀</text>
  <text x="400" y="368" font-size="10" text-anchor="middle" fill="#000000">(Composite)</text>

  <line x1="420" y1="275" x2="220" y2="330" stroke="#000000" stroke-width="1.5"/>
  <line x1="440" y1="275" x2="400" y2="330" stroke="#000000" stroke-width="1.5"/>

  <!-- Level 4 leaves under backend -->
  <rect x="40" y="430" width="130" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="105" y="453" font-size="13" text-anchor="middle" fill="#000000">김도현</text>
  <text x="105" y="468" font-size="10" text-anchor="middle" fill="#000000">(Leaf)</text>

  <rect x="190" y="430" width="130" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="255" y="453" font-size="13" text-anchor="middle" fill="#000000">이서윤</text>
  <text x="255" y="468" font-size="10" text-anchor="middle" fill="#000000">(Leaf)</text>

  <line x1="200" y1="375" x2="105" y2="430" stroke="#000000" stroke-width="1.5"/>
  <line x1="240" y1="375" x2="255" y2="430" stroke="#000000" stroke-width="1.5"/>

  <!-- Level 4 leaf under frontend -->
  <rect x="340" y="430" width="130" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="405" y="453" font-size="13" text-anchor="middle" fill="#000000">박지훈</text>
  <text x="405" y="468" font-size="10" text-anchor="middle" fill="#000000">(Leaf)</text>

  <line x1="400" y1="375" x2="405" y2="430" stroke="#000000" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="60" y="520" width="24" height="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="95" y="537" font-size="12" fill="#000000">Composite (자식을 가진 부서 노드) - 요청을 자식에게 위임</text>

  <rect x="60" y="555" width="24" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="572" font-size="12" fill="#000000">Leaf (자식이 없는 개별 직원 노드) - 요청에 자신의 값을 반환</text>

  <line x1="60" y1="600" x2="90" y2="600" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="604" font-size="12" fill="#000000">부모 -&gt; 자식 (모두 IOrgUnit 인터페이스로 동일하게 호출)</text>
</svg>

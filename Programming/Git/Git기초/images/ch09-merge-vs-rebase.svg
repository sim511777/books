<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">merge vs rebase: same two branches, two different histories</text>

  <!-- Divider -->
  <line x1="480" y1="55" x2="480" y2="560" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===================== LEFT: merge ===================== -->
  <text x="240" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">git merge feature</text>
  <text x="240" y="92" text-anchor="middle" font-size="12" fill="#555555">(run from main)</text>

  <!-- main line: A -> F -> M -->
  <line x1="100" y1="280" x2="220" y2="280" stroke="#000000" stroke-width="2"/>
  <line x1="220" y1="280" x2="380" y2="280" stroke="#000000" stroke-width="2"/>

  <!-- feature line: A -> C -> D -> E -->
  <line x1="100" y1="280" x2="180" y2="180" stroke="#555555" stroke-width="2"/>
  <line x1="180" y1="180" x2="260" y2="180" stroke="#555555" stroke-width="2"/>
  <line x1="260" y1="180" x2="340" y2="180" stroke="#555555" stroke-width="2"/>

  <!-- E -> M merge edge -->
  <line x1="340" y1="180" x2="380" y2="280" stroke="#555555" stroke-width="2"/>

  <!-- commit dots: main -->
  <circle cx="100" cy="280" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">A</text>

  <circle cx="220" cy="280" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="220" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">F</text>

  <circle cx="380" cy="280" r="16" fill="#f2f2f2" stroke="#000000" stroke-width="2.5"/>
  <text x="380" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">M</text>

  <!-- commit dots: feature -->
  <circle cx="180" cy="180" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="180" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">C</text>

  <circle cx="260" cy="180" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="260" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">D</text>

  <circle cx="340" cy="180" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="340" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">E</text>

  <!-- branch labels -->
  <text x="60" y="284" text-anchor="end" font-size="12" fill="#000000">main</text>
  <text x="60" y="184" text-anchor="end" font-size="12" fill="#555555">feature</text>
  <text x="420" y="284" text-anchor="start" font-size="12" font-weight="bold" fill="#000000">HEAD</text>

  <!-- explanation box left -->
  <rect x="60" y="330" width="360" height="110" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="240" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Result: A - F - M (two parents: F, E)</text>
  <text x="240" y="374" text-anchor="middle" font-size="12" fill="#000000">M is a new merge commit joining</text>
  <text x="240" y="392" text-anchor="middle" font-size="12" fill="#000000">both branch tips (F and E).</text>
  <text x="240" y="414" text-anchor="middle" font-size="12" fill="#000000">C, D, E keep their original hashes.</text>

  <!-- ===================== RIGHT: rebase ===================== -->
  <text x="720" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">git rebase main</text>
  <text x="720" y="92" text-anchor="middle" font-size="12" fill="#555555">(run from feature, then fast-forward main)</text>

  <!-- linear line: A -> F -> C' -> D' -> E' -->
  <line x1="560" y1="230" x2="620" y2="230" stroke="#000000" stroke-width="2"/>
  <line x1="620" y1="230" x2="690" y2="230" stroke="#000000" stroke-width="2"/>
  <line x1="690" y1="230" x2="760" y2="230" stroke="#555555" stroke-width="2"/>
  <line x1="760" y1="230" x2="830" y2="230" stroke="#555555" stroke-width="2"/>
  <line x1="830" y1="230" x2="880" y2="230" stroke="#555555" stroke-width="2"/>

  <circle cx="560" cy="230" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="560" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">A</text>

  <circle cx="620" cy="230" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">F</text>

  <circle cx="690" cy="230" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="690" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">C'</text>

  <circle cx="760" cy="230" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="760" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">D'</text>

  <circle cx="830" cy="230" r="14" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="830" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">E'</text>

  <text x="520" y="234" text-anchor="end" font-size="12" fill="#000000">main</text>
  <text x="880" y="234" text-anchor="start" font-size="12" font-weight="bold" fill="#000000">HEAD</text>
  <text x="880" y="216" text-anchor="start" font-size="11" fill="#555555">feature</text>

  <!-- explanation box right -->
  <rect x="540" y="330" width="360" height="110" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="720" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Result: A - F - C' - D' - E' (single line)</text>
  <text x="720" y="374" text-anchor="middle" font-size="12" fill="#000000">C, D, E are replayed as new commits</text>
  <text x="720" y="392" text-anchor="middle" font-size="12" fill="#000000">C', D', E' (new hashes) on top of F.</text>
  <text x="720" y="414" text-anchor="middle" font-size="12" fill="#000000">No merge commit; history stays linear.</text>

  <!-- bottom summary -->
  <rect x="60" y="470" width="840" height="90" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="480" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Same starting point, same two branches, same final file contents -</text>
  <text x="480" y="518" text-anchor="middle" font-size="13" fill="#000000">merge preserves exactly what happened and when (a branching graph),</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#000000">rebase rewrites commits into a straight line as if they were made in order.</text>
</svg>

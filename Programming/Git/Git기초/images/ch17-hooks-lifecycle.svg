<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">Git Hooks: When Each Hook Runs</text>

  <!-- Column headers -->
  <text x="230" y="60" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">Commit flow</text>
  <text x="670" y="60" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">Push flow</text>

  <!-- Divider -->
  <line x1="450" y1="45" x2="450" y2="520" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== COMMIT FLOW (left column) ===== -->

  <!-- Step 1: git add -->
  <rect x="120" y="75" width="220" height="45" fill="#eef2ff" stroke="#000000" stroke-width="2"/>
  <text x="230" y="103" font-size="14" text-anchor="middle" fill="#000000">git add (stage files)</text>

  <line x1="230" y1="120" x2="230" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hook: pre-commit -->
  <rect x="110" y="150" width="240" height="55" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/>
  <text x="230" y="172" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">pre-commit hook</text>
  <text x="230" y="190" font-size="12" text-anchor="middle" fill="#333333">checks staged content</text>

  <line x1="230" y1="205" x2="230" y2="235" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: editor opens for message -->
  <rect x="120" y="235" width="220" height="45" fill="#eef2ff" stroke="#000000" stroke-width="2"/>
  <text x="230" y="263" font-size="14" text-anchor="middle" fill="#000000">write commit message</text>

  <line x1="230" y1="280" x2="230" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hook: commit-msg -->
  <rect x="110" y="310" width="240" height="55" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/>
  <text x="230" y="332" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">commit-msg hook</text>
  <text x="230" y="350" font-size="12" text-anchor="middle" fill="#333333">checks message format</text>

  <line x1="230" y1="365" x2="230" y2="395" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: commit created -->
  <rect x="120" y="395" width="220" height="45" fill="#e8ffe8" stroke="#000000" stroke-width="2"/>
  <text x="230" y="423" font-size="14" text-anchor="middle" fill="#000000">commit created</text>

  <line x1="230" y1="440" x2="230" y2="470" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hook: post-commit -->
  <rect x="110" y="470" width="240" height="45" fill="#f5f5f5" stroke="#888888" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="230" y="493" font-size="13" text-anchor="middle" fill="#444444">post-commit hook (optional, notify only)</text>

  <!-- ===== PUSH FLOW (right column) ===== -->

  <!-- Step 1: git push -->
  <rect x="560" y="75" width="220" height="45" fill="#eef2ff" stroke="#000000" stroke-width="2"/>
  <text x="670" y="103" font-size="14" text-anchor="middle" fill="#000000">git push</text>

  <line x1="670" y1="120" x2="670" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hook: pre-push -->
  <rect x="550" y="150" width="240" height="55" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/>
  <text x="670" y="172" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">pre-push hook</text>
  <text x="670" y="190" font-size="12" text-anchor="middle" fill="#333333">runs tests locally</text>

  <line x1="670" y1="205" x2="670" y2="235" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: data sent to remote -->
  <rect x="560" y="235" width="220" height="45" fill="#eef2ff" stroke="#000000" stroke-width="2"/>
  <text x="670" y="263" font-size="14" text-anchor="middle" fill="#000000">objects sent to remote</text>

  <line x1="670" y1="280" x2="670" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server hooks box -->
  <rect x="540" y="310" width="260" height="105" fill="#f0e8ff" stroke="#5b3a9e" stroke-width="2"/>
  <text x="670" y="332" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">server-side hooks</text>
  <text x="670" y="352" font-size="12" text-anchor="middle" fill="#333333">pre-receive / update /</text>
  <text x="670" y="368" font-size="12" text-anchor="middle" fill="#333333">post-receive</text>
  <text x="670" y="388" font-size="11" text-anchor="middle" fill="#5b3a9e">(handled by GitHub / GitLab)</text>

  <line x1="670" y1="415" x2="670" y2="445" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: branch updated on remote -->
  <rect x="560" y="445" width="220" height="45" fill="#e8ffe8" stroke="#000000" stroke-width="2"/>
  <text x="670" y="473" font-size="14" text-anchor="middle" fill="#000000">remote branch updated</text>

  <!-- Legend -->
  <rect x="30" y="530" width="16" height="16" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/>
  <text x="54" y="543" font-size="12" fill="#000000">hook: script runs here, exit 1 stops the operation</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>

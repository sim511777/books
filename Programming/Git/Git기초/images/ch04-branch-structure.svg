<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff" />

  <!-- Title -->
  <text x="400" y="32" font-size="18" text-anchor="middle" fill="#000000" font-weight="bold">Branches are pointers to commits</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- main line commits -->
  <circle cx="110" cy="150" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="110" y="155" font-size="14" text-anchor="middle" fill="#000000">C1</text>
  <text x="110" y="195" font-size="11" text-anchor="middle" fill="#000000">a1b2c3d</text>

  <circle cx="270" cy="150" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="270" y="155" font-size="14" text-anchor="middle" fill="#000000">C2</text>
  <text x="270" y="195" font-size="11" text-anchor="middle" fill="#000000">b7e91fa</text>
  <text x="270" y="212" font-size="11" text-anchor="middle" fill="#000000">(branch point)</text>

  <circle cx="430" cy="150" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="430" y="155" font-size="14" text-anchor="middle" fill="#000000">C3</text>
  <text x="430" y="195" font-size="11" text-anchor="middle" fill="#000000">c48d02e</text>

  <circle cx="590" cy="150" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="155" font-size="14" text-anchor="middle" fill="#000000">C4</text>
  <text x="590" y="195" font-size="11" text-anchor="middle" fill="#000000">d5f61ab</text>

  <!-- main line parent arrows (child -> parent) -->
  <line x1="566" y1="150" x2="454" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="406" y1="150" x2="294" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="246" y1="150" x2="134" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- feature branch commits -->
  <circle cx="430" cy="300" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="430" y="305" font-size="14" text-anchor="middle" fill="#000000">C5</text>
  <text x="430" y="345" font-size="11" text-anchor="middle" fill="#000000">e02a771</text>

  <circle cx="590" cy="300" r="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="305" font-size="14" text-anchor="middle" fill="#000000">C6</text>
  <text x="590" y="345" font-size="11" text-anchor="middle" fill="#000000">f139c60</text>

  <!-- feature branch parent arrows -->
  <line x1="413" y1="279" x2="287" y2="167" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="566" y1="300" x2="454" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- main branch label -->
  <rect x="555" y="55" width="70" height="34" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="77" font-size="14" text-anchor="middle" fill="#000000">main</text>
  <line x1="590" y1="89" x2="590" y2="124" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- feature/login branch label -->
  <rect x="530" y="360" width="120" height="34" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="382" font-size="13" text-anchor="middle" fill="#000000">feature/login</text>
  <line x1="590" y1="360" x2="590" y2="326" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- HEAD label -->
  <rect x="555" y="410" width="70" height="34" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="590" y="432" font-size="14" text-anchor="middle" fill="#000000">HEAD</text>
  <line x1="590" y1="410" x2="590" y2="396" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- explanatory text -->
  <text x="20" y="150" font-size="11" fill="#000000" text-anchor="start">main:</text>
  <text x="20" y="300" font-size="11" fill="#000000" text-anchor="start">feature/</text>
  <text x="20" y="313" font-size="11" fill="#000000" text-anchor="start">login:</text>
</svg>

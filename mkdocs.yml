site_name: 프로그래밍 학습 자료실
site_description: >-
  C, C++, C#, Java, Python, Go, Rust, Kotlin, Dart, Clojure, Haskell, Lisp, Ruby, Julia, Zig
  입문서와 디자인 패턴, 자료구조/알고리즘 책 모음
docs_dir: Programming
site_dir: public

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search:
      lang: ko

extra:
  generator: false

nav:
  - 홈: index.md
  - 프로그래밍 언어:
      - C: Languages/C/C기초/00-목차.md
      - "C++": Languages/Cpp/Cpp기초/00-목차.md
      - "C#": Languages/CSharp/CSharp기초/00-목차.md
      - Java: Languages/Java/Java기초/00-목차.md
      - Python: Languages/Python/Python기초/00-목차.md
      - Go: Languages/Go/Go기초/00-목차.md
      - Rust: Languages/Rust/Rust기초/00-목차.md
      - Kotlin: Languages/Kotlin/Kotlin기초/00-목차.md
      - Dart: Languages/Dart/Dart기초/00-목차.md
      - Clojure: Languages/Clojure/Clojure기초/00-목차.md
      - Haskell: Languages/Haskell/Haskell기초/00-목차.md
      - Lisp (Common Lisp): Languages/Lisp/Lisp기초/00-목차.md
      - Ruby: Languages/Ruby/Ruby기초/00-목차.md
      - Julia: Languages/Julia/Julia기초/00-목차.md
      - Zig: Languages/Zig/Zig기초/00-목차.md
  - 소프트웨어 설계:
      - "디자인 패턴 (C#)": DesignPatterns/디자인패턴/00-목차.md
  - 자료구조와 알고리즘:
      - "자료구조와 알고리즘 (C#)": DataStructuresAndAlgorithms/자료구조와알고리즘/00-목차.md
  - UI 프레임워크:
      - "Avalonia (C#)": Avalonia/Avalonia기초/00-목차.md
      - "Dear ImGui (C++)": ImGui/ImGui기초/00-목차.md
      - "Slint (C++)": Slint/Slint기초/00-목차.md
      - "Qt (C++)": Qt/Qt기초/00-목차.md
  - 개발 도구와 환경:
      - "VS Code로 구축하는 C++ 개발환경": Languages/Cpp/CppVSCode개발환경/00-목차.md
  - 동시성과 병렬 프로그래밍:
      - "동시성과 병렬 프로그래밍 (C#)": Concurrency/동시성과병렬프로그래밍/00-목차.md
  - 컴퓨터 비전:
      - "OpenCV (Python)": OpenCV/OpenCV로배우는컴퓨터비전/00-목차.md
  - 산업 자동화:
      - "장비 제어 소프트웨어 개발 (C#/.NET)": EquipmentControl/장비제어소프트웨어개발/00-목차.md
  - 게임 프로그래밍:
      - "raylib (C)": Raylib/Raylib기초/00-목차.md
      - "MonoGame (C#)": MonoGame/MonoGame기초/00-목차.md
  - 모바일 앱 개발:
      - "Flutter (Dart)": Flutter/Flutter기초/00-목차.md
